# Blueprint do Render para o SE7 Hub.
#
# Servico NOVO e separado: nao mexe no `se7-cobrancas` (se7-inadimplencia) nem
# na hospedagem do Laravel. Os tres rodam ao mesmo tempo durante a transicao.
#
# O banco nao esta descrito aqui de proposito: o Hub usa O MESMO Postgres do
# Supabase que o se7-cobrancas ja usa — DATABASE_URL e DIRECT_URL recebem
# exatamente os mesmos valores daquele servico. As tabelas do Hub ficam no
# schema `hub`, criadas por prisma/instalar-no-supabase.sql.
services:
  - type: web
    name: se7-hub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    # `prisma db push` nao roda aqui: em producao a conexao e pelo pooler de
    # transacao, por onde mudanca de schema nao passa. O schema vem de
    # prisma/instalar-no-supabase.sql, colado no SQL Editor do Supabase.
    #
    # O seed so garante a conta de ADMIN_EMAILS, e e idempotente. As turmas,
    # os planos e a escola de demonstracao NAO entram aqui: sao comandos
    # rodados a mao uma vez (npm run importar:turmas / importar:planos), e
    # repeti-los a cada deploy so gastaria tempo de partida.
    startCommand: node dist/db/seed.js && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: America/Fortaleza
      - key: JWT_SECRET
        generateValue: true
      # Copie o mesmo valor do servico se7-cobrancas: e o que faz o cronograma
      # ser a mesma tabela nos dois sistemas.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Valvula de escape: com ela, as contas de ADMIN_EMAILS ganham login por
      # e-mail e senha alem do Google. Sem Google configurado, e a unica porta.
      - key: SEED_ADMIN_SENHA
        sync: false
      # Asaas. A chave sozinha NAO faz o sistema cobrar: com ela, o Hub apenas
      # consulta faturas e cobrancas vencidas — leitura, inofensiva com os dois
      # sistemas no ar. Quem autoriza EMITIR e a configuracao `asaas.emissaoAtiva`
      # no banco, desligada por padrao e ligada so por um ADMIN, pela tela.
      - key: ASAAS_API_KEY
        sync: false
      # Busca de endereco por CEP. Nao precisa ser preenchida: sem ela o Hub
      # usa o ViaCEP, que e gratuito e nao pede chave. Esta aqui para trocar de
      # provedor sem mexer no codigo — e porque a matricula NUNCA depende dela:
      # falhando a busca, a familia digita o endereco.
      - key: CEP_BASE_URL
        value: https://viacep.com.br/ws
      # MySQL do Laravel. NAO e mais necessario para o sistema funcionar: a
      # escola mora no Postgres do Hub. Estas variaveis servem so a importacao
      # unica dos alunos, quando ela acontecer — e podem ficar vazias ate la.
      - key: LEGACY_MYSQL_HOST
        sync: false
      - key: LEGACY_MYSQL_USER
        sync: false
      - key: LEGACY_MYSQL_PASSWORD
        sync: false
      - key: LEGACY_MYSQL_DATABASE
        sync: false
