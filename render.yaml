# Blueprint do Render para o SE7 Hub.
#
# Servico NOVO e separado: nao mexe no `se7-cobrancas` (se7-inadimplencia) nem
# na hospedagem do Laravel. Os tres rodam ao mesmo tempo durante a transicao.
#
# O banco nao esta descrito aqui de proposito: o Hub usa O MESMO Postgres do
# Supabase que o se7-cobrancas ja usa — DATABASE_URL recebe exatamente o mesmo
# valor daquele servico. DIRECT_URL nao entra na lista: ela so serve ao CLI do
# Prisma, e o codigo a iguala a DATABASE_URL quando esta vazia. As tabelas do
# Hub ficam no schema `hub`, criadas por prisma/instalar-no-supabase.sql.
services:
  - type: web
    name: se7-hub
    runtime: node
    # O plano gratuito hiberna depois de alguns minutos parado, e a primeira
    # visita depois disso demora uns 30s. O fechamento das 23:59 nao se perde
    # por causa disso: na volta o sistema reconstroi os dias que faltaram e
    # marca cada um como RECONSTRUIDO, para a tela nao apresentar reconstrucao
    # com cara de exato. Para o numero do dia ser sempre exato, o plano pago.
    plan: free
    region: oregon
    # O ramo fica escrito aqui de proposito. O Blueprint do Render, sem esta
    # linha, constroi o ramo padrao do repositorio — que NAO tem nada disto — e
    # o servico subiria verde, com o codigo errado. Uma linha aqui vale mais do
    # que uma instrucao para lembrar de trocar o ramo na tela.
    branch: claude/se7-volei-praia-code-review-ds0fmj
    buildCommand: npm install && npm run build
    # `prisma db push` nao roda aqui: em producao a conexao e pelo pooler de
    # transacao, por onde mudanca de schema nao passa. O schema vem de
    # prisma/instalar-no-supabase.sql, colado no SQL Editor do Supabase.
    #
    # O seed so garante a conta de ADMIN_EMAILS, e e idempotente. As turmas, os
    # planos e os alunos NAO entram aqui: sao comandos rodados a mao uma vez
    # (importar:turmas, importar:planos, importar:dump), e repeti-los a cada
    # deploy so gastaria tempo de partida.
    startCommand: node dist/db/seed.js && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: America/Fortaleza
      - key: JWT_SECRET
        generateValue: true
      # Copie o mesmo valor do servico se7-cobrancas: e o que faz o cronograma
      # ser a mesma tabela nos dois sistemas.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Os donos, separados dos administradores de proposito: ADMIN administra
      # a escola, SOCIO ve o resultado dela. O mesmo e-mail costuma estar nas
      # duas listas. Esta variavel existe porque so socio convida socio — sem
      # ela a area dos socios nasceria sem ninguem que pudesse entrar.
      - key: SOCIO_EMAILS
        sync: false
      # Valvula de escape: com ela, as contas de ADMIN_EMAILS ganham login por
      # e-mail e senha alem do Google. Sem Google configurado, e a unica porta.
      - key: SEED_ADMIN_SENHA
        sync: false
      # Asaas. A chave sozinha NAO faz o sistema cobrar: com ela, o Hub apenas
      # consulta faturas e cobrancas vencidas — leitura, inofensiva com os dois
      # sistemas no ar. Quem autoriza EMITIR e a configuracao `asaas.emissaoAtiva`
      # no banco, desligada por padrao e ligada so por um ADMIN, pela tela.
      - key: ASAAS_API_KEY
        sync: false
      # Busca de endereco por CEP. Nao precisa ser preenchida: sem ela o Hub
      # usa o ViaCEP, que e gratuito e nao pede chave. Esta aqui para trocar de
      # provedor sem mexer no codigo — e porque a matricula NUNCA depende dela:
      # falhando a busca, a familia digita o endereco.
      - key: CEP_BASE_URL
        value: https://viacep.com.br/ws
      # Numero de WhatsApp da escola, so digitos com DDI (ex: 5583999999999).
      # Usado no botao "Fale conosco" da pagina de entrada. Sem ela o botao
      # nao aparece, em vez de virar um link quebrado.
      - key: WHATSAPP_COMERCIAL
        sync: false
      # MySQL do Laravel. NAO e mais necessario para o sistema funcionar: a
      # escola mora no Postgres do Hub. Estas variaveis servem so a importacao
      # unica dos alunos, quando ela acontecer — e podem ficar vazias ate la.
      - key: LEGACY_MYSQL_HOST
        sync: false
      - key: LEGACY_MYSQL_USER
        sync: false
      - key: LEGACY_MYSQL_PASSWORD
        sync: false
      - key: LEGACY_MYSQL_DATABASE
        sync: false
