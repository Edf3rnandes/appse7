# Blueprint do Render para o SE7 Hub.
#
# Servico NOVO e separado: nao mexe no `se7-cobrancas` (se7-inadimplencia) nem
# na hospedagem do Laravel. Os tres rodam ao mesmo tempo durante a transicao.
#
# O banco nao esta descrito aqui de proposito: o Hub usa O MESMO Postgres do
# Supabase que o se7-cobrancas ja usa — DATABASE_URL e DIRECT_URL recebem
# exatamente os mesmos valores daquele servico. As tabelas do Hub ficam no
# schema `hub`, criadas por prisma/instalar-no-supabase.sql.
services:
  - type: web
    name: se7-hub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    # `prisma db push` nao roda aqui: em producao a conexao e pelo pooler de
    # transacao, por onde mudanca de schema nao passa. Schema se aplica a parte,
    # com DIRECT_URL. O seed e idempotente e pode repetir.
    startCommand: node dist/db/seed.js && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: America/Fortaleza
      - key: JWT_SECRET
        generateValue: true
      # Copie o mesmo valor do servico se7-cobrancas: e o que faz o cronograma
      # ser a mesma tabela nos dois sistemas.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      # Endereco do sistema Laravel, usado so para GRAVAR frequencia
      # (ex.: https://sistema.se7volei.com.br). Sem isso o app sobe e apenas o
      # envio da chamada responde 503.
      - key: LEGACY_API_URL
        sync: false
      # Liberar so quando o usuario somente-leitura do MySQL existir.
      - key: LEGACY_MYSQL_HOST
        sync: false
      - key: LEGACY_MYSQL_USER
        sync: false
      - key: LEGACY_MYSQL_PASSWORD
        sync: false
      - key: LEGACY_MYSQL_DATABASE
        sync: false
