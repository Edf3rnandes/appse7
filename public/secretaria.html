<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Secretaria · SE7 Vôlei de Praia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d6f7a'/%3E%3Cpath d='M16 1c6 6 6 24 0 30M1 16c8-5 22-5 30 0M6 5c2 8 8 17 16 22' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topo">
  <div class="marca"><span class="se7">SE7</span><span class="sub">Secretaria</span></div>
  <div class="espaco"></div>
  <div class="usuario oculto" id="boxUsuario">
    <img id="avatar" alt="" hidden>
    <span class="nome" id="nomeUsuario"></span>
    <button class="botao fantasma" id="btnSair" type="button">Sair</button>
  </div>
</header>

<main class="centro" id="telaLogin" hidden>
  <h1 style="font-size:26px">Secretaria</h1>
  <p style="color:var(--ink-2);margin:14px 0 28px">
    Programação de treino e agenda de eventos — é daqui que sai o que o professor vê no app.
  </p>
  <div id="botaoGoogle" style="display:flex;justify-content:center"></div>
  <div class="aviso erro oculto" id="erroLogin" style="margin-top:22px;text-align:left"></div>
</main>

<main class="centro" id="telaSemPermissao" hidden>
  <h1 style="font-size:22px">Conta sem acesso à secretaria</h1>
  <p style="color:var(--ink-2);margin:14px 0 24px">
    Você entrou como <strong id="emailSemPermissao"></strong>, mas essa conta não tem perfil de
    secretaria nem de administrador.
  </p>
  <button class="botao fantasma" type="button" id="btnTrocar">Entrar com outra conta</button>
</main>

<main class="pagina" id="telaApp" hidden>
  <div class="abas" role="tablist">
    <button class="aba" role="tab" id="abaSemanas" aria-selected="true"  data-painel="painelSemanas">Cronograma</button>
    <button class="aba" role="tab" id="abaEventos" aria-selected="false" data-painel="painelEventos">Eventos</button>
    <button class="aba" role="tab" id="abaAcessos" aria-selected="false" data-painel="painelAcessos">Acessos</button>
  </div>

  <section id="painelSemanas" role="tabpanel" aria-labelledby="abaSemanas">
    <div class="carregando">Carregando…</div>
  </section>
  <section id="painelEventos" role="tabpanel" aria-labelledby="abaEventos" hidden>
    <div class="carregando">Carregando…</div>
  </section>
  <section id="painelAcessos" role="tabpanel" aria-labelledby="abaAcessos" hidden>
    <div class="carregando">Carregando…</div>
  </section>
</main>

<script type="module">
import { Sessao, ErroApi, api, fmt, escapar, iniciarGoogle, prepararImagem } from "/app.js";

const el = (id) => document.getElementById(id);
const telas = { login: el("telaLogin"), semPermissao: el("telaSemPermissao"), app: el("telaApp") };

function mostrar(nome) {
  for (const [chave, node] of Object.entries(telas)) node.hidden = chave !== nome;
  el("boxUsuario").classList.toggle("oculto", nome === "login");
}
function pintarUsuario() {
  const u = Sessao.usuario;
  if (!u) return;
  el("nomeUsuario").textContent = u.nome || u.email || "";
  const img = el("avatar");
  if (u.avatarUrl) { img.src = u.avatarUrl; img.hidden = false; } else { img.hidden = true; }
}
function sair() { Sessao.limpar(); mostrar("login"); }
el("btnSair").addEventListener("click", sair);
el("btnTrocar").addEventListener("click", sair);

function aviso(e) {
  const classe = e instanceof ErroApi && e.status === 503 ? "alerta" : "erro";
  return `<div class="aviso ${classe}">${escapar(e.message)}</div>`;
}

const TIPOS = {
  TREINO_ESPECIAL: "Treino especial", CAMPEONATO: "Campeonato", FESTIVAL: "Festival",
  REUNIAO: "Reunião", AVALIACAO: "Avaliação", FERIADO: "Feriado", OUTRO: "Outro",
};

// A semana é sempre identificada pela segunda-feira, dos dois lados. Aqui a
// conta é feita no fuso local, para "hoje" ser o hoje de quem está digitando.
function segundaDaSemana(iso) {
  const [ano, mes, dia] = iso.split("-").map(Number);
  const d = new Date(ano, mes - 1, dia);
  const semana = d.getDay();
  d.setDate(d.getDate() + (semana === 0 ? -6 : 1 - semana));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function intervaloDaSemana(isoSegunda) {
  const [ano, mes, dia] = isoSegunda.split("-").map(Number);
  const fim = new Date(ano, mes - 1, dia + 6);
  return `${fmt.data(isoSegunda)} a ${fim.toLocaleDateString("pt-BR")}`;
}

// ------------------------------------------------------------------ entrar
async function entrarComGoogle(idToken) {
  try {
    const r = await api("/auth/google", { method: "POST", body: JSON.stringify({ idToken }) });
    Sessao.token = r.token;
    Sessao.usuario = r.usuario;
    pintarUsuario();
    decidirTela();
  } catch (e) {
    el("erroLogin").textContent = e.message;
    el("erroLogin").classList.remove("oculto");
  }
}

async function decidirTela() {
  try {
    const eu = await api("/auth/eu");
    const podeEntrar = eu.papeis.includes("ADMIN") || eu.papeis.includes("SECRETARIA");
    if (!podeEntrar) {
      el("emailSemPermissao").textContent = eu.email || "";
      return mostrar("semPermissao");
    }
    mostrar("app");
    pintarUsuario();
    carregarSemanas();
    carregarEventos();
    carregarAcessos();
  } catch {
    sair();
  }
}

const abas = [...document.querySelectorAll(".aba")];
abas.forEach((aba) => aba.addEventListener("click", () => {
  abas.forEach((outra) => {
    const ativa = outra === aba;
    outra.setAttribute("aria-selected", String(ativa));
    el(outra.dataset.painel).hidden = !ativa;
  });
}));

// =============================================================== CRONOGRAMA
let semanas = [];
// undefined = mantém a arte que já está gravada; null = apagar; string = nova.
let arteEmEdicao;
let arteNomeEmEdicao;

const STATUS_CRONOGRAMA = {
  planejado: ["neutra", "Planejado"],
  pronto: ["alerta", "Pronto"],
  publicado: ["ok", "Publicado"],
};

async function carregarSemanas() {
  const painel = el("painelSemanas");
  try {
    semanas = await api("/conteudo/cronograma?limite=20");
    arteEmEdicao = undefined;
    arteNomeEmEdicao = undefined;
    painel.innerHTML = formSemana() + listaSemanas();
    ligarFormSemana();
  } catch (e) {
    painel.innerHTML = aviso(e);
  }
}

function formSemana(s = null) {
  const hoje = fmt.hojeIso();
  const semana = s ? String(s.semana).slice(0, 10) : segundaDaSemana(hoje);
  const v = (campo) => (s && s[campo] ? escapar(s[campo]) : "");

  return `
    <form class="cartao" id="formSemana" style="margin-bottom:22px">
      <h2 style="font-size:18px;margin-bottom:4px">${s ? "Editar semana" : "Cronograma da semana"}</h2>
      <p class="meta" style="margin:0 0 16px">
        Escolha qualquer dia: a semana é gravada pela segunda-feira, então salvar de novo
        a mesma semana corrige em vez de duplicar.
      </p>

      <div class="form-grade">
        <div class="campo">
          <label class="rotulo" for="semana">Semana</label>
          <input type="date" id="semana" value="${semana}" required>
          <span class="ajuda" id="intervaloSemana">${intervaloDaSemana(semana)}</span>
        </div>
        <div class="campo">
          <label class="rotulo" for="tema">Tema</label>
          <input id="tema" maxlength="200" placeholder="Recepção e passe" value="${v("tema")}">
        </div>
        <div class="campo largo">
          <label class="rotulo" for="fundamentos">Fundamentos</label>
          <textarea id="fundamentos" rows="2" maxlength="2000"
            placeholder="O que treinar nesta semana">${v("fundamentos")}</textarea>
        </div>
        <div class="campo largo">
          <label class="rotulo" for="exercicios">Exercícios sugeridos</label>
          <textarea id="exercicios" rows="4" maxlength="4000"
            placeholder="1) …&#10;2) …">${v("exerciciosSugeridos")}</textarea>
        </div>
        <div class="campo largo">
          <label class="rotulo" for="observacoes">Observações para o professor</label>
          <textarea id="observacoes" rows="2" maxlength="2000"
            placeholder="Maré, quadra, material">${v("observacoes")}</textarea>
        </div>

        <div class="campo largo">
          <label class="rotulo">Arte da semana</label>
          <div class="arte" id="boxArte">
            <div id="previaArte">
              ${s?.imagemNome
                ? `<div class="vazio-arte">Arte enviada: <strong>${escapar(s.imagemNome)}</strong>.
                     Escolha outro arquivo para substituir.</div>`
                : `<div class="vazio-arte">Nenhuma arte enviada ainda.</div>`}
            </div>
            <input type="file" id="arquivoArte" accept="image/*">
            <div class="barra-acoes">
              <button class="botao fantasma pequeno" type="button" id="btnRemoverArte"
                ${s?.imagemNome ? "" : "hidden"}>Remover arte</button>
              <span class="ajuda" id="infoArte"></span>
            </div>
          </div>
        </div>

        <div class="campo largo">
          <label class="rotulo" for="textoDivulgacao">Texto de divulgação</label>
          <textarea id="textoDivulgacao" rows="3" maxlength="4000"
            placeholder="O texto que vai junto com a arte nos grupos">${v("textoDivulgacao")}</textarea>
        </div>
        <div class="campo largo">
          <label class="rotulo" for="postagens">Postagens planejadas</label>
          <textarea id="postagens" rows="2" maxlength="2000"
            placeholder="Cronograma de posts do Instagram desta semana">${v("postagensPlanejadas")}</textarea>
        </div>

        <div class="campo largo">
          <label class="rotulo" for="linkCanva">Link do Canva</label>
          <input id="linkCanva" type="url" maxlength="500"
                 placeholder="https://www.canva.com/design/…" value="${v("linkCanva")}">
          <span class="ajuda">Uso interno da equipe — não aparece no app do professor.</span>
        </div>

        <div class="campo">
          <label class="rotulo" for="status">Situação</label>
          <select id="status">
            <option value="planejado" ${s?.status === "planejado" || !s ? "selected" : ""}>Planejado</option>
            <option value="pronto" ${s?.status === "pronto" ? "selected" : ""}>Pronto</option>
            <option value="publicado" ${s?.status === "publicado" ? "selected" : ""}>Publicado</option>
          </select>
          <span class="ajuda">Só "Publicado" chega ao professor.</span>
        </div>
      </div>

      <div class="barra-acoes" style="margin-top:16px">
        <button class="botao" type="submit" id="btnSalvarSemana">Salvar semana</button>
        ${s ? `<button class="botao fantasma" type="button" id="btnCancelarSemana">Cancelar</button>` : ""}
      </div>
      <div class="aviso oculto" id="recadoSemana" style="margin-top:12px"></div>
    </form>`;
}

function listaSemanas() {
  if (!semanas.length) {
    return `<div class="vazio">Nenhuma semana cadastrada ainda.</div>`;
  }
  return `<div class="cartao">
    <div class="rotulo" style="margin-bottom:8px">Semanas do cronograma</div>
    ${semanas.map((s) => `
      <div class="item">
        <div class="corpo">
          <div class="titulo">${escapar(s.tema || "Sem tema")}</div>
          <div class="detalhe">${intervaloDaSemana(String(s.semana).slice(0, 10))}</div>
        </div>
        <div class="lado">
          ${s.imagemNome ? `<span class="selo-arte">com arte</span>` : ""}
          <span class="pilula ${(STATUS_CRONOGRAMA[s.status] || ["neutra", s.status])[0]}">${(STATUS_CRONOGRAMA[s.status] || ["neutra", s.status])[1]}</span>
          <button class="botao secundario pequeno" type="button" data-editar-semana="${s.id}">Editar</button>
        </div>
      </div>`).join("")}
  </div>`;
}

function ligarFormSemana(editando = null) {
  const form = el("formSemana");

  el("semana").addEventListener("change", (e) => {
    if (e.target.value) el("intervaloSemana").textContent = intervaloDaSemana(segundaDaSemana(e.target.value));
  });

  // ---- arte da semana ----
  el("arquivoArte").addEventListener("change", async (evento) => {
    const arquivo = evento.target.files?.[0];
    if (!arquivo) return;

    const info = el("infoArte");
    info.textContent = "Preparando a imagem…";

    try {
      const { dataUrl, nome, largura, altura } = await prepararImagem(arquivo);
      arteEmEdicao = dataUrl;
      arteNomeEmEdicao = nome;

      el("previaArte").innerHTML = `<img src="${dataUrl}" alt="Prévia da arte da semana">`;
      el("btnRemoverArte").hidden = false;

      const kb = Math.round((dataUrl.length * 3) / 4 / 1024);
      info.textContent = `${largura}×${altura} · ~${kb} KB depois de reduzida`;
    } catch (e) {
      info.textContent = "";
      const recado = el("recadoSemana");
      recado.className = "aviso erro";
      recado.textContent = e.message;
    }
  });

  el("btnRemoverArte").addEventListener("click", () => {
    arteEmEdicao = null;          // null pede ao servidor para apagar
    arteNomeEmEdicao = null;
    el("arquivoArte").value = "";
    el("previaArte").innerHTML = `<div class="vazio-arte">A arte será removida ao salvar.</div>`;
    el("infoArte").textContent = "";
    el("btnRemoverArte").hidden = true;
  });

  form.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const recado = el("recadoSemana");
    const botao = el("btnSalvarSemana");
    recado.classList.add("oculto");
    botao.disabled = true;
    botao.textContent = "Salvando…";

    const corpo = {
      semana: segundaDaSemana(el("semana").value),
      tema: el("tema").value.trim() || undefined,
      fundamentos: el("fundamentos").value.trim() || undefined,
      exerciciosSugeridos: el("exercicios").value.trim() || undefined,
      observacoes: el("observacoes").value.trim() || undefined,
      textoDivulgacao: el("textoDivulgacao").value.trim() || undefined,
      postagensPlanejadas: el("postagens").value.trim() || undefined,
      linkCanva: el("linkCanva").value.trim() || undefined,
      status: el("status").value,
    };

    // Só manda a imagem quando ela mudou: sem isso, cada gravação reenviaria
    // a arte inteira de volta ao servidor sem necessidade.
    if (arteEmEdicao !== undefined) {
      corpo.imagemBase64 = arteEmEdicao;
      corpo.imagemNome = arteNomeEmEdicao;
    }

    try {
      await api("/conteudo/cronograma", { method: "PUT", body: JSON.stringify(corpo) });
      await carregarSemanas();
      const novo = el("recadoSemana");
      novo.className = "aviso info";
      novo.textContent = "Semana salva.";
    } catch (e) {
      recado.className = "aviso erro";
      recado.textContent = e.message;
      botao.disabled = false;
      botao.textContent = "Salvar semana";
    }
  });

  el("painelSemanas").querySelectorAll("[data-editar-semana]").forEach((b) => {
    b.addEventListener("click", async () => {
      // A listagem vem sem a arte; a semana inteira é buscada ao abrir para
      // editar, para a prévia mostrar o que está gravado de fato.
      try {
        const s = await api(`/conteudo/cronograma/${b.dataset.editarSemana}`);
        arteEmEdicao = undefined;
        arteNomeEmEdicao = undefined;

        el("painelSemanas").innerHTML = formSemana(s) + listaSemanas();
        ligarFormSemana(s);

        if (s.imagemBase64) {
          el("previaArte").innerHTML = `<img src="${s.imagemBase64}" alt="Arte da semana">`;
          el("btnRemoverArte").hidden = false;
        }
        el("btnCancelarSemana")?.addEventListener("click", () => carregarSemanas());
        el("formSemana").scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (e) {
        const painel = el("painelSemanas");
        painel.insertAdjacentHTML("afterbegin", aviso(e));
      }
    });
  });
}

// ================================================================== EVENTOS
let eventos = [];
let unidades = [];

async function carregarEventos() {
  const painel = el("painelEventos");
  try {
    eventos = await api("/conteudo/eventos");

    // As unidades vêm do sistema atual. Se a ponte não estiver ligada, o campo
    // continua sendo texto livre — a tela não depende disso para funcionar.
    if (!unidades.length) {
      unidades = await api("/escola/ocupacao").catch(() => []);
    }

    painel.innerHTML = formEvento() + listaEventos();
    ligarFormEvento();
  } catch (e) {
    painel.innerHTML = aviso(e);
  }
}

function formEvento(ev = null) {
  const d = (v) => (v ? String(v).slice(0, 10) : "");
  return `
    <form class="cartao" id="formEvento" style="margin-bottom:22px">
      <h2 style="font-size:18px;margin-bottom:16px">${ev ? "Editar evento" : "Novo evento"}</h2>
      <input type="hidden" id="eventoId" value="${ev ? escapar(ev.id) : ""}">

      <div class="form-grade">
        <div class="campo largo">
          <label class="rotulo" for="titulo">Título</label>
          <input id="titulo" maxlength="200" required placeholder="Festival Interno de Duplas"
                 value="${ev ? escapar(ev.titulo) : ""}">
        </div>
        <div class="campo">
          <label class="rotulo" for="tipo">Tipo</label>
          <select id="tipo">
            ${Object.entries(TIPOS).map(([valor, texto]) => `
              <option value="${valor}" ${ev?.tipo === valor ? "selected" : ""}>${texto}</option>`).join("")}
          </select>
        </div>
        <div class="campo">
          <label class="rotulo" for="data">Data</label>
          <input type="date" id="data" required value="${d(ev?.data) || fmt.hojeIso()}">
        </div>
        <div class="campo">
          <label class="rotulo" for="dataFim">Termina em <span class="ajuda">(opcional)</span></label>
          <input type="date" id="dataFim" value="${d(ev?.dataFim)}">
        </div>
        <div class="campo">
          <label class="rotulo" for="horario">Horário</label>
          <input id="horario" maxlength="60" placeholder="08:00 às 12:00"
                 value="${ev ? escapar(ev.horario || "") : ""}">
        </div>
        <div class="campo">
          <label class="rotulo" for="local">Local</label>
          <input id="local" maxlength="200" placeholder="Arena Bessa"
                 value="${ev ? escapar(ev.local || "") : ""}">
        </div>
        <div class="campo">
          <label class="rotulo" for="unidade">Unidade</label>
          <input id="unidade" list="listaUnidades" maxlength="120"
                 placeholder="Deixe vazio para todas"
                 value="${ev ? escapar(ev.unidadeNome || "") : ""}">
          <datalist id="listaUnidades">
            ${unidades.map((u) => `<option value="${escapar(u.unidadeNome)}"></option>`).join("")}
          </datalist>
        </div>
        <div class="campo largo">
          <label class="rotulo" for="descricao">Descrição</label>
          <textarea id="descricao" rows="3" maxlength="2000"
            placeholder="O que os professores precisam saber">${ev ? escapar(ev.descricao || "") : ""}</textarea>
        </div>
        <label class="interruptor largo">
          <input type="checkbox" id="eventoPublicado" ${ev?.publicado ? "checked" : ""}>
          <span>Publicar para os professores</span>
        </label>
      </div>

      <div class="barra-acoes" style="margin-top:16px">
        <button class="botao" type="submit" id="btnSalvarEvento">${ev ? "Salvar alterações" : "Criar evento"}</button>
        ${ev ? `<button class="botao fantasma" type="button" id="btnCancelarEvento">Cancelar</button>
                <button class="botao perigo pequeno" type="button" id="btnApagarEvento">Apagar</button>` : ""}
      </div>
      <div class="aviso oculto" id="recadoEvento" style="margin-top:12px"></div>
    </form>`;
}

function listaEventos() {
  if (!eventos.length) return `<div class="vazio">Nenhum evento cadastrado ainda.</div>`;

  return `<div class="cartao">
    <div class="rotulo" style="margin-bottom:8px">Eventos cadastrados</div>
    ${eventos.map((ev) => `
      <div class="item">
        <div class="corpo">
          <div class="titulo">${escapar(ev.titulo)}</div>
          <div class="detalhe">
            ${fmt.diaCurto(ev.data)}${ev.dataFim ? ` até ${fmt.diaCurto(ev.dataFim)}` : ""} ·
            ${escapar(TIPOS[ev.tipo] || "Evento")} ·
            ${escapar(ev.unidadeNome || "Todas as unidades")}
          </div>
        </div>
        <div class="lado">
          <span class="pilula ${ev.publicado ? "ok" : "neutra"}">${ev.publicado ? "Publicado" : "Rascunho"}</span>
          <button class="botao secundario pequeno" type="button" data-editar-evento="${ev.id}">Editar</button>
        </div>
      </div>`).join("")}
  </div>`;
}

function ligarFormEvento(editando = null) {
  const form = el("formEvento");

  form.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const recado = el("recadoEvento");
    const botao = el("btnSalvarEvento");
    recado.classList.add("oculto");
    botao.disabled = true;
    botao.textContent = "Salvando…";

    const id = el("eventoId").value;
    const unidadeNome = el("unidade").value.trim();
    // O id da unidade no sistema atual acompanha o nome quando ele veio da
    // lista; digitado à mão, fica só o nome.
    const unidade = unidades.find((u) => u.unidadeNome === unidadeNome);

    const corpo = {
      titulo: el("titulo").value.trim(),
      tipo: el("tipo").value,
      data: el("data").value,
      dataFim: el("dataFim").value || undefined,
      horario: el("horario").value.trim() || undefined,
      local: el("local").value.trim() || undefined,
      unidadeNome: unidadeNome || undefined,
      unidadeIdLegacy: unidade ? unidade.unidadeId : undefined,
      descricao: el("descricao").value.trim() || undefined,
      publicado: el("eventoPublicado").checked,
    };

    try {
      await api(id ? `/conteudo/eventos/${id}` : "/conteudo/eventos", {
        method: id ? "PUT" : "POST",
        body: JSON.stringify(corpo),
      });
      await carregarEventos();
      const novo = el("recadoEvento");
      novo.className = "aviso info";
      novo.textContent = id ? "Evento atualizado." : "Evento criado.";
    } catch (e) {
      recado.className = "aviso erro";
      recado.textContent = e.message;
      botao.disabled = false;
      botao.textContent = id ? "Salvar alterações" : "Criar evento";
    }
  });

  el("btnApagarEvento")?.addEventListener("click", async () => {
    if (!confirm("Apagar este evento? Não dá para desfazer.")) return;
    try {
      await api(`/conteudo/eventos/${el("eventoId").value}`, { method: "DELETE" });
      await carregarEventos();
    } catch (e) {
      const recado = el("recadoEvento");
      recado.className = "aviso erro";
      recado.textContent = e.message;
    }
  });

  el("btnCancelarEvento")?.addEventListener("click", () => carregarEventos());

  el("painelEventos").querySelectorAll("[data-editar-evento]").forEach((b) => {
    b.addEventListener("click", () => {
      const ev = eventos.find((x) => x.id === b.dataset.editarEvento);
      el("painelEventos").innerHTML = formEvento(ev) + listaEventos();
      ligarFormEvento(ev);
      el("formEvento").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
}

// ================================================================== ACESSOS
let convites = [];
let usuarios = [];
let professores = [];
let souAdmin = false;

const PAPEIS = {
  ADMIN: "Administrador", SECRETARIA: "Secretaria",
  PROFESSOR: "Professor", RESPONSAVEL: "Responsável",
};

async function carregarAcessos() {
  const painel = el("painelAcessos");
  try {
    souAdmin = (Sessao.usuario?.papeis || []).includes("ADMIN");

    [convites, usuarios] = await Promise.all([
      api("/auth/convites"),
      api("/auth/usuarios"),
    ]);

    // Vem do sistema atual: sem a ponte ligada o campo vira número digitado à
    // mão, e a tela continua funcionando.
    if (!professores.length) professores = await api("/escola/professores").catch(() => []);

    painel.innerHTML = formConvite() + listaConvites() + listaUsuarios();
    ligarAcessos();
  } catch (e) {
    painel.innerHTML = aviso(e);
  }
}

function formConvite() {
  return `
    <form class="cartao" id="formConvite" style="margin-bottom:22px">
      <h2 style="font-size:18px;margin-bottom:4px">Convidar para o sistema</h2>
      <p class="meta" style="margin:0 0 16px">
        Professor, secretaria e administrador entram por convite: a tabela de professores do
        sistema atual não tem CPF nem e-mail, então não há como a pessoa provar quem é sozinha.
        Depois de convidada, ela entra com o Google e já cai vinculada.
      </p>

      <div class="form-grade">
        <div class="campo largo">
          <label class="rotulo" for="conviteEmail">E-mail da conta Google</label>
          <input id="conviteEmail" type="email" required placeholder="professor@gmail.com">
        </div>
        <div class="campo">
          <label class="rotulo" for="convitePapel">Perfil</label>
          <select id="convitePapel">
            <option value="PROFESSOR">Professor</option>
            <option value="SECRETARIA">Secretaria</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>
        <div class="campo">
          <label class="rotulo" for="conviteValidade">Validade</label>
          <select id="conviteValidade">
            <option value="7">7 dias</option>
            <option value="14" selected>14 dias</option>
            <option value="30">30 dias</option>
          </select>
        </div>
        <div class="campo largo" id="campoProfessor">
          <label class="rotulo" for="conviteProfessor">Qual professor</label>
          ${professores.length
            ? `<select id="conviteProfessor">
                 <option value="">Escolha…</option>
                 ${professores.map((p) => `
                   <option value="${p.id}">${escapar(p.nome)} (${escapar(p.usuario)})</option>`).join("")}
               </select>`
            : `<input id="conviteProfessor" inputmode="numeric" placeholder="id do professor no sistema atual">
               <span class="ajuda">A lista de professores só aparece com a ponte do sistema
               antigo ligada. Por ora, informe o id manualmente.</span>`}
        </div>
      </div>

      <div class="barra-acoes" style="margin-top:16px">
        <button class="botao" type="submit" id="btnConvidar">Enviar convite</button>
      </div>
      <div class="aviso oculto" id="recadoConvite" style="margin-top:12px"></div>
    </form>`;
}

function situacaoConvite(c) {
  if (c.usadoEm) return ["ok", "Usado"];
  if (new Date(c.expiraEm) < new Date()) return ["neutra", "Expirado"];
  return ["alerta", "Aguardando"];
}

function listaConvites() {
  if (!convites.length) return "";

  return `<div class="cartao" style="margin-bottom:22px">
    <div class="rotulo" style="margin-bottom:8px">Convites</div>
    ${convites.map((c) => {
      const [cor, texto] = situacaoConvite(c);
      return `<div class="item">
        <div class="corpo">
          <div class="titulo">${escapar(c.email)}</div>
          <div class="detalhe">
            ${escapar(PAPEIS[c.papel] || c.papel)} ·
            ${c.usadoEm ? `entrou em ${fmt.data(c.usadoEm)}` : `vale até ${fmt.data(c.expiraEm)}`}
          </div>
        </div>
        <div class="lado">
          <span class="pilula ${cor}">${texto}</span>
          ${c.usadoEm ? "" : `<button class="botao fantasma pequeno" type="button"
            data-cancelar-convite="${c.id}">Cancelar</button>`}
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

function listaUsuarios() {
  if (!usuarios.length) {
    return `<div class="vazio">Ninguém entrou no sistema ainda.</div>`;
  }

  return `<div class="cartao">
    <div class="rotulo" style="margin-bottom:8px">Quem tem acesso</div>
    ${usuarios.map((u) => {
      const vinculo = u.vinculos.find((v) => v.tipo === "PROFESSOR")
        ? "professor vinculado"
        : u.vinculos.find((v) => v.tipo === "RESPONSAVEL")
          ? "responsável vinculado"
          : "sem vínculo";
      return `<div class="item" ${u.ativo ? "" : 'style="opacity:.55"'}>
        <div class="corpo">
          <div class="titulo">${escapar(u.nome)}</div>
          <div class="detalhe">
            ${escapar(u.email)} ·
            ${u.papeis.map((p) => escapar(PAPEIS[p] || p)).join(", ")} · ${vinculo}
            ${u.ultimoLoginEm ? ` · último acesso ${fmt.data(u.ultimoLoginEm)}` : ""}
          </div>
        </div>
        <div class="lado">
          ${u.ativo ? "" : `<span class="pilula neutra">Desativado</span>`}
          ${souAdmin
            ? `<button class="botao ${u.ativo ? "fantasma" : "secundario"} pequeno" type="button"
                 data-usuario="${u.id}" data-ativo="${u.ativo}">
                 ${u.ativo ? "Desativar" : "Reativar"}
               </button>`
            : ""}
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

function ligarAcessos() {
  const papel = el("convitePapel");
  const alternarCampoProfessor = () => {
    el("campoProfessor").hidden = papel.value !== "PROFESSOR";
  };
  papel.addEventListener("change", alternarCampoProfessor);
  alternarCampoProfessor();

  el("formConvite").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const recado = el("recadoConvite");
    const botao = el("btnConvidar");
    recado.classList.add("oculto");

    const corpo = {
      email: el("conviteEmail").value.trim(),
      papel: papel.value,
      validadeDias: Number(el("conviteValidade").value),
    };

    if (papel.value === "PROFESSOR") {
      const id = Number(el("conviteProfessor").value);
      if (!id) {
        recado.className = "aviso erro";
        recado.textContent = "Escolha o professor a que este e-mail corresponde.";
        return;
      }
      corpo.legacyId = id;
    }

    botao.disabled = true;
    botao.textContent = "Enviando…";

    try {
      await api("/auth/convites", { method: "POST", body: JSON.stringify(corpo) });
      await carregarAcessos();
      const novo = el("recadoConvite");
      novo.className = "aviso info";
      novo.textContent = `Convite criado para ${corpo.email}. Peça para a pessoa entrar com o Google nesse mesmo e-mail.`;
    } catch (e) {
      recado.className = "aviso erro";
      recado.textContent = e.message;
      botao.disabled = false;
      botao.textContent = "Enviar convite";
    }
  });

  el("painelAcessos").querySelectorAll("[data-cancelar-convite]").forEach((b) => {
    b.addEventListener("click", async () => {
      if (!confirm("Cancelar este convite?")) return;
      try {
        await api(`/auth/convites/${b.dataset.cancelarConvite}`, { method: "DELETE" });
        await carregarAcessos();
      } catch (e) {
        el("painelAcessos").insertAdjacentHTML("afterbegin", aviso(e));
      }
    });
  });

  el("painelAcessos").querySelectorAll("[data-usuario]").forEach((b) => {
    b.addEventListener("click", async () => {
      const ativo = b.dataset.ativo !== "true";
      if (!ativo && !confirm("Desativar este acesso? A pessoa deixa de conseguir entrar.")) return;
      try {
        await api(`/auth/usuarios/${b.dataset.usuario}`, {
          method: "PATCH",
          body: JSON.stringify({ ativo }),
        });
        await carregarAcessos();
      } catch (e) {
        el("painelAcessos").insertAdjacentHTML("afterbegin", aviso(e));
      }
    });
  });
}

// ------------------------------------------------------------------ início
async function iniciar() {
  if (Sessao.token && Sessao.usuario) {
    pintarUsuario();
    return decidirTela();
  }
  mostrar("login");
  iniciarGoogle(el("botaoGoogle"), entrarComGoogle, (mensagem) => {
    el("erroLogin").textContent = mensagem;
    el("erroLogin").classList.remove("oculto");
  });
}

iniciar();
</script>
