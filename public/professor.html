<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Área do Professor · SE7 Vôlei de Praia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d6f7a'/%3E%3Cpath d='M16 1c6 6 6 24 0 30M1 16c8-5 22-5 30 0M6 5c2 8 8 17 16 22' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topo">
  <div class="marca"><span class="se7">SE7</span><span class="sub">Professor</span></div>
  <div class="espaco"></div>
  <nav class="areas" id="areas" hidden></nav>
  <div class="usuario oculto" id="boxUsuario">
    <img id="avatar" alt="" hidden>
    <span class="nome" id="nomeUsuario"></span>
    <button class="botao fantasma" id="btnSair" type="button">Sair</button>
  </div>
</header>

<main class="centro" id="telaLogin" hidden>
  <h1 style="font-size:26px">Área do professor</h1>
  <p style="color:var(--ink-2);margin:14px 0 28px">
    Entre com a conta Google que o administrativo cadastrou para você.
  </p>
  <div id="botaoGoogle" style="display:flex;justify-content:center"></div>
  <div class="aviso erro oculto" id="erroLogin" style="margin-top:22px;text-align:left"></div>
</main>

<main class="centro" id="telaSemVinculo" hidden>
  <h1 style="font-size:22px">Conta ainda sem acesso de professor</h1>
  <p style="color:var(--ink-2);margin:14px 0 24px">
    Você entrou como <strong id="emailSemVinculo"></strong>, mas essa conta ainda não está
    ligada a um professor.
  </p>
  <div id="saidaSemVinculo" class="pilha" style="align-items:center"></div>
  <button class="botao fantasma" type="button" id="btnTrocar" style="margin-top:18px">
    Entrar com outra conta
  </button>
</main>

<main class="pagina" id="telaApp" hidden>
  <div class="abas" role="tablist">
    <button class="aba" role="tab" id="abaChamada" aria-selected="true"  data-painel="painelChamada">Chamada</button>
    <button class="aba" role="tab" id="abaTurmas"  aria-selected="false" data-painel="painelTurmas">Turmas</button>
    <button class="aba" role="tab" id="abaSemana"  aria-selected="false" data-painel="painelSemana">Semana</button>
    <button class="aba" role="tab" id="abaMes"     aria-selected="false" data-painel="painelMes">Mês</button>
    <button class="aba" role="tab" id="abaAvisos"  aria-selected="false" data-painel="painelAvisos">Avisos</button>
  </div>

  <section id="painelChamada" role="tabpanel" aria-labelledby="abaChamada">
    <div class="carregando">Carregando…</div>
  </section>
  <section id="painelTurmas" role="tabpanel" aria-labelledby="abaTurmas" hidden></section>
  <section id="painelSemana" role="tabpanel" aria-labelledby="abaSemana" hidden></section>
  <section id="painelMes"    role="tabpanel" aria-labelledby="abaMes"    hidden></section>
  <section id="painelAvisos" role="tabpanel" aria-labelledby="abaAvisos" hidden></section>
</main>

<script type="module">
import { Sessao, ErroApi, api, fmt, escapar, montarLogin, pintarNavegacao, gradeDoMes } from "/app.js";

const DIAS = {
  DOMINGO: "dom", SEGUNDA: "seg", TERCA: "ter", QUARTA: "qua",
  QUINTA: "qui", SEXTA: "sex", SABADO: "sáb",
};

const el = (id) => document.getElementById(id);
const telas = { login: el("telaLogin"), semVinculo: el("telaSemVinculo"), app: el("telaApp") };

function mostrar(nome) {
  for (const [chave, node] of Object.entries(telas)) node.hidden = chave !== nome;
  el("boxUsuario").classList.toggle("oculto", nome === "login");
}
function pintarUsuario() {
  const u = Sessao.usuario;
  if (!u) return;
  el("nomeUsuario").textContent = u.nome || u.email || "";
  const img = el("avatar");
  if (u.avatarUrl) { img.src = u.avatarUrl; img.hidden = false; } else { img.hidden = true; }
}
function sair() { Sessao.limpar(); mostrar("login"); }
el("btnSair").addEventListener("click", sair);
el("btnTrocar").addEventListener("click", sair);

function aviso(e) {
  const classe = e instanceof ErroApi && (e.status === 503 || e.status === 409) ? "alerta" : "erro";
  return `<div class="aviso ${classe}">${escapar(e.message)}</div>`;
}

const CATEGORIAS = { kids: "Kids", teens: "Teens", adult: "Adulto", competitive: "Competitivo" };
const TIPOS_EVENTO = {
  TREINO_ESPECIAL: "Treino especial", CAMPEONATO: "Campeonato", FESTIVAL: "Festival",
  REUNIAO: "Reunião", AVALIACAO: "Avaliação", FERIADO: "Feriado", OUTRO: "Evento",
};

// ------------------------------------------------------------------ entrar
function concluirLogin(r) {
  Sessao.token = r.token;
  Sessao.usuario = r.usuario;
  pintarUsuario();
  decidirTela();
}

async function decidirTela() {
  try {
    const eu = await api("/auth/eu");
    pintarNavegacao(el("areas"), eu, "professor");

    if (eu.professorId == null) {
      el("emailSemVinculo").textContent = eu.email || "";
      const equipe = eu.papeis.includes("ADMIN") || eu.papeis.includes("ADMINISTRATIVO");
      // Quem é da equipe não tem a quem pedir convite: é ele quem emite.
      const saida = el("saidaSemVinculo");
      if (saida) saida.innerHTML = equipe
        ? `<a class="botao" href="/administrativo.html" style="text-decoration:none">Ir para a Administrativo</a>
           <p class="meta" style="max-width:34ch">Sua conta é da equipe. Para também usar a área do
           professor, emita um convite de professor para este mesmo e-mail na aba Acessos.</p>`
        : `<p class="meta" style="max-width:34ch">Peça ao administrativo um convite para este e-mail.</p>`;
      return mostrar("semVinculo");
    }
    mostrar("app");
    pintarUsuario();
    carregarChamada();
    carregarTurmas();
    carregarSemana();
    carregarMes();
    carregarAvisos();
  } catch {
    sair();
  }
}

const abas = [...document.querySelectorAll(".aba")];
abas.forEach((aba) => aba.addEventListener("click", () => {
  abas.forEach((outra) => {
    const ativa = outra === aba;
    outra.setAttribute("aria-selected", String(ativa));
    el(outra.dataset.painel).hidden = !ativa;
  });
}));

// ================================================================== CHAMADA
const chamada = { turmas: [], turmaId: null, alunos: [], presentes: new Set(), bloqueada: false };

async function carregarChamada() {
  const painel = el("painelChamada");
  try {
    if (!chamada.turmas.length) chamada.turmas = await api("/professor/turmas");

    if (!chamada.turmas.length) {
      painel.innerHTML = `<div class="vazio">Você ainda não tem turma ativa vinculada.</div>`;
      return;
    }

    painel.innerHTML = `
      <div class="campo" style="margin-bottom:16px">
        <label class="rotulo" for="turma">Turma de hoje</label>
        <select class="selecao" id="turma">
          <option value="">Escolha a turma…</option>
          ${chamada.turmas.map((t) => `
            <option value="${t.id}">${escapar(t.nome)} · ${escapar(t.unidadeNome)}</option>`).join("")}
        </select>
      </div>
      <div id="listaChamada"></div>`;

    el("turma").addEventListener("change", (e) => {
      // Os ids são uuid. Number() aqui devolvia NaN, que é falso, e a lista
      // de chamada simplesmente não carregava quando a turma era escolhida.
      chamada.turmaId = e.target.value || null;
      chamada.turmaId ? carregarAlunos() : (el("listaChamada").innerHTML = "");
    });
  } catch (e) {
    painel.innerHTML = aviso(e);
  }
}

async function carregarAlunos() {
  const alvo = el("listaChamada");
  alvo.innerHTML = `<div class="carregando">Carregando a lista…</div>`;

  try {
    const r = await api(`/professor/turmas/${chamada.turmaId}/alunos`);
    chamada.alunos = r.alunos;
    chamada.bloqueada = r.frequenciaJaLancadaHoje;
    // A lista abre já com o que está gravado hoje. Como reenviar corrige,
    // abrir tudo desmarcado faria um toque em "Enviar" zerar a chamada da
    // turma inteira.
    chamada.presentes = new Set(r.alunos.filter((a) => a.presente).map((a) => a.id));

    if (!chamada.alunos.length) {
      alvo.innerHTML = `<div class="vazio">Nenhum aluno com matrícula confirmada nesta turma.</div>`;
      return;
    }

    const hoje = new Date().toLocaleDateString("pt-BR", {
      weekday: "long", day: "2-digit", month: "long",
    });

    alvo.innerHTML = `
      ${chamada.bloqueada ? `<div class="aviso alerta" style="margin-bottom:14px">
        A frequência desta turma já foi lançada hoje. Enviar de novo corrige o que
        está marcado, sem duplicar o registro.</div>` : ""}

      <div class="cartao">
        <div class="linha" style="margin-bottom:12px">
          <div>
            <div class="rotulo">Chamada</div>
            <div style="font-size:15px;color:var(--ink-2)">${escapar(hoje)}</div>
          </div>
          <div style="text-align:right">
            <div class="contador"><span id="qtdPresentes">0</span>/${chamada.alunos.length}</div>
            <div class="rotulo">presentes</div>
          </div>
        </div>

        <input class="busca" id="buscaAluno" type="search" placeholder="Buscar aluno pelo nome…"
               autocomplete="off" aria-label="Buscar aluno pelo nome">

        <div class="barra-acoes" style="margin:12px 0">
          <button class="botao fantasma" type="button" id="btnTodos">Marcar todos</button>
          <button class="botao fantasma" type="button" id="btnNenhum">Limpar</button>
        </div>

        <div class="chamada" id="listaAlunos">${chamada.alunos.map(linhaAluno).join("")}</div>
      </div>

      <div class="rodape-fixo">
        <button class="botao" type="button" id="btnEnviar" style="width:100%"
          ${chamada.bloqueada ? "disabled" : ""}>Enviar frequência</button>
        <div class="aviso erro oculto" id="erroEnvio" style="margin-top:10px"></div>
      </div>`;

    el("listaAlunos").addEventListener("click", (evento) => {
      const botao = evento.target.closest(".aluno");
      if (botao) alternarPresenca(botao);
    });
    el("btnTodos").addEventListener("click", () => marcarTodos(true));
    el("btnNenhum").addEventListener("click", () => marcarTodos(false));
    el("btnEnviar").addEventListener("click", enviarChamada);
    el("buscaAluno").addEventListener("input", filtrarAlunos);

    // A lista pode abrir com gente já marcada (chamada refeita), então o
    // contador precisa nascer certo, não em zero.
    atualizarContador();
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

/** "Beatriz Honor" -> "BH", enquanto o aluno não tem foto. */
function iniciais(nome) {
  const partes = (nome || "").trim().split(/\s+/).filter(Boolean);
  if (partes.length === 0) return "?";
  return (partes[0][0] + (partes.length > 1 ? partes[partes.length - 1][0] : "")).toUpperCase();
}

// A numeração vem do servidor e não muda com a busca: o número 7 continua sendo
// o mesmo aluno com a lista filtrada, que é como o professor chama em quadra.
function linhaAluno(a) {
  return `
    <button class="aluno" type="button" role="switch" aria-pressed="${a.presente ? "true" : "false"}"
            data-id="${a.id}" data-nome="${escapar((a.nome || "").toLowerCase())}">
      <span class="num">${String(a.numero).padStart(2, "0")}</span>
      <span class="retrato pequeno">
        ${a.foto ? `<img src="${escapar(a.foto)}" alt="">` : `<span>${escapar(iniciais(a.nome))}</span>`}
      </span>
      <span class="nome-aluno">${escapar(a.nome)}</span>
      <span class="marca-presenca" aria-hidden="true">✓</span>
    </button>`;
}

function alternarPresenca(botao) {
  const id = botao.dataset.id;
  const marcado = botao.getAttribute("aria-pressed") === "true";
  botao.setAttribute("aria-pressed", String(!marcado));
  marcado ? chamada.presentes.delete(id) : chamada.presentes.add(id);
  atualizarContador();
}

function marcarTodos(valor) {
  chamada.presentes = valor ? new Set(chamada.alunos.map((a) => a.id)) : new Set();
  document.querySelectorAll("#listaAlunos .aluno").forEach((b) => {
    b.setAttribute("aria-pressed", String(valor));
  });
  atualizarContador();
}

function atualizarContador() {
  el("qtdPresentes").textContent = String(chamada.presentes.size);
}

function filtrarAlunos(evento) {
  const termo = evento.target.value.trim().toLowerCase();
  document.querySelectorAll("#listaAlunos .aluno").forEach((b) => {
    b.hidden = termo !== "" && !b.dataset.nome.includes(termo);
  });
}

async function enviarChamada() {
  const botao = el("btnEnviar");
  const erro = el("erroEnvio");
  erro.classList.add("oculto");

  const faltas = chamada.alunos.length - chamada.presentes.size;
  if (faltas > 0) {
    const ok = confirm(
      `${chamada.presentes.size} presente(s) e ${faltas} falta(s). Enviar assim?`,
    );
    if (!ok) return;
  }

  botao.disabled = true;
  botao.textContent = "Enviando…";

  try {
    const r = await api("/professor/frequencia", {
      method: "POST",
      body: JSON.stringify({
        turmaId: chamada.turmaId,
        presencas: chamada.alunos.map((a) => ({
          alunoId: a.id,
          presente: chamada.presentes.has(a.id),
        })),
      }),
    });

    el("listaChamada").innerHTML = `
      <div class="cartao" style="text-align:center">
        <div style="font-size:38px;line-height:1">✓</div>
        <h2 style="margin:10px 0 6px;font-size:19px">${escapar(r.message)}</h2>
        <p class="meta">${r.presentes} de ${r.total} presentes.</p>
        <button class="botao fantasma" type="button" id="btnOutra" style="margin-top:12px">
          Fazer chamada de outra turma
        </button>
      </div>`;
    el("btnOutra").addEventListener("click", () => {
      el("turma").value = "";
      el("listaChamada").innerHTML = "";
    });
  } catch (e) {
    erro.textContent = e.message;
    erro.classList.remove("oculto");
    botao.disabled = false;
    botao.textContent = "Enviar frequência";
  }
}

// ================================================================== TURMAS
async function carregarTurmas() {
  const alvo = el("painelTurmas");
  try {
    const turmas = chamada.turmas.length ? chamada.turmas : await api("/professor/turmas");
    chamada.turmas = turmas;

    if (!turmas.length) {
      alvo.innerHTML = `<div class="vazio">Nenhuma turma ativa vinculada a você.</div>`;
      return;
    }

    const porUnidade = new Map();
    for (const t of turmas) {
      if (!porUnidade.has(t.unidadeNome)) porUnidade.set(t.unidadeNome, []);
      porUnidade.get(t.unidadeNome).push(t);
    }

    alvo.innerHTML = [...porUnidade].map(([unidade, lista]) => `
      <section style="margin-bottom:26px">
        <h2 class="rotulo" style="margin-bottom:10px">${escapar(unidade)}</h2>
        <div class="pilha">${lista.map((t) => {
          // Turma sem capacidade declarada não tem "vagas": mostrar "0 vagas"
          // ali seria dizer que está cheia, que é o contrário do que se sabe.
          const capacidade = t.capacidade ?? null;
          const vagas = capacidade === null ? null : Math.max(0, capacidade - t.matriculados);
          const pct = capacidade ? Math.round((t.matriculados / capacidade) * 100) : 0;
          const horarios = (t.horarios || [])
            .map((h) => DIAS[h.dia] + " " + h.inicio)
            .join(" · ");
          return `
            <article class="cartao">
              <div class="linha">
                <span style="font-weight:700;font-size:17px">${escapar(t.nome)}</span>
                ${vagas === null ? "" : `<span class="pilula ${vagas === 0 ? "alerta" : "neutra"}">
                  ${vagas === 0 ? "Turma cheia" : vagas + " vaga" + (vagas === 1 ? "" : "s")}
                </span>`}
              </div>
              ${horarios ? `<p class="meta" style="margin:6px 0 0">${escapar(horarios)}</p>` : ""}
              ${t.categoria ? `<p class="meta" style="margin:4px 0 0">${escapar(CATEGORIAS[t.categoria] || t.categoria)}</p>` : ""}
              ${capacidade ? `<div class="barra" style="margin:12px 0 6px"><i style="width:${pct}%"></i></div>` : ""}
              <p class="meta" style="margin:8px 0 0">
                ${t.matriculados} matriculado${t.matriculados === 1 ? "" : "s"}${capacidade ? ` de ${capacidade}` : ""}
              </p>
            </article>`;
        }).join("")}</div>
      </section>`).join("");
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

// ================================================================== SEMANA
function blocoSemana(titulo, s) {
  if (!s) {
    return `<article class="cartao">
      <div class="rotulo">${titulo}</div>
      <p class="meta" style="margin:8px 0 0">Cronograma ainda não publicado.</p>
    </article>`;
  }

  const campos = [
    ["Tema", s.tema], ["Fundamentos", s.fundamentos],
    ["Exercícios", s.exerciciosSugeridos], ["Observações", s.observacoes],
  ].filter(([, v]) => v);

  return `<article class="cartao">
    <div class="linha" style="margin-bottom:10px">
      <span class="rotulo">${titulo}</span>
      <span class="meta">semana de ${fmt.data(s.semana)}</span>
    </div>

    ${s.imagemBase64
      ? `<div class="arte-professor" style="margin-bottom:14px">
           <img src="${escapar(s.imagemBase64)}" alt="Arte da semana${s.tema ? ": " + escapar(s.tema) : ""}">
         </div>`
      : ""}

    ${campos.length
      ? campos.map(([rotulo, valor]) => `
          <div style="margin-top:12px">
            <div class="rotulo" style="margin-bottom:3px">${rotulo}</div>
            <div class="bloco-texto">${escapar(valor)}</div>
          </div>`).join("")
      : `<p class="meta" style="margin:0">Sem conteúdo preenchido para esta semana.</p>`}

    ${s.textoDivulgacao
      ? `<div style="margin-top:16px;border-top:1px solid var(--rule);padding-top:14px">
           <div class="linha" style="margin-bottom:6px">
             <span class="rotulo">Texto de divulgação</span>
             <button class="botao fantasma pequeno" type="button"
                     data-copiar="${escapar(s.id)}">Copiar</button>
           </div>
           <div class="bloco-texto" id="divulgacao-${escapar(s.id)}">${escapar(s.textoDivulgacao)}</div>
         </div>`
      : ""}
  </article>`;
}

async function carregarSemana() {
  const alvo = el("painelSemana");
  try {
    const r = await api("/professor/semana");
    alvo.innerHTML = `<div class="pilha">
      ${blocoSemana("Esta semana", r.atual)}
      ${blocoSemana("Próxima semana", r.proxima)}
    </div>`;

    // Copiar o texto pronto é o que o professor faz de fato: ele cola no
    // grupo do WhatsApp junto com a arte.
    alvo.querySelectorAll("[data-copiar]").forEach((b) => {
      b.addEventListener("click", async () => {
        const texto = el(`divulgacao-${b.dataset.copiar}`)?.textContent ?? "";
        try {
          await navigator.clipboard.writeText(texto);
          b.textContent = "Copiado!";
          setTimeout(() => { b.textContent = "Copiar"; }, 1800);
        } catch {
          b.textContent = "Não deu para copiar";
        }
      });
    });
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

// ================================================================== MÊS
const agenda = { mes: new Date().getMonth() + 1, ano: new Date().getFullYear() };

const maiusculaInicial = (texto) => texto.charAt(0).toUpperCase() + texto.slice(1);

async function carregarMes() {
  const alvo = el("painelMes");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;

  try {
    const r = await api(`/professor/agenda?mes=${agenda.mes}&ano=${agenda.ano}`);
    const hoje = fmt.hojeIso();

    alvo.innerHTML = `
      <div class="linha" style="margin-bottom:16px">
        <button class="botao fantasma" type="button" id="mesAnterior" aria-label="Mês anterior">←</button>
        <strong>${escapar(maiusculaInicial(fmt.mesAno(r.ano, r.mes)))}</strong>
        <button class="botao fantasma" type="button" id="mesSeguinte" aria-label="Próximo mês">→</button>
      </div>

      <div class="cartao" style="margin-bottom:14px">
        ${gradeDoMes(r.ano, r.mes, r.eventos, { hojeIso: hoje })}
      </div>

      <div class="cartao">
        <div class="rotulo" style="margin-bottom:10px">Eventos do mês</div>
        ${r.eventos.length ? [...r.eventos]
          .sort((a, b) => String(a.data).localeCompare(String(b.data)))
          .map((ev) => {
          const [ano, mes, dia] = String(ev.data).slice(0, 10).split("-");
          const passou = String(ev.data).slice(0, 10) < hoje;
          return `<div class="evento" ${passou ? 'style="opacity:.55"' : ""}>
            <div class="dia">
              <div class="d">${dia}</div>
              <div class="m">${escapar(fmt.mesAno(Number(ano), Number(mes)).slice(0, 3))}</div>
            </div>
            <div style="flex:1;min-width:0">
              <div class="linha">
                <strong>${escapar(ev.titulo)}</strong>
                <span class="pilula neutra">${escapar(TIPOS_EVENTO[ev.tipo] || "Evento")}</span>
              </div>
              <div class="meta" style="margin-top:3px">
                ${[ev.dataFim ? `até ${fmt.data(ev.dataFim)}` : null, ev.horario, ev.local,
                   ev.unidadeNome || "Todas as unidades"]
                  .filter(Boolean).map(escapar).join(" · ")}
              </div>
              ${ev.descricao ? `<div class="meta bloco-texto" style="margin-top:6px">${escapar(ev.descricao)}</div>` : ""}
            </div>
          </div>`;
        }).join("") : `<p class="meta" style="margin:0">Nenhum evento publicado para este mês.</p>`}
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="rotulo" style="margin-bottom:10px">Cronograma das semanas</div>
        ${r.semanas.length ? r.semanas.map((s) => `
          <div class="item">
            <div class="corpo">
              <div class="titulo">${escapar(s.tema || "Sem tema definido")}</div>
              <div class="detalhe">semana de ${fmt.diaCurto(s.semana)}</div>
            </div>
            ${s.temArte ? `<div class="lado"><span class="selo-arte">com arte</span></div>` : ""}
          </div>`).join("")
          : `<p class="meta" style="margin:0">Nenhuma semana publicada neste mês.</p>`}
      </div>`;

    el("mesAnterior").addEventListener("click", () => mudarMes(-1));
    el("mesSeguinte").addEventListener("click", () => mudarMes(1));
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

function mudarMes(passo) {
  const d = new Date(agenda.ano, agenda.mes - 1 + passo, 1);
  agenda.mes = d.getMonth() + 1;
  agenda.ano = d.getFullYear();
  carregarMes();
}

// ================================================================== AVISOS
const TIPOS_AVISO = {
  TURMA_ERRADA: "Aluno na turma errada",
  ALUNO_FALTANDO: "Falta um aluno na lista",
  REGISTRO_TREINO: "Registro do treino",
  OUTRO: "Outro assunto",
};

// O aluno vai como texto livre de propósito: o professor sabe o nome, e nem
// sempre o aluno está na lista — é justamente sobre isso que ele avisa.
const PEDE_ALUNO = new Set(["TURMA_ERRADA", "ALUNO_FALTANDO"]);

async function carregarAvisos() {
  const alvo = el("painelAvisos");
  try {
    const [avisos] = await Promise.all([api("/professor/ocorrencias")]);
    alvo.innerHTML = formAviso() + listaAvisos(avisos);
    ligarFormAviso();
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

function formAviso() {
  const turmas = chamada.turmas || [];
  return `
    <form class="cartao" id="formAviso" style="margin-bottom:22px">
      <h2 style="font-size:18px;margin-bottom:4px">Avisar o administrativo</h2>
      <p class="meta" style="margin:0 0 16px">
        Aluno na turma errada, aluno que devia estar na lista e não está, ou o que aconteceu
        no treino. O administrativo recebe, resolve e responde por aqui.
      </p>

      <div class="form-grade">
        <div class="campo largo">
          <label class="rotulo" for="avisoTipo">Assunto</label>
          <select id="avisoTipo">
            ${Object.entries(TIPOS_AVISO).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}
          </select>
        </div>
        <div class="campo">
          <label class="rotulo" for="avisoTurma">Turma <span class="ajuda">(opcional)</span></label>
          <select id="avisoTurma">
            <option value="">Nenhuma em especial</option>
            ${turmas.map((t) => `<option value="${t.id}">${escapar(t.nome)} · ${escapar(t.unidadeNome)}</option>`).join("")}
          </select>
        </div>
        <div class="campo" id="campoAvisoAluno">
          <label class="rotulo" for="avisoAluno">Aluno</label>
          <input id="avisoAluno" maxlength="200" placeholder="Nome do aluno">
        </div>
        <div class="campo largo">
          <label class="rotulo" for="avisoDescricao">O que aconteceu</label>
          <textarea id="avisoDescricao" rows="3" maxlength="2000"
            placeholder="Escreva como você contaria para o administrativo"></textarea>
        </div>
      </div>

      <div class="barra-acoes" style="margin-top:16px">
        <button class="botao" type="submit" id="btnEnviarAviso">Enviar aviso</button>
      </div>
      <div class="aviso oculto" id="recadoAviso" style="margin-top:12px"></div>
    </form>`;
}

function listaAvisos(avisos) {
  if (!avisos.length) {
    return `<div class="vazio">Você ainda não enviou nenhum aviso.</div>`;
  }

  return `<div class="cartao">
    <div class="rotulo" style="margin-bottom:8px">Seus avisos</div>
    ${avisos.map((o) => `
      <div class="item">
        <div class="corpo">
          <div class="titulo">${escapar(TIPOS_AVISO[o.tipo] || o.tipo)}</div>
          <div class="detalhe">
            ${fmt.diaCurto(o.criadoEm)}
            ${o.turmaNome ? " · " + escapar(o.turmaNome) : ""}
            ${o.alunoNome ? " · " + escapar(o.alunoNome) : ""}
          </div>
          <div class="bloco-texto" style="margin-top:6px">${escapar(o.descricao)}</div>
          ${o.resposta
            ? `<div class="aviso info" style="margin-top:8px">
                 <strong>Administrativo:</strong> ${escapar(o.resposta)}
               </div>`
            : ""}
        </div>
        <div class="lado">
          <span class="pilula ${o.status === "RESOLVIDA" ? "ok" : "alerta"}">
            ${o.status === "RESOLVIDA" ? "Resolvido" : "Aguardando"}
          </span>
        </div>
      </div>`).join("")}
  </div>`;
}

function ligarFormAviso() {
  const tipo = el("avisoTipo");
  const alternarAluno = () => { el("campoAvisoAluno").hidden = !PEDE_ALUNO.has(tipo.value); };
  tipo.addEventListener("change", alternarAluno);
  alternarAluno();

  el("formAviso").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const recado = el("recadoAviso");
    const botao = el("btnEnviarAviso");
    recado.classList.add("oculto");
    botao.disabled = true;
    botao.textContent = "Enviando…";

    const turmaId = el("avisoTurma").value;
    const alunoNome = el("avisoAluno").value.trim();

    try {
      await api("/professor/ocorrencias", {
        method: "POST",
        body: JSON.stringify({
          tipo: tipo.value,
          ...(turmaId ? { turmaId } : {}),
          ...(alunoNome && PEDE_ALUNO.has(tipo.value) ? { alunoNome } : {}),
          descricao: el("avisoDescricao").value.trim(),
        }),
      });
      await carregarAvisos();
      const novo = el("recadoAviso");
      novo.className = "aviso info";
      novo.textContent = "Aviso enviado. O administrativo responde por aqui mesmo.";
    } catch (e) {
      recado.className = "aviso erro";
      recado.textContent = e.message;
      botao.disabled = false;
      botao.textContent = "Enviar aviso";
    }
  });
}

// ------------------------------------------------------------------ início
async function iniciar() {
  if (Sessao.token && Sessao.usuario) {
    pintarUsuario();
    return decidirTela();
  }
  mostrar("login");
  montarLogin(el("botaoGoogle"), concluirLogin, (mensagem) => {
    el("erroLogin").textContent = mensagem;
    el("erroLogin").classList.remove("oculto");
  });
}

iniciar();
</script>
</body>
</html>
