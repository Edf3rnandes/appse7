<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Área do Professor · SE7 Vôlei de Praia</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topo">
  <div class="marca"><span class="se7">SE7</span><span class="sub">Professor</span></div>
  <div class="espaco"></div>
  <div class="usuario oculto" id="boxUsuario">
    <img id="avatar" alt="" hidden>
    <span class="nome" id="nomeUsuario"></span>
    <button class="botao fantasma" id="btnSair" type="button">Sair</button>
  </div>
</header>

<main class="centro" id="telaLogin" hidden>
  <h1 style="font-size:26px">Área do professor</h1>
  <p style="color:var(--ink-2);margin:14px 0 28px">
    Entre com a conta Google que a secretaria cadastrou para você.
  </p>
  <div id="botaoGoogle" style="display:flex;justify-content:center"></div>
  <div class="aviso erro oculto" id="erroLogin" style="margin-top:22px;text-align:left"></div>
</main>

<main class="centro" id="telaSemVinculo" hidden>
  <h1 style="font-size:22px">Conta ainda sem acesso de professor</h1>
  <p style="color:var(--ink-2);margin:14px 0 24px">
    Você entrou como <strong id="emailSemVinculo"></strong>, mas essa conta ainda não está
    ligada a um professor. Peça à secretaria um convite para este e-mail.
  </p>
  <button class="botao fantasma" type="button" id="btnTrocar">Entrar com outra conta</button>
</main>

<main class="pagina" id="telaTurmas" hidden>
  <h1 style="font-size:22px;margin-bottom:16px">Minhas turmas</h1>
  <div id="turmas"><div class="carregando">Carregando…</div></div>
</main>

<script type="module">
import { Sessao, ErroApi, api, escapar, iniciarGoogle } from "/app.js";

const el = (id) => document.getElementById(id);
const telas = { login: el("telaLogin"), semVinculo: el("telaSemVinculo"), turmas: el("telaTurmas") };

function mostrar(nome) {
  for (const [chave, node] of Object.entries(telas)) node.hidden = chave !== nome;
  el("boxUsuario").classList.toggle("oculto", nome === "login");
}

function pintarUsuario() {
  const u = Sessao.usuario;
  if (!u) return;
  el("nomeUsuario").textContent = u.nome || u.email || "";
  const img = el("avatar");
  if (u.avatarUrl) { img.src = u.avatarUrl; img.hidden = false; } else { img.hidden = true; }
}

function sair() { Sessao.limpar(); mostrar("login"); }
el("btnSair").addEventListener("click", sair);
el("btnTrocar").addEventListener("click", sair);

async function entrarComGoogle(idToken) {
  try {
    const r = await api("/auth/google", { method: "POST", body: JSON.stringify({ idToken }) });
    Sessao.token = r.token;
    Sessao.usuario = r.usuario;
    pintarUsuario();
    decidirTela();
  } catch (e) {
    el("erroLogin").textContent = e.message;
    el("erroLogin").classList.remove("oculto");
  }
}

async function decidirTela() {
  try {
    const eu = await api("/auth/eu");
    if (eu.professorId == null) {
      el("emailSemVinculo").textContent = eu.email || "";
      return mostrar("semVinculo");
    }
    mostrar("turmas");
    carregarTurmas();
  } catch {
    sair();
  }
}

// Mesmos rótulos de Course::COURSE_CATEGORY no sistema atual.
const CATEGORIAS = { kids: "Kids", teens: "Teens", adult: "Adulto", competitive: "Competitivo" };

async function carregarTurmas() {
  const alvo = el("turmas");
  try {
    const turmas = await api("/professor/turmas");

    if (!turmas.length) {
      alvo.innerHTML = `<div class="vazio">Nenhuma turma ativa vinculada a você.</div>`;
      return;
    }

    // Agrupa por unidade: o professor pensa por praia, não por lista corrida.
    const porUnidade = new Map();
    for (const t of turmas) {
      if (!porUnidade.has(t.unidadeNome)) porUnidade.set(t.unidadeNome, []);
      porUnidade.get(t.unidadeNome).push(t);
    }

    alvo.innerHTML = [...porUnidade].map(([unidade, lista]) => `
      <section style="margin-bottom:26px">
        <h2 class="rotulo" style="margin-bottom:10px">${escapar(unidade)}</h2>
        <div class="pilha">${lista.map((t) => {
          const capacidade = t.matriculados + t.vagas;
          const pct = capacidade > 0 ? Math.round((t.matriculados / capacidade) * 100) : 0;
          return `
            <article class="cartao">
              <div class="linha">
                <span style="font-weight:700;font-size:17px">${escapar(t.nome)}</span>
                <span class="pilula ${t.vagas === 0 ? "alerta" : "neutra"}">
                  ${t.vagas === 0 ? "Turma cheia" : t.vagas + " vaga" + (t.vagas === 1 ? "" : "s")}
                </span>
              </div>
              ${t.categoria ? `<p class="meta" style="margin:6px 0 0">${escapar(CATEGORIAS[t.categoria] || t.categoria)}</p>` : ""}
              <div class="barra" style="margin:12px 0 6px"><i style="width:${pct}%"></i></div>
              <p class="meta" style="margin:0">
                ${t.matriculados} matriculado${t.matriculados === 1 ? "" : "s"}${capacidade ? ` de ${capacidade}` : ""}
              </p>
            </article>`;
        }).join("")}</div>
      </section>`).join("");
  } catch (e) {
    const classe = e instanceof ErroApi && e.status === 503 ? "alerta" : "erro";
    alvo.innerHTML = `<div class="aviso ${classe}">${escapar(e.message)}</div>`;
  }
}

async function iniciar() {
  if (Sessao.token && Sessao.usuario) {
    pintarUsuario();
    return decidirTela();
  }
  mostrar("login");
  iniciarGoogle(el("botaoGoogle"), entrarComGoogle, (mensagem) => {
    el("erroLogin").textContent = mensagem;
    el("erroLogin").classList.remove("oculto");
  });
}

iniciar();
</script>
</body>
</html>
