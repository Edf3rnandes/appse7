<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Sócios · SE7 Vôlei de Praia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d6f7a'/%3E%3Cpath d='M16 1c6 6 6 24 0 30M1 16c8-5 22-5 30 0M6 5c2 8 8 17 16 22' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <style>
    /* Cartões de número grande: o painel do sócio é lido de longe, numa
       reunião, não estudado de perto como uma lista de matrículas. */
    .placar { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--card); }
    .placar > div { flex: 1 1 150px; padding: 14px 16px; border-right: 1px solid var(--rule); }
    .placar > div:last-child { border-right: 0; }
    .placar .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .placar .n.baixo { color: var(--erro, #b4413a); }
    .placar .n.alto { color: var(--accent); }
    .placar .rotulo { margin-bottom: 4px; }
    .placar .apoio { font-size: 12px; color: var(--ink-3); margin-top: 3px; }

    /* Colunas do gráfico de meses. Sem biblioteca: seis a doze barras não
       justificam trazer um megabyte de JavaScript para dentro da página. */
    .colunas { display: flex; align-items: flex-end; gap: 8px; height: 150px; margin: 6px 0 10px; }
    .colunas .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
    .colunas .haste { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; opacity: .82; }
    .colunas .col.agora .haste { opacity: 1; }
    .colunas .rot { font-size: 11px; color: var(--ink-3); margin-top: 6px; white-space: nowrap; }
    .colunas .val { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-2); margin-bottom: 4px; }

    .tabelinha { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tabelinha th { text-align: left; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--rule); font-weight: 600; }
    .tabelinha td { padding: 9px 8px; border-bottom: 1px solid var(--rule); }
    .tabelinha td.num, .tabelinha th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rolagem { overflow-x: auto; }

    .abas-socio { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
    .abas-socio button { border: 1px solid var(--rule); background: var(--card); color: var(--ink-2); padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
    .abas-socio button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  </style>
</head>
<body>

<header class="topo">
  <div class="marca"><span class="se7">SE7</span><span class="sub">Sócios</span></div>
  <div class="espaco"></div>
  <nav class="areas" id="areas" hidden></nav>
  <div class="usuario oculto" id="boxUsuario">
    <img id="avatar" alt="" hidden>
    <span class="nome" id="nomeUsuario"></span>
    <button class="botao fantasma" id="btnSair" type="button">Sair</button>
  </div>
</header>

<main class="centro" id="telaLogin" hidden>
  <h1 style="font-size:26px">Área dos sócios</h1>
  <p style="color:var(--ink-2);margin:14px 0 28px">
    Entre com a conta da escola.
  </p>
  <div id="botaoGoogle" style="display:flex;justify-content:center"></div>
  <div class="aviso erro oculto" id="erroLogin" style="margin-top:22px;text-align:left"></div>
</main>

<main class="centro" id="telaSemPermissao" hidden>
  <h1 style="font-size:22px">Esta área é dos sócios</h1>
  <p style="color:var(--ink-2);margin:14px 0 24px">
    Você entrou como <strong id="emailSemPermissao"></strong>, que não é uma conta de sócio.
  </p>
  <nav class="areas" id="areasSemPermissao"></nav>
  <button class="botao fantasma" type="button" id="btnTrocar" style="margin-top:18px">
    Entrar com outra conta
  </button>
</main>

<main class="pagina" id="telaApp" hidden>
  <div class="abas-socio" role="tablist">
    <button role="tab" data-aba="painel" aria-selected="true">Painel</button>
    <button role="tab" data-aba="turmas" aria-selected="false">Turmas</button>
    <button role="tab" data-aba="adesao" aria-selected="false">Adesão</button>
    <button role="tab" data-aba="caixa" aria-selected="false">Caixa e inadimplência</button>
    <button role="tab" data-aba="sociedade" aria-selected="false">Sociedade</button>
  </div>

  <section id="secPainel"></section>
  <section id="secTurmas" hidden></section>
  <section id="secAdesao" hidden></section>
  <section id="secCaixa" hidden></section>
  <section id="secSociedade" hidden></section>
</main>

<script type="module">
import { Sessao, ErroApi, api, fmt, escapar, montarLogin, pintarNavegacao } from "/app.js";

const el = (id) => document.getElementById(id);
const telas = { login: el("telaLogin"), semPermissao: el("telaSemPermissao"), app: el("telaApp") };

function mostrar(nome) {
  for (const [chave, node] of Object.entries(telas)) node.hidden = chave !== nome;
  el("boxUsuario").classList.toggle("oculto", nome === "login");
}

function pintarUsuario() {
  const u = Sessao.usuario;
  if (!u) return;
  el("nomeUsuario").textContent = u.nome || u.email || "";
  const img = el("avatar");
  if (u.avatarUrl) { img.src = u.avatarUrl; img.hidden = false; } else { img.hidden = true; }
}

function sair() { Sessao.limpar(); mostrar("login"); }
el("btnSair").addEventListener("click", sair);
el("btnTrocar").addEventListener("click", sair);

function aviso(e) {
  const classe = e instanceof ErroApi && e.status === 503 ? "alerta" : "erro";
  return `<div class="aviso ${classe}">${escapar(e.message)}</div>`;
}

/** "2026-09" -> "set/2026". Rótulo curto, que cabe embaixo de uma coluna. */
function rotuloMes(chave) {
  const [ano, mes] = chave.split("-").map(Number);
  const nome = new Date(ano, mes - 1, 1)
    .toLocaleDateString("pt-BR", { month: "short" })
    .replace(".", "");
  return `${nome}/${String(ano).slice(2)}`;
}

/** Só os centavos atrapalham num placar. R$ 61.240 lê melhor que R$ 61.239,87. */
const moedaCurta = (v) =>
  (Number(v) || 0).toLocaleString("pt-BR", {
    style: "currency", currency: "BRL", maximumFractionDigits: 0,
  });

/**
 * Gráfico de colunas.
 *
 * A escala começa em zero de propósito. Cortar a base faz uma queda de 2%
 * parecer um desabamento — e é justamente num painel de sócio, lido rápido e
 * usado para decidir, que essa distorção custa caro.
 */
function colunas(itens, valorDe, formatar, rotularCom = (i) => rotuloMes(i.mes)) {
  const maximo = Math.max(...itens.map(valorDe), 1);
  return `
    <div class="colunas">
      ${itens.map((i) => {
        const v = valorDe(i);
        const rot = rotularCom(i);
        return `
          <div class="col ${i.corrente ? "agora" : ""}">
            <div class="val">${formatar(v)}</div>
            <div class="haste" style="height:${Math.round((v / maximo) * 100)}%"
                 title="${escapar(rot)}: ${escapar(String(formatar(v)))}"></div>
            <div class="rot">${escapar(rot)}</div>
          </div>`;
      }).join("")}
    </div>`;
}

// ==================================================================== abas

const ABAS = {
  painel: { secao: "secPainel", carregar: () => carregarPainel() },
  turmas: { secao: "secTurmas", carregar: () => carregarTurmas() },
  adesao: { secao: "secAdesao", carregar: () => carregarAdesao() },
  caixa: { secao: "secCaixa", carregar: () => carregarCaixa() },
  sociedade: { secao: "secSociedade", carregar: () => carregarSociedade() },
};

const carregadas = new Set();

function abrirAba(nome) {
  for (const [chave, aba] of Object.entries(ABAS)) {
    el(aba.secao).hidden = chave !== nome;
  }
  document.querySelectorAll("[data-aba]").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.aba === nome));
  });
  if (!carregadas.has(nome)) {
    carregadas.add(nome);
    ABAS[nome].carregar();
  }
}

document.querySelectorAll("[data-aba]").forEach((b) =>
  b.addEventListener("click", () => abrirAba(b.dataset.aba)));

/** Força a aba a recarregar na próxima abertura — depois de gravar algo. */
function invalidar(nome) { carregadas.delete(nome); }

// =================================================================== painel

async function carregarPainel() {
  const alvo = el("secPainel");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;

  try {
    // Os dois juntos: o painel é calculado agora, o fechamento foi gravado às
    // 23:59 de cada dia. Se o fechamento falhar, o painel ainda abre.
    const [p, f] = await Promise.all([
      api("/socios/painel?meses=6"),
      api("/socios/fechamentos?dias=30").catch(() => null),
    ]);
    const t = p.totais;
    const ultimo = p.serie[p.serie.length - 1];

    alvo.innerHTML = `
      <div class="placar">
        <div>
          <div class="rotulo">Receita prevista/mês</div>
          <div class="n">${moedaCurta(t.receitaPrevista)}</div>
          <div class="apoio">${t.ativas} matrículas ativas</div>
        </div>
        <div>
          <div class="rotulo">Ticket médio</div>
          <div class="n">${moedaCurta(t.ticketMedio)}</div>
          <div class="apoio">por aluno, por mês</div>
        </div>
        <div>
          <div class="rotulo">Saldo do mês</div>
          <div class="n ${ultimo.saldo < 0 ? "baixo" : ultimo.saldo > 0 ? "alto" : ""}">
            ${ultimo.saldo > 0 ? "+" : ""}${ultimo.saldo}
          </div>
          <div class="apoio">${ultimo.novas} entraram · ${ultimo.saidas} saíram</div>
        </div>
        <div>
          <div class="rotulo">Vagas ociosas</div>
          <div class="n">${t.vagasOciosas}</div>
          <div class="apoio">${moedaCurta(t.potencialOcioso)}/mês se cheias</div>
        </div>
      </div>

      ${blocoFechamentos(f)}

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:2px"><strong>Receita prevista, mês a mês</strong></div>
        ${colunas(p.serie, (i) => i.receitaPrevista, moedaCurta)}
        <p class="meta" style="margin:0">${escapar(p.reconstruido.nota)}</p>
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:2px"><strong>Alunos ativos, mês a mês</strong></div>
        ${colunas(p.serie, (i) => i.ativas, (v) => String(v))}
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:10px"><strong>Entradas e saídas</strong></div>
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Mês</th><th class="num">Entraram</th><th class="num">Saíram</th>
                <th class="num">Saldo</th><th class="num">Ativos no fim</th></tr>
            ${p.serie.slice().reverse().map((m) => `
              <tr>
                <td>${escapar(rotuloMes(m.mes))}${m.corrente ? ' <span class="meta">(em curso)</span>' : ""}</td>
                <td class="num">${m.novas}</td>
                <td class="num">${m.saidas}</td>
                <td class="num" style="font-weight:600">${m.saldo > 0 ? "+" : ""}${m.saldo}</td>
                <td class="num">${m.ativas}</td>
              </tr>`).join("")}
          </table>
        </div>
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:10px"><strong>Por unidade</strong></div>
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Unidade</th><th class="num">Turmas</th><th class="num">Ativos</th>
                <th class="num">Capacidade</th><th class="num">Ociosas</th>
                <th class="num">Receita prevista</th></tr>
            ${p.porUnidade.map((u) => `
              <tr>
                <td>${escapar(u.unidade)}</td>
                <td class="num">${u.turmas}</td>
                <td class="num">${u.ativas}</td>
                <td class="num">${u.capacidade}</td>
                <td class="num">${u.vagasOciosas}</td>
                <td class="num">${fmt.moeda(u.receitaPrevista)}</td>
              </tr>`).join("")}
          </table>
        </div>
      </div>`;
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

// ==================================================================== caixa

async function carregarCaixa() {
  const alvo = el("secCaixa");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;

  try {
    const c = await api("/socios/caixa?meses=6");

    if (!c.disponivel) {
      alvo.innerHTML = `<div class="aviso alerta">${escapar(c.motivo)}</div>`;
      return;
    }

    const v = c.vencidas;
    const ultimo = c.serie[c.serie.length - 1];

    alvo.innerHTML = `
      <div class="placar">
        <div>
          <div class="rotulo">Recebido no mês</div>
          <div class="n alto">${moedaCurta(ultimo.recebido)}</div>
          <div class="apoio">${ultimo.cobrancas} cobranças pagas</div>
        </div>
        <div>
          <div class="rotulo">Em aberto vencido</div>
          <div class="n ${v.valor > 0 ? "baixo" : ""}">${moedaCurta(v.valor)}</div>
          <div class="apoio">${v.quantidade} cobranças</div>
        </div>
        <div>
          <div class="rotulo">Inadimplência</div>
          <div class="n ${v.percentual >= 10 ? "baixo" : ""}">${v.percentual}%</div>
          <div class="apoio">do que deveria entrar</div>
        </div>
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:2px"><strong>Recebido, mês a mês</strong></div>
        ${colunas(c.serie, (i) => i.recebido, moedaCurta)}
        <p class="meta" style="margin:0">
          Pela data do pagamento: boleto de um mês pago no seguinte conta no mês em que o
          dinheiro entrou.
        </p>
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:10px"><strong>Atraso por faixa</strong></div>
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Faixa</th><th class="num">Cobranças</th><th class="num">Valor</th></tr>
            ${v.faixas.map((f) => `
              <tr>
                <td>${escapar(f.rotulo)}</td>
                <td class="num">${f.quantidade}</td>
                <td class="num">${fmt.moeda(f.valor)}</td>
              </tr>`).join("")}
          </table>
        </div>
        <p class="meta" style="margin:10px 0 0">
          A lista nominal de quem está devendo fica no Administrativo, em Cobranças vencidas —
          é de lá que se cobra.
        </p>
      </div>`;
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

// ================================================================ sociedade
//
// O formulário guarda o que foi digitado no estado, e não no DOM: o painel é
// redesenhado a cada gravação, e um <input> lido depois disso volta vazio.

const soc = {
  editando: null,
  rascunho: { nome: "", participacao: "", email: "", telefone: "", entrouEm: "" },
  erro: "",
};

const RASCUNHO_VAZIO = () => ({ nome: "", participacao: "", email: "", telefone: "", entrouEm: "" });

function guardarSocio() {
  document.querySelectorAll("[data-socio-campo]").forEach((c) => {
    soc.rascunho[c.dataset.socioCampo] = c.value;
  });
}

async function carregarSociedade() {
  const alvo = el("secSociedade");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;
  try {
    soc.dados = await api("/socios/sociedade");
    pintarSociedade();
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

function pintarSociedade() {
  const alvo = el("secSociedade");
  const d = soc.dados;
  const r = soc.rascunho;

  alvo.innerHTML = `
    ${d.socios.length && !d.fechaCem ? `
      <div class="aviso alerta" style="margin-bottom:14px">
        As participações somam ${d.somaParticipacao}%, não 100%. Se é uma entrada ou saída em
        andamento, tudo bem — só não esqueça de fechar.
      </div>` : ""}

    <div class="cartao">
      <div class="linha" style="margin-bottom:10px"><strong>Sócios</strong>
        <span class="meta">${d.somaParticipacao}% distribuídos</span></div>
      ${d.socios.length ? `
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Nome</th><th class="num">Participação</th><th>Contato</th><th>Desde</th><th></th></tr>
            ${d.socios.map((s) => `
              <tr>
                <td><strong>${escapar(s.nome)}</strong></td>
                <td class="num">${s.participacao}%</td>
                <td>${escapar(s.email || s.telefone || "—")}</td>
                <td>${s.entrouEm ? fmt.data(s.entrouEm) : "—"}</td>
                <td class="num">
                  <button class="botao fantasma" type="button" data-editar="${s.id}">Editar</button>
                  <button class="botao fantasma" type="button" data-remover="${s.id}">Remover</button>
                </td>
              </tr>`).join("")}
          </table>
        </div>` : `<div class="vazio">Nenhum sócio cadastrado ainda.</div>`}
    </div>

    <div class="cartao" style="margin-top:14px">
      <div class="linha" style="margin-bottom:10px">
        <strong>${soc.editando ? "Editar sócio" : "Novo sócio"}</strong>
        ${soc.editando ? `<button class="botao fantasma" type="button" id="btnCancelarSocio">Cancelar</button>` : ""}
      </div>
      <div class="pilha" style="gap:12px">
        <div class="campo"><label class="rotulo" for="socNome">Nome</label>
          <input id="socNome" data-socio-campo="nome" value="${escapar(r.nome)}"></div>
        <div style="display:flex;gap:10px">
          <div class="campo" style="flex:1"><label class="rotulo" for="socPart">Participação (%)</label>
            <input id="socPart" data-socio-campo="participacao" inputmode="decimal" value="${escapar(r.participacao)}"></div>
          <div class="campo" style="flex:1"><label class="rotulo" for="socDesde">Desde</label>
            <input id="socDesde" data-socio-campo="entrouEm" type="date" value="${escapar(r.entrouEm)}"></div>
        </div>
        <div class="campo"><label class="rotulo" for="socEmail">E-mail</label>
          <input id="socEmail" data-socio-campo="email" type="email" value="${escapar(r.email)}"></div>
        <div class="campo"><label class="rotulo" for="socTel">Telefone</label>
          <input id="socTel" data-socio-campo="telefone" value="${escapar(r.telefone)}"></div>
        <div class="aviso erro ${soc.erro ? "" : "oculto"}">${escapar(soc.erro)}</div>
        <button class="botao" type="button" id="btnSalvarSocio">
          ${soc.editando ? "Salvar" : "Cadastrar"}
        </button>
      </div>
    </div>`;

  ligarSociedade();
}

function ligarSociedade() {
  const alvo = el("secSociedade");

  alvo.querySelectorAll("[data-editar]").forEach((b) =>
    b.addEventListener("click", () => {
      const s = soc.dados.socios.find((x) => x.id === b.dataset.editar);
      if (!s) return;
      soc.editando = s.id;
      soc.erro = "";
      soc.rascunho = {
        nome: s.nome,
        participacao: String(s.participacao),
        email: s.email || "",
        telefone: s.telefone || "",
        entrouEm: s.entrouEm ? String(s.entrouEm).slice(0, 10) : "",
      };
      pintarSociedade();
    }));

  el("btnCancelarSocio")?.addEventListener("click", () => {
    soc.editando = null;
    soc.erro = "";
    soc.rascunho = RASCUNHO_VAZIO();
    pintarSociedade();
  });

  alvo.querySelectorAll("[data-remover]").forEach((b) =>
    b.addEventListener("click", async () => {
      const s = soc.dados.socios.find((x) => x.id === b.dataset.remover);
      if (!confirm(`Remover ${s?.nome} da sociedade? As distribuições já lançadas continuam no histórico.`)) return;
      try {
        await api(`/socios/sociedade/${b.dataset.remover}`, { method: "DELETE" });
        invalidar("distribuicoes");
        await carregarSociedade();
      } catch (e) {
        soc.erro = e.message;
        pintarSociedade();
      }
    }));

  el("btnSalvarSocio")?.addEventListener("click", async () => {
    guardarSocio();
    const r = soc.rascunho;
    soc.erro = "";

    try {
      const corpo = JSON.stringify({
        nome: r.nome.trim(),
        participacao: r.participacao.replace(",", "."),
        email: r.email.trim(),
        telefone: r.telefone.trim(),
        entrouEm: r.entrouEm,
      });

      if (soc.editando) {
        await api(`/socios/sociedade/${soc.editando}`, { method: "PUT", body: corpo });
      } else {
        await api("/socios/sociedade", { method: "POST", body: corpo });
      }

      soc.editando = null;
      soc.rascunho = RASCUNHO_VAZIO();
      invalidar("distribuicoes");
      await carregarSociedade();
    } catch (e) {
      soc.erro = e.message;
      pintarSociedade();
    }
  });
}

/**
 * O fechamento de cada dia, gravado às 23:59.
 *
 * Vem primeiro no painel porque é o único número da tela que não foi calculado
 * agora: ele é o que a escola era naquele dia, e não o que a base de hoje
 * sugere que ela tenha sido. A diferença aparece quando um plano muda de preço
 * ou uma matrícula é cancelada — o passado calculado muda, o gravado não.
 */
function blocoFechamentos(f) {
  if (!f || !f.dias.length) {
    return `
      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:6px"><strong>Fechamento diário</strong></div>
        <p class="meta" style="margin:0">
          O primeiro fechamento é gravado às 23:59 de hoje. A partir daí, esta série mostra o
          movimento de cada dia — quantos alunos, quantos entraram e quantos saíram.
        </p>
      </div>`;
  }

  const ultimos = f.dias.slice(-14);
  const ontem = f.dias[f.dias.length - 1];

  return `
    <div class="cartao" style="margin-top:14px">
      <div class="linha" style="margin-bottom:2px">
        <strong>Fechamento diário</strong>
        <span class="meta">último: ${fmt.data(ontem.data)} · ${ontem.ativos} alunos</span>
      </div>
      ${colunas(
        ultimos.map((d) => ({ ...d, corrente: d === ontem })),
        (i) => i.ativos,
        (v) => String(v),
        // Rótulo de dia, não de mês: catorze colunas seguidas com "set/26"
        // embaixo de cada uma não diriam nada.
        (i) => i.data.slice(8, 10) + "/" + i.data.slice(5, 7),
      )}
      <div class="rolagem" style="margin-top:4px">
        <table class="tabelinha">
          <tr><th>Dia</th><th class="num">Alunos</th><th class="num">Entraram</th>
              <th class="num">Saíram</th><th class="num">Saldo</th><th></th></tr>
          ${f.dias.slice().reverse().slice(0, 10).map((d) => `
            <tr>
              <td>${fmt.diaCurto(d.data)}</td>
              <td class="num">${d.ativos}</td>
              <td class="num">${d.entradas}</td>
              <td class="num">${d.saidas}</td>
              <td class="num" style="font-weight:600">${d.saldo > 0 ? "+" : ""}${d.saldo}</td>
              <td class="num">${d.origem === "RECONSTRUIDO"
                ? '<span class="pilula alerta">reconstruído</span>' : ""}</td>
            </tr>`).join("")}
        </table>
      </div>
      ${f.reconstruidos ? `
        <p class="meta" style="margin:10px 0 0">
          ${f.reconstruidos} ${f.reconstruidos === 1 ? "dia foi reconstruído" : "dias foram reconstruídos"}
          da base atual, porque o sistema não estava de pé às 23:59 daquele dia. Os demais são
          o retrato gravado no próprio dia.
        </p>` : ""}
    </div>`;
}

// ==================================================================== turmas

/**
 * Ociosa e disputada são a mesma lista, lida dos dois lados. Turma sem
 * capacidade cadastrada fica fora das duas: sem o número não há ocupação, e
 * ela apareceria no topo das ociosas por falta de dado, não por falta de aluno.
 */
async function carregarTurmas() {
  const alvo = el("secTurmas");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;

  try {
    const r = await api("/socios/turmas");
    const comCapacidade = r.turmas.filter((t) => t.capacidade > 0);
    const semCapacidade = r.turmas.filter((t) => !t.capacidade);

    const ociosas = [...comCapacidade]
      .sort((a, b) => (b.potencialOcioso ?? 0) - (a.potencialOcioso ?? 0) || b.vagas - a.vagas)
      .slice(0, 12);

    // Demanda é turma que tem alguém: com aluno matriculado ou com pedido na
    // fila. Sem este filtro a lista se enchia de turmas em 0% — que são o
    // oposto de demanda, e estavam ali só porque a ordenação empatava tudo.
    const disputadas = comCapacidade
      .filter((t) => t.ocupacao > 0 || t.pendentes > 0)
      .sort((a, b) => b.ocupacao - a.ocupacao || b.pendentes - a.pendentes)
      .slice(0, 12);

    const ociosoTotal = comCapacidade.reduce((s, t) => s + (t.potencialOcioso || 0), 0);
    const cheias = comCapacidade.filter((t) => t.ocupacao >= 100).length;

    alvo.innerHTML = `
      <div class="placar">
        <div>
          <div class="rotulo">Turmas cheias</div>
          <div class="n">${cheias}</div>
          <div class="apoio">de ${comCapacidade.length} com capacidade</div>
        </div>
        <div>
          <div class="rotulo">Vagas ociosas</div>
          <div class="n">${comCapacidade.reduce((s, t) => s + t.vagas, 0)}</div>
          <div class="apoio">${moedaCurta(ociosoTotal)}/mês se cheias</div>
        </div>
        <div>
          <div class="rotulo">Pedidos na fila</div>
          <div class="n">${r.turmas.reduce((s, t) => s + t.pendentes, 0)}</div>
          <div class="apoio">aguardando o administrativo</div>
        </div>
      </div>

      ${tabelaTurmas("Turmas que mais deixam dinheiro na mesa", ociosas, "ociosa")}
      ${disputadas.length
        ? tabelaTurmas("Turmas com maior demanda", disputadas, "demanda")
        : `<div class="cartao" style="margin-top:14px">
             <div class="linha" style="margin-bottom:6px"><strong>Turmas com maior demanda</strong></div>
             <p class="meta" style="margin:0">Nenhuma turma com aluno matriculado ou pedido na fila ainda.</p>
           </div>`}

      ${semCapacidade.length ? `
        <div class="aviso alerta" style="margin-top:14px">
          ${semCapacidade.length} turma${semCapacidade.length === 1 ? "" : "s"} sem capacidade
          cadastrada ${semCapacidade.length === 1 ? "ficou" : "ficaram"} fora das duas listas:
          ${escapar(semCapacidade.slice(0, 6).map((t) => t.turma).join(", "))}${semCapacidade.length > 6 ? "…" : ""}.
          Sem o número não dá para dizer se está cheia ou vazia.
        </div>` : ""}`;
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

function tabelaTurmas(titulo, linhas, tipo) {
  if (!linhas.length) return "";
  return `
    <div class="cartao" style="margin-top:14px">
      <div class="linha" style="margin-bottom:10px"><strong>${escapar(titulo)}</strong></div>
      <div class="rolagem">
        <table class="tabelinha">
          <tr>
            <th>Turma</th><th>Unidade</th>
            <th class="num">Alunos</th><th class="num">Capacidade</th>
            <th class="num">Ocupação</th>
            <th class="num">${tipo === "ociosa" ? "Ocioso/mês" : "Na fila"}</th>
            <th class="num">Entraram</th><th class="num">Saíram</th>
          </tr>
          ${linhas.map((t) => `
            <tr>
              <td><strong>${escapar(t.turma)}</strong>
                  ${t.categoria ? `<div class="meta">${escapar(t.categoria)}</div>` : ""}</td>
              <td>${escapar(t.unidade)}</td>
              <td class="num">${t.ativas}</td>
              <td class="num">${t.capacidade}</td>
              <td class="num">
                <span class="pilula ${t.ocupacao >= 100 ? "erro" : t.ocupacao >= 80 ? "ok" : t.ocupacao >= 40 ? "neutra" : "alerta"}">
                  ${t.ocupacao}%
                </span>
              </td>
              <td class="num">${tipo === "ociosa"
                ? (t.potencialOcioso === null ? "—" : moedaCurta(t.potencialOcioso) +
                    (t.ticketDe === "plano" ? '<div class="meta">pelo plano</div>' : ""))
                : t.pendentes}</td>
              <td class="num">${t.entradasRecentes}</td>
              <td class="num">${t.saidasRecentes}</td>
            </tr>`).join("")}
        </table>
      </div>
      <p class="meta" style="margin:10px 0 0">
        Entradas e saídas dos últimos 4 meses.
        ${tipo === "ociosa"
          ? "O valor é o que a turma renderia cheia. Com aluno, pelo ticket da própria turma; vazia, pelo preço do plano ligado a ela."
          : "“Na fila” são pedidos que chegaram e ainda não foram confirmados."}
      </p>
    </div>`;
}

// ==================================================================== adesão

async function carregarAdesao() {
  const alvo = el("secAdesao");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;

  try {
    const a = await api("/socios/adesao?meses=6");
    const p = a.periodo;

    alvo.innerHTML = `
      <div class="placar">
        <div>
          <div class="rotulo">Taxa de adesão</div>
          <div class="n ${p.taxa !== null && p.taxa < 70 ? "baixo" : "alto"}">
            ${p.taxa === null ? "—" : p.taxa + "%"}
          </div>
          <div class="apoio">dos pedidos já decididos</div>
        </div>
        <div>
          <div class="rotulo">Pedidos recebidos</div>
          <div class="n">${p.recebidos}</div>
          <div class="apoio">nos últimos 6 meses</div>
        </div>
        <div>
          <div class="rotulo">Viraram matrícula</div>
          <div class="n">${p.confirmados}</div>
          <div class="apoio">${p.pelosite} vieram do site</div>
        </div>
        <div>
          <div class="rotulo">Ainda na fila</div>
          <div class="n ${p.aguardando > 0 ? "baixo" : ""}">${p.aguardando}</div>
          <div class="apoio">esperando confirmação</div>
        </div>
      </div>

      <div class="aviso info" style="margin-top:14px">
        <strong>Como esta taxa é contada:</strong> confirmados ÷ (confirmados + recusados).
        Pedido que ainda espera o administrativo fica de fora da conta — senão a taxa do mês
        corrente cairia todo mês, por construção. Se para vocês “adesão” é
        <em>matriculados ÷ capacidade</em>, esse número está na aba Turmas, como ocupação.
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:2px"><strong>Taxa mês a mês</strong></div>
        ${colunas(a.serie.map((m) => ({ ...m, valor: m.taxa ?? 0 })), (i) => i.valor, (v) => v + "%")}
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:10px"><strong>Detalhe por mês</strong></div>
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Mês</th><th class="num">Recebidos</th><th class="num">Do site</th>
                <th class="num">Confirmados</th><th class="num">Recusados</th>
                <th class="num">Na fila</th><th class="num">Adesão</th></tr>
            ${a.serie.slice().reverse().map((m) => `
              <tr>
                <td>${escapar(rotuloMes(m.mes))}${m.corrente ? ' <span class="meta">(em curso)</span>' : ""}</td>
                <td class="num">${m.recebidos}</td>
                <td class="num">${m.pelosite}</td>
                <td class="num">${m.confirmados}</td>
                <td class="num">${m.recusados}</td>
                <td class="num">${m.aguardando}</td>
                <td class="num"><strong>${m.taxa === null ? "—" : m.taxa + "%"}</strong></td>
              </tr>`).join("")}
          </table>
        </div>
      </div>`;
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

// =================================================================== início

function concluirLogin(r) {
  Sessao.token = r.token;
  Sessao.usuario = r.usuario;
  pintarUsuario();
  decidirTela();
}

async function decidirTela() {
  try {
    const eu = await api("/auth/eu");
    pintarNavegacao(el("areas"), eu, "socios");
    pintarNavegacao(el("areasSemPermissao"), eu, "socios");

    if (!eu.papeis.includes("SOCIO")) {
      el("emailSemPermissao").textContent = eu.email || "";
      return mostrar("semPermissao");
    }

    mostrar("app");
    pintarUsuario();
    abrirAba("painel");
  } catch {
    sair();
  }
}

async function iniciar() {
  if (Sessao.token && Sessao.usuario) {
    pintarUsuario();
    return decidirTela();
  }
  mostrar("login");
  montarLogin(el("botaoGoogle"), concluirLogin, (mensagem) => {
    el("erroLogin").textContent = mensagem;
    el("erroLogin").classList.remove("oculto");
  });
}

iniciar();
</script>
