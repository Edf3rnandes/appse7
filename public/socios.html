<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Diretoria · SE7 Vôlei de Praia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d6f7a'/%3E%3Cpath d='M16 1c6 6 6 24 0 30M1 16c8-5 22-5 30 0M6 5c2 8 8 17 16 22' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <style>
    /* Cartões de número grande: o painel do sócio é lido de longe, numa
       reunião, não estudado de perto como uma lista de matrículas. */
    .placar { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--card); }
    .placar > div { flex: 1 1 150px; padding: 14px 16px; border-right: 1px solid var(--rule); }
    .placar > div:last-child { border-right: 0; }
    .placar .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .placar .n.baixo { color: var(--erro, #b4413a); }
    .placar .n.alto { color: var(--accent); }
    .placar .rotulo { margin-bottom: 4px; }
    .placar .apoio { font-size: 12px; color: var(--ink-3); margin-top: 3px; }

    /* Colunas do gráfico de meses. Sem biblioteca: seis a doze barras não
       justificam trazer um megabyte de JavaScript para dentro da página. */
    .colunas { display: flex; align-items: flex-end; gap: 8px; height: 150px; margin: 6px 0 10px; }
    .colunas .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
    .colunas .haste { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; opacity: .82; }
    .colunas .col.agora .haste { opacity: 1; }
    .colunas .rot { font-size: 11px; color: var(--ink-3); margin-top: 6px; white-space: nowrap; }
    .colunas .val { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-2); margin-bottom: 4px; }

    .tabelinha { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tabelinha th { text-align: left; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--rule); font-weight: 600; }
    .tabelinha td { padding: 9px 8px; border-bottom: 1px solid var(--rule); }
    .tabelinha td.num, .tabelinha th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rolagem { overflow-x: auto; }

    .abas-socio { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
    .abas-socio button { border: 1px solid var(--rule); background: var(--card); color: var(--ink-2); padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
    .abas-socio button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  </style>
</head>
<body>

<header class="topo">
  <div class="marca"><span class="se7">SE7</span><span class="sub">Diretoria</span></div>
  <div class="espaco"></div>
  <nav class="areas" id="areas" hidden></nav>
  <div class="usuario oculto" id="boxUsuario">
    <img id="avatar" alt="" hidden>
    <span class="nome" id="nomeUsuario"></span>
    <button class="botao fantasma" id="btnSair" type="button">Sair</button>
  </div>
</header>

<main class="centro" id="telaLogin" hidden>
  <h1 style="font-size:26px">Diretoria</h1>
  <p style="color:var(--ink-2);margin:14px 0 28px">
    Entre com a conta da escola.
  </p>
  <div id="botaoGoogle" style="display:flex;justify-content:center"></div>
  <div class="aviso erro oculto" id="erroLogin" style="margin-top:22px;text-align:left"></div>
</main>

<main class="centro" id="telaSemPermissao" hidden>
  <h1 style="font-size:22px">Esta área é da Diretoria</h1>
  <p style="color:var(--ink-2);margin:14px 0 24px">
    Você entrou como <strong id="emailSemPermissao"></strong>, que não tem acesso à Diretoria.
  </p>
  <nav class="areas" id="areasSemPermissao"></nav>
  <button class="botao fantasma" type="button" id="btnTrocar" style="margin-top:18px">
    Entrar com outra conta
  </button>
</main>

<main class="pagina" id="telaApp" hidden>
  <div class="abas-socio" role="tablist">
    <button role="tab" data-aba="painel" aria-selected="true">Painel</button>
    <button role="tab" data-aba="turmas" aria-selected="false">Turmas</button>
    <button role="tab" data-aba="adesao" aria-selected="false">Adesão</button>
    <button role="tab" data-aba="caixa" aria-selected="false">Caixa e inadimplência</button>
    <button role="tab" data-aba="sociedade" aria-selected="false">Sociedade</button>
    <button role="tab" data-aba="folha" aria-selected="false">Folha</button>
  </div>

  <section id="secPainel"></section>
  <section id="secTurmas" hidden></section>
  <section id="secAdesao" hidden></section>
  <section id="secCaixa" hidden></section>
  <section id="secSociedade" hidden></section>
  <section id="secFolha" hidden></section>
</main>

<script type="module">
import { Sessao, ErroApi, api, fmt, escapar, montarLogin, pintarNavegacao, mensagemConvite, linkWhatsapp } from "/app.js";

const el = (id) => document.getElementById(id);
const telas = { login: el("telaLogin"), semPermissao: el("telaSemPermissao"), app: el("telaApp") };

function mostrar(nome) {
  for (const [chave, node] of Object.entries(telas)) node.hidden = chave !== nome;
  el("boxUsuario").classList.toggle("oculto", nome === "login");
}

function pintarUsuario() {
  const u = Sessao.usuario;
  if (!u) return;
  el("nomeUsuario").textContent = u.nome || u.email || "";
  const img = el("avatar");
  if (u.avatarUrl) { img.src = u.avatarUrl; img.hidden = false; } else { img.hidden = true; }
}

function sair() { Sessao.limpar(); mostrar("login"); }
el("btnSair").addEventListener("click", sair);
el("btnTrocar").addEventListener("click", sair);

function aviso(e) {
  const classe = e instanceof ErroApi && e.status === 503 ? "alerta" : "erro";
  return `<div class="aviso ${classe}">${escapar(e.message)}</div>`;
}

/** "2026-09" -> "set/2026". Rótulo curto, que cabe embaixo de uma coluna. */
function rotuloMes(chave) {
  const [ano, mes] = chave.split("-").map(Number);
  const nome = new Date(ano, mes - 1, 1)
    .toLocaleDateString("pt-BR", { month: "short" })
    .replace(".", "");
  return `${nome}/${String(ano).slice(2)}`;
}

/** Só os centavos atrapalham num placar. R$ 61.240 lê melhor que R$ 61.239,87. */
const moedaCurta = (v) =>
  (Number(v) || 0).toLocaleString("pt-BR", {
    style: "currency", currency: "BRL", maximumFractionDigits: 0,
  });

/**
 * Gráfico de colunas.
 *
 * A escala começa em zero de propósito. Cortar a base faz uma queda de 2%
 * parecer um desabamento — e é justamente num painel de sócio, lido rápido e
 * usado para decidir, que essa distorção custa caro.
 */
function colunas(itens, valorDe, formatar, rotularCom = (i) => rotuloMes(i.mes)) {
  const maximo = Math.max(...itens.map(valorDe), 1);
  return `
    <div class="colunas">
      ${itens.map((i) => {
        const v = valorDe(i);
        const rot = rotularCom(i);
        return `
          <div class="col ${i.corrente ? "agora" : ""}">
            <div class="val">${formatar(v)}</div>
            <div class="haste" style="height:${Math.round((v / maximo) * 100)}%"
                 title="${escapar(rot)}: ${escapar(String(formatar(v)))}"></div>
            <div class="rot">${escapar(rot)}</div>
          </div>`;
      }).join("")}
    </div>`;
}

// ==================================================================== abas

const ABAS = {
  painel: { secao: "secPainel", carregar: () => carregarPainel() },
  turmas: { secao: "secTurmas", carregar: () => carregarTurmas() },
  adesao: { secao: "secAdesao", carregar: () => carregarAdesao() },
  caixa: { secao: "secCaixa", carregar: () => carregarCaixa() },
  sociedade: { secao: "secSociedade", carregar: () => carregarSociedade() },
  folha: { secao: "secFolha", carregar: () => carregarFolha() },
};

const carregadas = new Set();

function abrirAba(nome) {
  for (const [chave, aba] of Object.entries(ABAS)) {
    el(aba.secao).hidden = chave !== nome;
  }
  document.querySelectorAll("[data-aba]").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.aba === nome));
  });
  if (!carregadas.has(nome)) {
    carregadas.add(nome);
    ABAS[nome].carregar();
  }
}

document.querySelectorAll("[data-aba]").forEach((b) =>
  b.addEventListener("click", () => abrirAba(b.dataset.aba)));

/** Força a aba a recarregar na próxima abertura — depois de gravar algo. */
function invalidar(nome) { carregadas.delete(nome); }

// =================================================================== painel

async function carregarPainel() {
  const alvo = el("secPainel");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;

  try {
    // Os dois juntos: o painel é calculado agora, o fechamento foi gravado às
    // 23:59 de cada dia. Se o fechamento falhar, o painel ainda abre.
    const [p, f] = await Promise.all([
      api("/socios/painel?meses=6"),
      api("/socios/fechamentos?dias=30").catch(() => null),
    ]);
    const t = p.totais;
    const ultimo = p.serie[p.serie.length - 1];

    alvo.innerHTML = `
      <div class="placar">
        <div>
          <div class="rotulo">Receita prevista/mês</div>
          <div class="n">${moedaCurta(t.receitaPrevista)}</div>
          <div class="apoio">${t.ativas} matrículas ativas</div>
        </div>
        <div>
          <div class="rotulo">Ticket médio</div>
          <div class="n">${moedaCurta(t.ticketMedio)}</div>
          <div class="apoio">por aluno, por mês</div>
        </div>
        <div>
          <div class="rotulo">Saldo do mês</div>
          <div class="n ${ultimo.saldo < 0 ? "baixo" : ultimo.saldo > 0 ? "alto" : ""}">
            ${ultimo.saldo > 0 ? "+" : ""}${ultimo.saldo}
          </div>
          <div class="apoio">${ultimo.novas} entraram · ${ultimo.saidas} saíram</div>
        </div>
        <div>
          <div class="rotulo">Vagas ociosas</div>
          <div class="n">${t.vagasOciosas}</div>
          <div class="apoio">${moedaCurta(t.potencialOcioso)}/mês se cheias</div>
        </div>
      </div>

      ${blocoFechamentos(f)}

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:2px"><strong>Receita prevista, mês a mês</strong></div>
        ${colunas(p.serie, (i) => i.receitaPrevista, moedaCurta)}
        <p class="meta" style="margin:0">${escapar(p.reconstruido.nota)}</p>
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:2px"><strong>Alunos ativos, mês a mês</strong></div>
        ${colunas(p.serie, (i) => i.ativas, (v) => String(v))}
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:10px"><strong>Entradas e saídas</strong></div>
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Mês</th><th class="num">Entraram</th><th class="num">Saíram</th>
                <th class="num">Saldo</th><th class="num">Ativos no fim</th></tr>
            ${p.serie.slice().reverse().map((m) => `
              <tr>
                <td>${escapar(rotuloMes(m.mes))}${m.corrente ? ' <span class="meta">(em curso)</span>' : ""}</td>
                <td class="num">${m.novas}</td>
                <td class="num">${m.saidas}</td>
                <td class="num" style="font-weight:600">${m.saldo > 0 ? "+" : ""}${m.saldo}</td>
                <td class="num">${m.ativas}</td>
              </tr>`).join("")}
          </table>
        </div>
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:10px"><strong>Por unidade</strong></div>
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Unidade</th><th class="num">Turmas</th><th class="num">Ativos</th>
                <th class="num">Capacidade</th><th class="num">Ociosas</th>
                <th class="num">Receita prevista</th></tr>
            ${p.porUnidade.map((u) => `
              <tr>
                <td>${escapar(u.unidade)}</td>
                <td class="num">${u.turmas}</td>
                <td class="num">${u.ativas}</td>
                <td class="num">${u.capacidade}</td>
                <td class="num">${u.vagasOciosas}</td>
                <td class="num">${fmt.moeda(u.receitaPrevista)}</td>
              </tr>`).join("")}
          </table>
        </div>
      </div>`;
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

// ==================================================================== caixa

async function carregarCaixa() {
  const alvo = el("secCaixa");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;

  try {
    const c = await api("/socios/caixa?meses=6");

    if (!c.disponivel) {
      alvo.innerHTML = `<div class="aviso alerta">${escapar(c.motivo)}</div>`;
      return;
    }

    const v = c.vencidas;
    const ultimo = c.serie[c.serie.length - 1];

    alvo.innerHTML = `
      <div class="placar">
        <div>
          <div class="rotulo">Recebido no mês</div>
          <div class="n alto">${moedaCurta(ultimo.recebido)}</div>
          <div class="apoio">${ultimo.cobrancas} cobranças pagas</div>
        </div>
        <div>
          <div class="rotulo">Em aberto vencido</div>
          <div class="n ${v.valor > 0 ? "baixo" : ""}">${moedaCurta(v.valor)}</div>
          <div class="apoio">${v.quantidade} cobranças</div>
        </div>
        <div>
          <div class="rotulo">Inadimplência</div>
          <div class="n ${v.percentual >= 10 ? "baixo" : ""}">${v.percentual}%</div>
          <div class="apoio">do que deveria entrar</div>
        </div>
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:2px"><strong>Recebido, mês a mês</strong></div>
        ${colunas(c.serie, (i) => i.recebido, moedaCurta)}
        <p class="meta" style="margin:0">
          Pela data do pagamento: boleto de um mês pago no seguinte conta no mês em que o
          dinheiro entrou.
        </p>
      </div>

      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:10px"><strong>Atraso por faixa</strong></div>
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Faixa</th><th class="num">Cobranças</th><th class="num">Valor</th></tr>
            ${v.faixas.map((f) => `
              <tr>
                <td>${escapar(f.rotulo)}</td>
                <td class="num">${f.quantidade}</td>
                <td class="num">${fmt.moeda(f.valor)}</td>
              </tr>`).join("")}
          </table>
        </div>
        <p class="meta" style="margin:10px 0 0">
          A lista nominal de quem está devendo fica no Administrativo, em Cobranças vencidas —
          é de lá que se cobra.
        </p>
      </div>`;
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

// ================================================================ sociedade
//
// O formulário guarda o que foi digitado no estado, e não no DOM: o painel é
// redesenhado a cada gravação, e um <input> lido depois disso volta vazio.

const soc = {
  editando: null,
  rascunho: { nome: "", participacao: "", email: "", telefone: "", entrouEm: "" },
  erro: "",
};

const RASCUNHO_VAZIO = () => ({ nome: "", participacao: "", email: "", telefone: "", entrouEm: "" });

function guardarSocio() {
  document.querySelectorAll("[data-socio-campo]").forEach((c) => {
    soc.rascunho[c.dataset.socioCampo] = c.value;
  });
}

async function carregarSociedade() {
  const alvo = el("secSociedade");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;
  try {
    soc.dados = await api("/socios/sociedade");
    pintarSociedade();
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

function pintarSociedade() {
  const alvo = el("secSociedade");
  const d = soc.dados;
  const r = soc.rascunho;

  alvo.innerHTML = `
    ${d.socios.length && !d.fechaCem ? `
      <div class="aviso alerta" style="margin-bottom:14px">
        As participações somam ${d.somaParticipacao}%, não 100%. Se é uma entrada ou saída em
        andamento, tudo bem — só não esqueça de fechar.
      </div>` : ""}

    <div class="cartao">
      <div class="linha" style="margin-bottom:10px"><strong>Sócios</strong>
        <span class="meta">${d.somaParticipacao}% distribuídos</span></div>
      ${d.socios.length ? `
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Nome</th><th class="num">Participação</th><th>Contato</th><th>Desde</th><th></th></tr>
            ${d.socios.map((s) => `
              <tr>
                <td><strong>${escapar(s.nome)}</strong></td>
                <td class="num">${s.participacao}%</td>
                <td>${escapar(s.email || s.telefone || "—")}</td>
                <td>${s.entrouEm ? fmt.data(s.entrouEm) : "—"}</td>
                <td class="num">
                  <button class="botao fantasma" type="button" data-editar="${s.id}">Editar</button>
                  <button class="botao fantasma" type="button" data-remover="${s.id}">Remover</button>
                </td>
              </tr>`).join("")}
          </table>
        </div>` : `<div class="vazio">Nenhum sócio cadastrado ainda.</div>`}
    </div>

    <div class="cartao" style="margin-top:14px">
      <div class="linha" style="margin-bottom:10px">
        <strong>${soc.editando ? "Editar sócio" : "Novo sócio"}</strong>
        ${soc.editando ? `<button class="botao fantasma" type="button" id="btnCancelarSocio">Cancelar</button>` : ""}
      </div>
      <div class="pilha" style="gap:12px">
        <div class="campo"><label class="rotulo" for="socNome">Nome</label>
          <input id="socNome" data-socio-campo="nome" value="${escapar(r.nome)}"></div>
        <div style="display:flex;gap:10px">
          <div class="campo" style="flex:1"><label class="rotulo" for="socPart">Participação (%)</label>
            <input id="socPart" data-socio-campo="participacao" inputmode="decimal" value="${escapar(r.participacao)}"></div>
          <div class="campo" style="flex:1"><label class="rotulo" for="socDesde">Desde</label>
            <input id="socDesde" data-socio-campo="entrouEm" type="date" value="${escapar(r.entrouEm)}"></div>
        </div>
        <div class="campo"><label class="rotulo" for="socEmail">E-mail</label>
          <input id="socEmail" data-socio-campo="email" type="email" value="${escapar(r.email)}"></div>
        <div class="campo"><label class="rotulo" for="socTel">Telefone</label>
          <input id="socTel" data-socio-campo="telefone" value="${escapar(r.telefone)}"></div>
        <div class="aviso erro ${soc.erro ? "" : "oculto"}">${escapar(soc.erro)}</div>
        <button class="botao" type="button" id="btnSalvarSocio">
          ${soc.editando ? "Salvar" : "Cadastrar"}
        </button>
      </div>
    </div>`;

  ligarSociedade();
}

function ligarSociedade() {
  const alvo = el("secSociedade");

  alvo.querySelectorAll("[data-editar]").forEach((b) =>
    b.addEventListener("click", () => {
      const s = soc.dados.socios.find((x) => x.id === b.dataset.editar);
      if (!s) return;
      soc.editando = s.id;
      soc.erro = "";
      soc.rascunho = {
        nome: s.nome,
        participacao: String(s.participacao),
        email: s.email || "",
        telefone: s.telefone || "",
        entrouEm: s.entrouEm ? String(s.entrouEm).slice(0, 10) : "",
      };
      pintarSociedade();
    }));

  el("btnCancelarSocio")?.addEventListener("click", () => {
    soc.editando = null;
    soc.erro = "";
    soc.rascunho = RASCUNHO_VAZIO();
    pintarSociedade();
  });

  alvo.querySelectorAll("[data-remover]").forEach((b) =>
    b.addEventListener("click", async () => {
      const s = soc.dados.socios.find((x) => x.id === b.dataset.remover);
      if (!confirm(`Remover ${s?.nome} da sociedade? As distribuições já lançadas continuam no histórico.`)) return;
      try {
        await api(`/socios/sociedade/${b.dataset.remover}`, { method: "DELETE" });
        invalidar("distribuicoes");
        await carregarSociedade();
      } catch (e) {
        soc.erro = e.message;
        pintarSociedade();
      }
    }));

  el("btnSalvarSocio")?.addEventListener("click", async () => {
    guardarSocio();
    const r = soc.rascunho;
    soc.erro = "";

    try {
      const corpo = JSON.stringify({
        nome: r.nome.trim(),
        participacao: r.participacao.replace(",", "."),
        email: r.email.trim(),
        telefone: r.telefone.trim(),
        entrouEm: r.entrouEm,
      });

      if (soc.editando) {
        await api(`/socios/sociedade/${soc.editando}`, { method: "PUT", body: corpo });
      } else {
        await api("/socios/sociedade", { method: "POST", body: corpo });
      }

      soc.editando = null;
      soc.rascunho = RASCUNHO_VAZIO();
      invalidar("distribuicoes");
      await carregarSociedade();
    } catch (e) {
      soc.erro = e.message;
      pintarSociedade();
    }
  });
}

/**
 * O fechamento de cada dia, gravado às 23:59.
 *
 * Vem primeiro no painel porque é o único número da tela que não foi calculado
 * agora: ele é o que a escola era naquele dia, e não o que a base de hoje
 * sugere que ela tenha sido. A diferença aparece quando um plano muda de preço
 * ou uma matrícula é cancelada — o passado calculado muda, o gravado não.
 */
function blocoFechamentos(f) {
  if (!f || !f.dias.length) {
    return `
      <div class="cartao" style="margin-top:14px">
        <div class="linha" style="margin-bottom:6px"><strong>Fechamento diário</strong></div>
        <p class="meta" style="margin:0">
          O primeiro fechamento é gravado às 23:59 de hoje. A partir daí, esta série mostra o
          movimento de cada dia — quantos alunos, quantos entraram e quantos saíram.
        </p>
      </div>`;
  }

  const ultimos = f.dias.slice(-14);
  const ontem = f.dias[f.dias.length - 1];

  return `
    <div class="cartao" style="margin-top:14px">
      <div class="linha" style="margin-bottom:2px">
        <strong>Fechamento diário</strong>
        <span class="meta">último: ${fmt.data(ontem.data)} · ${ontem.ativos} alunos</span>
      </div>
      ${colunas(
        ultimos.map((d) => ({ ...d, corrente: d === ontem })),
        (i) => i.ativos,
        (v) => String(v),
        // Rótulo de dia, não de mês: catorze colunas seguidas com "set/26"
        // embaixo de cada uma não diriam nada.
        (i) => i.data.slice(8, 10) + "/" + i.data.slice(5, 7),
      )}
      <div class="rolagem" style="margin-top:4px">
        <table class="tabelinha">
          <tr><th>Dia</th><th class="num">Alunos</th><th class="num">Entraram</th>
              <th class="num">Saíram</th><th class="num">Saldo</th><th></th></tr>
          ${f.dias.slice().reverse().slice(0, 10).map((d) => `
            <tr>
              <td>${fmt.diaCurto(d.data)}</td>
              <td class="num">${d.ativos}</td>
              <td class="num">${d.entradas}</td>
              <td class="num">${d.saidas}</td>
              <td class="num" style="font-weight:600">${d.saldo > 0 ? "+" : ""}${d.saldo}</td>
              <td class="num">${d.origem === "RECONSTRUIDO"
                ? '<span class="pilula alerta">reconstruído</span>' : ""}</td>
            </tr>`).join("")}
        </table>
      </div>
      ${f.reconstruidos ? `
        <p class="meta" style="margin:10px 0 0">
          ${f.reconstruidos} ${f.reconstruidos === 1 ? "dia foi reconstruído" : "dias foram reconstruídos"}
          da base atual, porque o sistema não estava de pé às 23:59 daquele dia. Os demais são
          o retrato gravado no próprio dia.
        </p>` : ""}
    </div>`;
}

/**
 * Ociosa e disputada são a mesma lista, lida dos dois lados. Turma sem
 * capacidade cadastrada fica fora das duas: sem o número não há ocupação, e
 * ela apareceria no topo das ociosas por falta de dado, não por falta de aluno.
 */
async function carregarTurmas() {
  const alvo = el("secTurmas");
  alvo.innerHTML = `<div class="carregando">Carregando…</div>`;

  try {
    const r = await api("/socios/turmas");
    const comCapacidade = r.turmas.filter((t) => t.capacidade > 0);
    const semCapacidade = r.turmas.filter((t) => !t.capacidade);

    const ociosas = [...comCapacidade]
      .sort((a, b) => (b.potencialOcioso ?? 0) - (a.potencialOcioso ?? 0) || b.vagas - a.vagas)
      .slice(0, 12);

    // Demanda é turma que tem alguém: com aluno matriculado ou com pedido na
    // fila. Sem este filtro a lista se enchia de turmas em 0% — que são o
    // oposto de demanda, e estavam ali só porque a ordenação empatava tudo.
    const disputadas = comCapacidade
      .filter((t) => t.ocupacao > 0 || t.pendentes > 0)
      .sort((a, b) => b.ocupacao - a.ocupacao || b.pendentes - a.pendentes)
      .slice(0, 12);

    const ociosoTotal = comCapacidade.reduce((s, t) => s + (t.potencialOcioso || 0), 0);
    const cheias = comCapacidade.filter((t) => t.ocupacao >= 100).length;

    alvo.innerHTML = `
      <div class="placar">
        <div>
          <div class="rotulo">Turmas cheias</div>
          <div class="n">${cheias}</div>
          <div class="apoio">de ${comCapacidade.length} com capacidade</div>
        </div>
        <div>
          <div class="rotulo">Vagas ociosas</div>
          <div class="n">${comCapacidade.reduce((s, t) => s + t.vagas, 0)}</div>
          <div class="apoio">${moedaCurta(ociosoTotal)}/mês se cheias</div>
        </div>
        <div>
          <div class="rotulo">Pedidos na fila</div>
          <div class="n">${r.turmas.reduce((s, t) => s + t.pendentes, 0)}</div>
          <div class="apoio">aguardando o administrativo</div>
        </div>
      </div>

      ${tabelaTurmas("Turmas que mais deixam dinheiro na mesa", ociosas, "ociosa")}
      ${disputadas.length
        ? tabelaTurmas("Turmas com maior demanda", disputadas, "demanda")
        : `<div class="cartao" style="margin-top:14px">
             <div class="linha" style="margin-bottom:6px"><strong>Turmas com maior demanda</strong></div>
             <p class="meta" style="margin:0">Nenhuma turma com aluno matriculado ou pedido na fila ainda.</p>
           </div>`}

      ${semCapacidade.length ? `
        <div class="aviso alerta" style="margin-top:14px">
          ${semCapacidade.length} turma${semCapacidade.length === 1 ? "" : "s"} sem capacidade
          cadastrada ${semCapacidade.length === 1 ? "ficou" : "ficaram"} fora das duas listas:
          ${escapar(semCapacidade.slice(0, 6).map((t) => t.turma).join(", "))}${semCapacidade.length > 6 ? "…" : ""}.
          Sem o número não dá para dizer se está cheia ou vazia.
        </div>` : ""}`;
  } catch (e) {
    alvo.innerHTML = aviso(e);
  }
}

/**
 * Valor de um lançamento — espelha o `calc()` da planilha original: alguns
 * tipos têm valor fixo (Competição, Bônus...), o resto sai de horas × valor
 * do nível. Nunca gravado, sempre recalculado na leitura, pra mudar a
 * tabela de valores recalcular tudo pra trás sozinho.
 */
function calcLancamento(l) {
  const colab = folha.colaboradores.find((c) => c.id === l.colaboradorId);
  if (!colab) return { valorHoras: 0, valorVt: 0, total: 0 };
  const v = folha.valores.find((x) => x.tipo === colab.tipo && x.nivel === l.nivel) || { valorHora: 0, valorVt: 0 };
  const valorHoras = (Number(l.horas) || 0) * Number(v.valorHora);
  const isAusencia = l.tipo === "AUSENCIA" || l.tipo === "AUSENCIA_ATESTADO";
  const valorVt = (l.usaVt && !isAusencia) ? Number(v.valorVt) : 0;
  let total = 0;
  switch (l.tipo) {
    case "COMPETICAO": total = 90; break;
    case "COMPETICAO_PSICOLOGA": total = 40; break;
    case "DESCONTO_VT": total = -(Number(l.horas) || 0) * Number(v.valorVt); break;
    case "BONUS": total = 25; break;
    case "BANCO_HORAS_COMPENSADO": total = 0; break;
    case "EXTRA": total = valorHoras + valorVt; break;
    case "AUSENCIA_ATESTADO": total = 0; break;
    case "AUSENCIA": total = colab.tipo === "PROFESSOR" ? 0 : -valorHoras; break;
  }
  return { valorHoras, valorVt, total };
}

/** Meses (AAAA-MM) com pelo menos um lançamento, do mais recente pro mais antigo. */
function mesesComLancamento() {
  const meses = new Set(folha.lancamentos.map((l) => String(l.data).slice(0, 7)));
  return [...meses].sort().reverse();
}

/** Estatísticas agregadas de um colaborador num mês (ou todos os meses, se mesFiltro for vazio). */
function colabStats(colaboradorId, mesFiltro) {
  const linhas = folha.lancamentos.filter((l) =>
    l.colaboradorId === colaboradorId && (!mesFiltro || String(l.data).slice(0, 7) === mesFiltro));
  const st = {
    linhas, horasExtras: 0, valorExtras: 0,
    faltasSemCount: 0, faltasSemHoras: 0, faltasSemValor: 0,
    faltasComCount: 0, bonusComp: 0, totalPeriodo: 0,
  };
  for (const l of linhas) {
    const c = calcLancamento(l);
    st.totalPeriodo += c.total;
    if (l.tipo === "EXTRA") { st.horasExtras += Number(l.horas) || 0; st.valorExtras += c.total; }
    else if (l.tipo === "AUSENCIA") { st.faltasSemCount += 1; st.faltasSemHoras += Number(l.horas) || 0; st.faltasSemValor += c.total; }
    else if (l.tipo === "AUSENCIA_ATESTADO") { st.faltasComCount += 1; }
    else if (l.tipo === "BONUS" || l.tipo === "COMPETICAO" || l.tipo === "COMPETICAO_PSICOLOGA") { st.bonusComp += c.total; }
  }
  return st;
}

  return folha.colaboradores.find((c) => c.id === colaboradorId)?.professor.nome || "—";

        return `

          <td>${l.usaVt ? "Sim" : "Não"}</td>
          <td class="num">${fmt.moeda(c.total)}</td>
          <td>${escapar(l.motivo || "—")}</td>
        </tr>`;
      }).join("")}
    </table>`;
}

function pintarFolha() {
  const alvo = el("secFolha");
  const SUBS = [
    ["colaboradores", "Colaboradores"],
    ["grade", "Grade Horária"],
    ["valores", "Valores"],
    ["lancamentos", "Lançamentos"],
    ["extrato", "Extrato do Colaborador"],
    ["compilado", "Fechamento Mensal"],
    ["folhapagamento", "Folha de Pagamento"],
    ["controleinterno", "Controle Interno"],
  ];
  alvo.innerHTML = `
    <div class="abas-socio" role="tablist" style="margin-bottom:14px">
      ${SUBS.map(([chave, rotulo]) => `
        <button role="tab" data-sub-folha="${chave}" aria-selected="${folha.sub === chave}">${rotulo}</button>
      `).join("")}
    </div>
    <div id="folhaConteudo"></div>`;

  alvo.querySelectorAll("[data-sub-folha]").forEach((b) =>
    b.addEventListener("click", () => {
      folha.sub = b.dataset.subFolha;
      pintarFolha();
    }));

  const conteudo = el("folhaConteudo");
  if (folha.sub === "colaboradores") conteudo.innerHTML = folhaColaboradoresHTML();
  else if (folha.sub === "grade") conteudo.innerHTML = folhaGradeHTML();
  else if (folha.sub === "valores") conteudo.innerHTML = folhaValoresHTML();
  else if (folha.sub === "lancamentos") conteudo.innerHTML = folhaLancamentosHTML();
  else if (folha.sub === "extrato") conteudo.innerHTML = folhaExtratoHTML();
  else if (folha.sub === "compilado") conteudo.innerHTML = folhaCompiladoHTML();
  else if (folha.sub === "folhapagamento") conteudo.innerHTML = folhaPagamentoHTML();
  else conteudo.innerHTML = folhaControleInternoHTML();

  if (folha.sub === "colaboradores") ligarFolhaColaboradores();
  else if (folha.sub === "grade") ligarFolhaGrade();
  else if (folha.sub === "valores") ligarFolhaValores();
  else if (folha.sub === "lancamentos") ligarFolhaLancamentos();
  else if (folha.sub === "extrato") ligarFolhaExtrato();
  else if (folha.sub === "compilado") ligarFolhaCompilado();
  else if (folha.sub === "folhapagamento") ligarFolhaPagamento();
  else ligarFolhaControleInterno();
}

// ------------------------------------------------------------ colaboradores
//
// A identidade da pessoa (nome, e-mail, documentos, ativo/desligado) é o
// `Professor` — "Pessoa nova" cria os dois (cadastro + perfil de folha) num
// só passo; "Já está no Hub" só aponta pra quem o Administrativo já cadastrou.
/** Quem faz aniversário neste mês, do dia mais próximo pro mais distante. */
function aniversariantesDoMes() {
  const hoje = new Date();
  const diaHoje = hoje.getDate();
  const mesHoje = hoje.getMonth() + 1;
  return folha.colaboradores
    .filter((c) => c.professor.ativo && c.professor.dataNascimento)
    .map((c) => {
      const [, mes, dia] = c.professor.dataNascimento.slice(0, 10).split("-").map(Number);
      return { nome: c.professor.nome, mes, dia };
    })
    .filter((a) => a.mes === mesHoje)
    .sort((a, b) => a.dia - b.dia)
    .map((a) => ({ ...a, hoje: a.dia === diaHoje }));
}

function ligarFolhaColaboradores() {
  const secao = el("secFolha");

  secao.querySelectorAll("[data-modo-colab]").forEach((b) =>
    b.addEventListener("click", () => {
      folha.modoNovoColaborador = b.dataset.modoColab === "novo";
      folha.erroColaborador = "";
      pintarFolha();
    }));

  el("cf_professor")?.addEventListener("change", (e) => {
    folha.rascunhoColaborador.professorId = e.target.value;
    // Prefixa os documentos se a pessoa escolhida já tiver algum salvo — não
    // sobrescreve o que já estiver digitado.
    const p = folha.disponiveis.find((x) => x.id === e.target.value);
    if (p) {
      folha.rascunhoColaborador.cpf ||= p.cpf || "";
      folha.rascunhoColaborador.rg ||= p.rg || "";
      folha.rascunhoColaborador.dataNascimento ||= p.dataNascimento ? String(p.dataNascimento).slice(0, 10) : "";
      pintarFolha();
    }
  });
  el("cf_nome")?.addEventListener("input", (e) => { folha.rascunhoColaborador.nome = e.target.value; });
  el("cf_email")?.addEventListener("input", (e) => { folha.rascunhoColaborador.email = e.target.value; });
  el("cf_telefone")?.addEventListener("input", (e) => { folha.rascunhoColaborador.telefone = e.target.value; });
  el("cf_cpf")?.addEventListener("input", (e) => { folha.rascunhoColaborador.cpf = e.target.value; });
  el("cf_rg")?.addEventListener("input", (e) => { folha.rascunhoColaborador.rg = e.target.value; });
  el("cf_nascimento")?.addEventListener("change", (e) => { folha.rascunhoColaborador.dataNascimento = e.target.value; });
  el("cf_tipo")?.addEventListener("change", (e) => { folha.rascunhoColaborador.tipo = e.target.value; });
  el("cf_nivel")?.addEventListener("change", (e) => { folha.rascunhoColaborador.nivel = e.target.value; });
  el("cf_categoria")?.addEventListener("change", (e) => { folha.rascunhoColaborador.categoriaFolha = e.target.value; });
  el("cf_cref")?.addEventListener("input", (e) => { folha.rascunhoColaborador.cref = e.target.value; });
  el("cf_pix")?.addEventListener("input", (e) => { folha.rascunhoColaborador.chavePix = e.target.value; });
  el("cf_convidar")?.addEventListener("change", (e) => {
    folha.rascunhoColaborador.convidar = e.target.checked;
    pintarFolha();
  });
  el("cf_perfilAcesso")?.addEventListener("change", (e) => { folha.rascunhoColaborador.perfilAcesso = e.target.value; });
  el("cf_validade")?.addEventListener("change", (e) => { folha.rascunhoColaborador.validade = e.target.value; });

  el("btnFecharConvite")?.addEventListener("click", () => {
    folha.conviteRecente = null;
    pintarFolha();
  });

  el("btnCancelarColab")?.addEventListener("click", () => {
    folha.editandoColaborador = null;
    folha.erroColaborador = "";
    folha.rascunhoColaborador = RASCUNHO_COLAB_VAZIO();
    pintarFolha();
  });

  el("btnSalvarColab")?.addEventListener("click", async () => {
    const r = folha.rascunhoColaborador;
    const novo = !folha.editandoColaborador && folha.modoNovoColaborador;
    const existente = !folha.editandoColaborador && !folha.modoNovoColaborador;

    if (novo && !r.nome.trim()) {
      folha.erroColaborador = "Digite o nome."; pintarFolha(); return;
    }
    if (existente && !r.professorId) {
      folha.erroColaborador = "Escolha o colaborador."; pintarFolha(); return;
    }
    const convidando = novo && r.convidar;
    if (convidando && !r.email.trim()) {
      folha.erroColaborador = "Pra convidar, preencha o e-mail — é com ele que a pessoa entra.";
      pintarFolha();
      return;
    }

    const botao = el("btnSalvarColab");
    botao.disabled = true;

    try {
      // Pessoa nova: cria o cadastro em Administrativo primeiro (mesma rota
      // que a tela de lá usa) e só depois o perfil de folha, com o id que
      // acabou de nascer — as duas gravações, um clique só.
      let professorId = r.professorId;
      if (novo) {
        const professor = await api("/escola/professores", {
          method: "POST",
          body: JSON.stringify({
            nome: r.nome.trim(), email: r.email.trim(), telefone: r.telefone.trim(), ativo: true,
            cpf: r.cpf.trim(), rg: r.rg.trim(), dataNascimento: r.dataNascimento,
          }),
        });
        professorId = professor.id;
      } else {
        // Existente ou editando: a pessoa já existe em Administrativo — só
        // atualiza os documentos por cima do que já está lá, preservando
        // nome/e-mail/telefone/ativo (esta tela não mexe nisso).
        const identidadeAtual = folha.editandoColaborador
          ? folha.colaboradores.find((c) => c.id === folha.editandoColaborador)?.professor
          : folha.disponiveis.find((p) => p.id === professorId);
        if (identidadeAtual) {
          await api(`/escola/professores/${professorId}`, {
            method: "PUT",
            body: JSON.stringify({
              nome: identidadeAtual.nome, email: identidadeAtual.email || "", telefone: identidadeAtual.telefone || "",
              ativo: identidadeAtual.ativo, cpf: r.cpf.trim(), rg: r.rg.trim(), dataNascimento: r.dataNascimento,
            }),
          });
        }
      }

      const corpo = {
        tipo: r.tipo, nivel: Number(r.nivel), categoriaFolha: r.categoriaFolha || "",
        cref: r.cref.trim(), chavePix: r.chavePix.trim(),
      };
      if (folha.editandoColaborador) {
        await api(`/folha/colaboradores/${folha.editandoColaborador}`, { method: "PUT", body: JSON.stringify(corpo) });
      } else {
        await api("/folha/colaboradores", { method: "POST", body: JSON.stringify({ ...corpo, professorId }) });
      }

      // Convite: mesma rota que Administrativo → Colaboradores usa. Papel
      // PROFESSOR carrega o professorId (é o que liga a conta à turma dele
      // no portal); os outros papéis não precisam disso.
      if (convidando) {
        const email = r.email.trim().toLowerCase();
        const convite = await api("/auth/convites", {
          method: "POST",
          body: JSON.stringify({
            email,
            papel: r.perfilAcesso,
            professorId: r.perfilAcesso === "PROFESSOR" ? professorId : undefined,
            validadeDias: Number(r.validade),
          }),
        });
        folha.conviteRecente = {
          texto: `Convite criado para ${r.nome.trim()}.`,
          link: linkWhatsapp(convite, r.telefone.trim()),
        };
      } else {
        folha.conviteRecente = null;
      }

      folha.editandoColaborador = null;
      folha.erroColaborador = "";
      folha.rascunhoColaborador = RASCUNHO_COLAB_VAZIO();
      await carregarFolha();
    } catch (e) {
      folha.erroColaborador = e.message;
      botao.disabled = false;
      pintarFolha();
    }
  });

  secao.querySelectorAll("[data-editar-colab]").forEach((b) =>
    b.addEventListener("click", () => {
      const c = folha.colaboradores.find((x) => x.id === b.dataset.editarColab);
      if (!c) return;
      folha.editandoColaborador = c.id;
      folha.erroColaborador = "";
      folha.rascunhoColaborador = {
        ...RASCUNHO_COLAB_VAZIO(),
        professorId: c.professorId, tipo: c.tipo, nivel: String(c.nivel), categoriaFolha: c.categoriaFolha || "",
        cpf: c.professor.cpf || "", rg: c.professor.rg || "",
        dataNascimento: c.professor.dataNascimento ? String(c.professor.dataNascimento).slice(0, 10) : "",
        cref: c.cref || "", chavePix: c.chavePix || "",
      };
      pintarFolha();
      el("cf_tipo")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }));

  secao.querySelectorAll("[data-demitir-colab]").forEach((b) =>
    b.addEventListener("click", async () => {
      const c = folha.colaboradores.find((x) => x.id === b.dataset.demitirColab);
      const hoje = new Date().toISOString().slice(0, 10);
      const data = prompt(`Data de desligamento de ${c.professor.nome} (AAAA-MM-DD) — mesmo campo de Administrativo → Colaboradores:`, hoje);
      if (!data) return;
      try {
        await api(`/folha/colaboradores/${c.id}/demitir`, { method: "POST", body: JSON.stringify({ dataDesligamento: data }) });
        await carregarFolha();

function ligarFolhaGrade() {
  const secao = el("secFolha");
  const campos = ["colab", "unidade", "turma", "codigo", "horario", "duracao", "tipo", "nivel", "inicio", "fim"];
  const chave = { colab: "colaboradorId", unidade: "unidadeId", duracao: "duracaoHoras", inicio: "dataInicio", fim: "dataFim" };
  campos.forEach((c) => {
    const input = el(`gf_${c}`);
    input?.addEventListener(input.tagName === "SELECT" || input.type === "date" ? "change" : "input", (e) => {
      folha.rascunhoGrade[chave[c] || c] = e.target.value;
    });
  });
  el("gf_semvt").addEventListener("change", (e) => { folha.rascunhoGrade.semVt = e.target.checked; });

  el("btnCancelarGrade")?.addEventListener("click", () => {
    folha.editandoGrade = null;
    folha.erroGrade = "";
    folha.rascunhoGrade = RASCUNHO_GRADE_VAZIO();
    pintarFolha();
  });

  el("btnSalvarGrade").addEventListener("click", async () => {
    const r = folha.rascunhoGrade;
    if (!r.colaboradorId) { folha.erroGrade = "Escolha o colaborador."; pintarFolha(); return; }
    if (!r.unidadeId) { folha.erroGrade = "Escolha a unidade."; pintarFolha(); return; }
    if (!r.turma.trim()) { folha.erroGrade = "Escreva o nome da turma."; pintarFolha(); return; }
    const corpo = {
      unidadeId: r.unidadeId, turma: r.turma.trim(), codigo: r.codigo, horario: r.horario.trim(),
      duracaoHoras: Number(r.duracaoHoras) || 0, tipo: r.tipo, nivel: Number(r.nivel), semVt: r.semVt,
      dataInicio: r.dataInicio, dataFim: r.dataFim,
    };
    try {
      if (folha.editandoGrade) {
        await api(`/folha/grade/${folha.editandoGrade}`, { method: "PUT", body: JSON.stringify(corpo) });
      } else {
        await api(`/folha/grade/${r.colaboradorId}`, { method: "POST", body: JSON.stringify(corpo) });
      }
      folha.editandoGrade = null;
      folha.erroGrade = "";
      folha.rascunhoGrade = RASCUNHO_GRADE_VAZIO();
      await carregarFolha();
    } catch (e) {
      folha.erroGrade = e.message;
      pintarFolha();
    }
  });

  secao.querySelectorAll("[data-editar-grade]").forEach((b) =>
    b.addEventListener("click", () => {
      const g = folha.grade.find((x) => x.id === b.dataset.editarGrade);
      if (!g) return;
      folha.editandoGrade = g.id;
      folha.erroGrade = "";
      folha.rascunhoGrade = {
        colaboradorId: g.colaboradorId, unidadeId: g.unidadeId, turma: g.turma, codigo: g.codigo,
        horario: g.horario || "", duracaoHoras: String(g.duracaoHoras), tipo: g.tipo, nivel: String(g.nivel),
        semVt: g.semVt, dataInicio: g.dataInicio ? String(g.dataInicio).slice(0, 10) : "",
        dataFim: g.dataFim ? String(g.dataFim).slice(0, 10) : "",
      };
      pintarFolha();
      el("gf_colab")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }));

  secao.querySelectorAll("[data-apagar-grade]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm("Apagar este horário da grade?")) return;
      try {
        await api(`/folha/grade/${b.dataset.apagarGrade}`, { method: "DELETE" });
        await carregarFolha();
      } catch (e) { alert(e.message); }
    }));
}

function ligarFolhaValores() {
  const secao = el("secFolha");
  const salvar = async (tipo, nivel) => {
    const inputHora = secao.querySelector(`[data-valor-hora="${tipo}-${nivel}"]`);
    const inputVt = secao.querySelector(`[data-valor-vt="${tipo}-${nivel}"]`);
    try {
      await api("/folha/valores", {
        method: "PUT",
        body: JSON.stringify({
          tipo, nivel, valorHora: Number(inputHora.value) || 0, valorVt: Number(inputVt.value) || 0,
        }),
      });
      const i = folha.valores.findIndex((v) => v.tipo === tipo && v.nivel === nivel);
      const novo = { tipo, nivel, valorHora: Number(inputHora.value) || 0, valorVt: Number(inputVt.value) || 0 };
      if (i >= 0) folha.valores[i] = novo; else folha.valores.push(novo);
    } catch (e) { alert(e.message); }
  };
  secao.querySelectorAll("[data-valor-hora], [data-valor-vt]").forEach((input) => {
    input.addEventListener("change", () => {
      const [tipo, nivel] = (input.dataset.valorHora || input.dataset.valorVt).split("-");
      salvar(tipo, Number(nivel));
    });
  });
}

/**
 * Bônus por turma cheia (80%+ de ocupação) — ao vivo.
 *
 * O sistema original comparava contra um snapshot colado toda semana à mão;
 * aqui a ocupação vem da matrícula de verdade (mesma conta de /socios/turmas
 * que alimenta o Painel), e quem dá a turma já está ligado a ela (Turmas →
 * Professores), então não tem professor pra escolher — só pra conferir e
 * desmarcar quem não deve levar bônus daquela vez.
 */
function paresBonusTurmas() {
  const pares = [];
  for (const t of folha.turmasCheias) {
    for (const p of t.professores) {
      const colaborador = folha.colaboradores.find((c) => c.professorId === p.id);
      pares.push({
        chave: `${t.turmaId}|${p.id}`, turmaId: t.turmaId, turma: t.turma, unidade: t.unidade,
        ocupacao: t.ocupacao, professorId: p.id, nome: p.nome, colaboradorId: colaborador?.id || null,
      });
    }
  }
  return pares;
}

function folhaBonusTurmasHTML() {
  const pares = paresBonusTurmas();
  return `
    <div class="cartao" style="margin-top:14px">
      <div class="linha" style="margin-bottom:10px"><strong>Bônus por turma cheia (80%+ de ocupação)</strong></div>
      <p class="meta" style="margin-bottom:10px">
        Ocupação ao vivo da matrícula (mesma conta do Painel → Turmas), não uma lista colada. R$ 25,00 por professor,
        um lançamento por linha marcada.
      </p>
      ${pares.length ? `
        <div class="campo" style="max-width:200px;margin-bottom:10px"><label class="rotulo" for="bt_data">Data do lançamento</label>
          <input id="bt_data" type="date" value="${escapar(folha.bonusTurmasData)}"></div>
        <table class="tabelinha">
          <tr><th></th><th>Unidade</th><th>Turma</th><th class="num">% Ocup.</th><th>Professor</th></tr>
          ${pares.map((p) => {
            const marcado = folha.bonusTurmasMarcados[p.chave] ?? !!p.colaboradorId;
            return `
            <tr ${p.colaboradorId ? "" : 'style="opacity:.55"'}>
              <td><input type="checkbox" data-bonus-turma="${p.chave}" ${marcado ? "checked" : ""} ${p.colaboradorId ? "" : "disabled"}></td>
              <td>${escapar(p.unidade)}</td>
              <td>${escapar(p.turma)}</td>
              <td class="num">${p.ocupacao}%</td>
              <td>${escapar(p.nome)}${p.colaboradorId ? "" : " (sem perfil de folha)"}</td>
            </tr>`;
          }).join("")}
        </table>
        <button class="botao" type="button" id="btnGerarBonusTurmas" style="margin-top:10px">Gerar lançamentos de bônus</button>
        ${folha.bonusTurmasResultado ? `<div class="aviso info" style="margin-top:10px">${folha.bonusTurmasResultado} lançamento(s) de bônus criado(s).</div>` : ""}
      ` : `<div class="vazio">Nenhuma turma com 80% ou mais de ocupação agora.</div>`}
    </div>`;
}

function ligarFolhaBonusTurmas() {
  const secao = el("secFolha");
  el("bt_data")?.addEventListener("change", (e) => { folha.bonusTurmasData = e.target.value; });

}

function ligarFolhaLancamentos() {
  const secao = el("secFolha");
  const r = folha.rascunhoLancamento;

  ligarFolhaBonusTurmas();

  const campos = ["colab", "data", "tipo", "nivel", "horas", "motivo"];
  const chave = { colab: "colaboradorId" };
  campos.forEach((c) => {
    const input = el(`lf_${c}`);
    input?.addEventListener(input.tagName === "SELECT" || input.type === "date" ? "change" : "input", (e) => {
      folha.rascunhoLancamento[chave[c] || c] = e.target.value;
    });
  });
  el("lf_vt")?.addEventListener("change", (e) => { r.usaVt = e.target.value === "sim"; });

  el("btnSalvarLancamento")?.addEventListener("click", async () => {
    if (!r.colaboradorId) { folha.erroLancamento = "Escolha o colaborador."; pintarFolha(); return; }
    if (!r.data) { folha.erroLancamento = "Escolha a data."; pintarFolha(); return; }
    try {
      await api("/folha/lancamentos", {
        method: "POST",
        body: JSON.stringify({
          colaboradorId: r.colaboradorId, data: r.data, tipo: r.tipo, nivel: Number(r.nivel),
          horas: Number(r.horas) || 0, usaVt: r.usaVt, motivo: r.motivo.trim() || undefined,
        }),
      });
      folha.erroLancamento = "";
      folha.rascunhoLancamento = RASCUNHO_LANCAMENTO_VAZIO();
      await carregarFolha();
    } catch (e) {
      folha.erroLancamento = e.message;
      pintarFolha();
    }
  });

  secao.querySelectorAll("[data-apagar-lancamento]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm("Apagar este lançamento?")) return;
      try {
        await api(`/folha/lancamentos/${b.dataset.apagarLancamento}`, { method: "DELETE" });
        await carregarFolha();
      } catch (e) { alert(e.message); }
    }));

  el("lf_lote")?.addEventListener("input", (e) => { folha.loteTexto = e.target.value; });
  el("btnImportarLote")?.addEventListener("click", async () => {
    if (!folha.loteTexto.trim()) return;
    try {
      const resultado = await api("/folha/lancamentos/lote", {
        method: "POST", body: JSON.stringify({ texto: folha.loteTexto }),
      });
      folha.loteResultado = resultado;
      if (!resultado.erros.length) folha.loteTexto = "";
      await carregarFolha();
    } catch (e) { alert(e.message); }
  });

  const rr = folha.rascunhoRecorrente;
  const camposR = ["colab", "tipo", "nivel", "horas", "motivo", "de", "ate"];
  const chaveR = { colab: "colaboradorId" };
  camposR.forEach((c) => {
    const input = el(`lr_${c}`);
    input?.addEventListener(input.tagName === "SELECT" || input.type === "date" ? "change" : "input", (e) => {
      folha.rascunhoRecorrente[chaveR[c] || c] = e.target.value;
    });
  });
  el("lr_vt")?.addEventListener("change", (e) => { rr.usaVt = e.target.value === "sim"; });
  secao.querySelectorAll("[data-dia-semana]").forEach((cb) =>
    cb.addEventListener("change", (e) => {
      const dia = Number(e.target.dataset.diaSemana);
      if (e.target.checked) { if (!rr.diasSemana.includes(dia)) rr.diasSemana.push(dia); }
      else rr.diasSemana = rr.diasSemana.filter((d) => d !== dia);
    }));

  el("btnGerarRecorrente")?.addEventListener("click", async () => {
    if (!rr.colaboradorId) { folha.erroRecorrente = "Escolha o colaborador."; pintarFolha(); return; }
    if (!rr.de || !rr.ate) { folha.erroRecorrente = "Escolha o período (De/Até)."; pintarFolha(); return; }
    if (!rr.diasSemana.length) { folha.erroRecorrente = "Marque pelo menos um dia da semana."; pintarFolha(); return; }
    try {
      const resultado = await api("/folha/lancamentos/recorrente", {
        method: "POST",
        body: JSON.stringify({
          colaboradorId: rr.colaboradorId, tipo: rr.tipo, nivel: Number(rr.nivel), horas: Number(rr.horas) || 0,
          usaVt: rr.usaVt, motivo: rr.motivo.trim() || undefined, de: rr.de, ate: rr.ate, diasSemana: rr.diasSemana,
        }),
      });
      folha.erroRecorrente = "";
      folha.recorrenteResultado = resultado;
      folha.rascunhoRecorrente = RASCUNHO_RECORRENTE_VAZIO();
      await carregarFolha();
    } catch (e) {
      folha.erroRecorrente = e.message;
      pintarFolha();
    }
  });
}

// ---------------------------------------------------------- folha de pagamento
//
// Diferente do Extrato/Compilado (Fase 2), a conta aqui é feita no servidor
// (ver folhaColabCalc em folha.routes.ts): dias trabalhados vindo da Grade
// Horária dia a dia, feriado por unidade, férias e VT antecipado no mês
// seguinte são regra de negócio grande demais pra confiar só no navegador.
function celulaOverride(mes, colaboradorId, campo, valorEfetivo, valorCalculado, sobrescrito, opts) {
  opts = opts || {};
  const step = opts.step || "0.01";
  const decimals = opts.decimals != null ? opts.decimals : 2;
  const largura = opts.width || "96px";
  const chave = `${mes}|${colaboradorId}|${campo}`;
  const resetBtn = sobrescrito
    ? `<button type="button" class="botao fantasma no-imprimir" data-reset-override="${chave}" title="Restaurar cálculo automático (${Number(valorCalculado).toFixed(decimals)})" style="padding:2px 6px">↺</button>`
    : "";
  return `<span style="display:inline-flex;align-items:center;gap:4px;justify-content:flex-end">
    <input type="number" step="${step}" value="${Number(valorEfetivo).toFixed(decimals)}" data-override="${chave}"
      style="width:${largura};text-align:right;padding:4px 6px;border-radius:6px;border:1px solid ${sobrescrito ? "#f0c56b" : "#c9d2da"};background:${sobrescrito ? "#fff8e6" : "#fff"}">
    ${resetBtn}
  </span>`;
}

function renderRelatorioFolha(dados) {
  const mes = dados.mes;
  let somaBolsa = 0, somaComplementarE = 0, somaVtE = 0;
  const linhasE = dados.estagiarios.map((c) => {
    if (!c.temGrade) {
      return `<tr><td>${escapar(c.nome)}</td><td class="num" colspan="3" style="color:var(--erro)">sem grade horária cadastrada</td></tr>`;
    }
    somaBolsa += c.bolsa; somaComplementarE += c.complementar; somaVtE += c.vt;
    return `<tr>
      <td>${escapar(c.nome)}</td>
      <td class="num">${celulaOverride(mes, c.colaboradorId, "bolsa", c.bolsa, c.bolsaCalculada, c.bolsaSobrescrita, { step: "0.01", width: "112px" })}</td>
      <td class="num">${celulaOverride(mes, c.colaboradorId, "complementar", c.complementar, c.complementarCalculada, c.complementarSobrescrita, { step: "0.01", width: "112px" })}</td>
      <td class="num">${celulaOverride(mes, c.colaboradorId, "vt", c.vt, c.vtCalculado, c.vtSobrescrito, { step: "1", decimals: 0, width: "64px" })}</td>
    </tr>`;
  }).join("");

  let somaHn1 = 0, somaHn2 = 0, somaDias = 0, somaVtP = 0, somaDiariaP = 0;
  const linhasP = dados.professores.map((c) => {
    if (!c.temGrade) {
      return `<tr><td>${escapar(c.nome)}</td><td class="num" colspan="5" style="color:var(--erro)">sem grade horária cadastrada</td></tr>`;
    }
    somaHn1 += c.hn1; somaHn2 += c.hn2; somaDias += c.dias; somaVtP += c.vt; somaDiariaP += c.diariaBonus;
    return `<tr>
      <td>${escapar(c.nome)}</td>
      <td class="num">${celulaOverride(mes, c.colaboradorId, "hn1", c.hn1, c.hn1Calculado, c.hn1Sobrescrito, { step: "0.5", decimals: 1, width: "72px" })}</td>
      <td class="num">${celulaOverride(mes, c.colaboradorId, "hn2", c.hn2, c.hn2Calculado, c.hn2Sobrescrito, { step: "0.5", decimals: 1, width: "72px" })}</td>
      <td class="num">${celulaOverride(mes, c.colaboradorId, "dias", c.dias, c.diasCalculado, c.diasSobrescrito, { step: "1", decimals: 0, width: "64px" })}</td>
      <td class="num">${celulaOverride(mes, c.colaboradorId, "vt", c.vt, c.vtCalculado, c.vtSobrescrito, { step: "1", decimals: 0, width: "64px" })}</td>
      <td class="num">${celulaOverride(mes, c.colaboradorId, "diariaBonus", c.diariaBonus, c.diariaBonusCalculado, c.diariaBonusSobrescrito, { step: "0.01", width: "112px" })}</td>
    </tr>`;
  }).join("");

  const vh1 = dados.valorHoraNivel1 != null ? `R$${Number(dados.valorHoraNivel1).toFixed(2).replace(".", ",")} h/a` : "Hrs Nível 1";
  const vh2 = dados.valorHoraNivel2 != null ? `R$${Number(dados.valorHoraNivel2).toFixed(2).replace(".", ",")} h/a` : "Hrs Nível 2";
  const rotuloProx = rotuloMes(dados.proxMes);

  return `
    <div class="cartao">
      <div class="linha" style="margin-bottom:6px"><strong>Estagiários</strong></div>
      <p class="meta" style="margin-bottom:10px">
        Valor da Bolsa já desconta faltas sem atestado e desconto de VT antecipado. Diárias/Bônus são extras e bônus do mês
        (não é salário). VT em dias, referência ${rotuloProx}.
      </p>
      ${dados.estagiarios.length ? `
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Colaborador</th><th class="num">Valor da Bolsa</th><th class="num">Diárias/Bônus</th><th class="num">VT ${rotuloProx} (dias)</th></tr>
            ${linhasE}
            <tr class="footrow" style="font-weight:600">
              <td>SOMATÓRIO</td><td class="num">${fmt.moeda(somaBolsa)}</td><td class="num">${fmt.moeda(somaComplementarE)}</td><td class="num">${somaVtE}</td>
            </tr>
          </table>
        </div>` : `<div class="vazio">Nenhum estagiário cadastrado.</div>`}
    </div>

    <div class="cartao" style="margin-top:14px">
      <div class="linha" style="margin-bottom:6px"><strong>Professores</strong></div>
      <p class="meta" style="margin-bottom:10px">
        Horas por nível já descontam faltas sem atestado (a contabilidade calcula o salário a partir delas). Diárias/Bônus
        não é salário. VT em dias, referência ${rotuloProx}.
      </p>
      ${dados.professores.length ? `
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Colaborador</th><th class="num">${vh1}</th><th class="num">${vh2}</th><th class="num">Dias Trabalhados</th>
              <th class="num">VT ${rotuloProx} (dias)</th><th class="num">Diárias/Bônus</th></tr>
            ${linhasP}
            <tr class="footrow" style="font-weight:600">
              <td>SOMATÓRIO</td><td class="num">${somaHn1}h</td><td class="num">${somaHn2}h</td>
              <td class="num">${somaDias}</td><td class="num">${somaVtP}</td><td class="num">${fmt.moeda(somaDiariaP)}</td>
            </tr>
          </table>
        </div>` : `<div class="vazio">Nenhum professor cadastrado.</div>`}
    </div>`;
}

function folhaPagamentoHTML() {
  const mes = folha.fpMes;
  const dados = folha.fpDados;
  const rf = folha.rascunhoFeriado;
  const rv = folha.rascunhoFerias;
  const colaboradoresAtivos = folha.colaboradores.filter((c) => c.professor.ativo)
    .sort((a, b) => a.professor.nome.localeCompare(b.professor.nome, "pt-BR"));

  return `
    <div class="cartao no-imprimir">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="campo" style="flex:0 0 180px"><label class="rotulo" for="fp_mes">Mês de referência</label>
          <select id="fp_mes">
            ${mesesParaSeletor().map((m) => `<option value="${m}" ${mes === m ? "selected" : ""}>${rotuloMes(m)}</option>`).join("")}
          </select></div>
        <button class="botao fantasma" type="button" id="btnImprimirFolha">Imprimir</button>
      </div>
      <p class="meta" style="margin-top:10px">
        Horas normais vêm da Grade Horária (conta sozinho quantas segundas/terças/etc. caem no mês). Falta com atestado não
        desconta; sem atestado desconta a turma/nível daquele dia. O VT é antecipado: pago junto com o salário deste mês, mas
        contado na grade do <strong>mês seguinte</strong> (já descontando feriados/férias marcados pra lá). Todo número das
        tabelas abaixo é editável — clique e digite pra corrigir; o ↺ ao lado restaura o cálculo automático.
      </p>
    </div>

    <details class="cartao no-imprimir">
      <summary style="cursor:pointer;font-weight:600">Feriados (${folha.feriados.length})</summary>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <div class="campo" style="flex:0 0 150px"><label class="rotulo" for="fr_data">Data</label>
          <input id="fr_data" type="date" value="${escapar(rf.data)}"></div>
        <div class="campo" style="flex:1;min-width:160px"><label class="rotulo" for="fr_unidade">Unidade</label>
          <select id="fr_unidade">
            <option value="">Todas</option>
            ${folha.unidades.map((u) => `<option value="${u.id}" ${rf.unidadeId === u.id ? "selected" : ""}>${escapar(u.nome)}</option>`).join("")}
          </select></div>
        <div class="campo" style="flex:2;min-width:200px"><label class="rotulo" for="fr_desc">Descrição</label>
          <input id="fr_desc" value="${escapar(rf.descricao)}" placeholder="ex.: Feriado municipal de João Pessoa"></div>
        <div class="campo" style="flex:0 0 160px"><label class="rotulo" for="fr_conta">Conta como trabalhado?</label>
          <select id="fr_conta">
            <option value="nao" ${!rf.contaTrabalhado ? "selected" : ""}>Não</option>
            <option value="sim" ${rf.contaTrabalhado ? "selected" : ""}>Sim</option>
          </select></div>
        <div style="flex:0 0 auto;align-self:flex-end"><button class="botao" type="button" id="btnAddFeriado">+ Salvar</button></div>
      </div>
      <div class="aviso erro ${folha.erroFeriado ? "" : "oculto"}" style="margin-top:10px">${escapar(folha.erroFeriado)}</div>
      ${folha.feriados.length ? `
        <table class="tabelinha" style="margin-top:12px">
          <tr><th>Data</th><th>Unidade</th><th>Descrição</th><th>Conta trabalhado?</th><th></th></tr>
          ${folha.feriados.map((f) => `
            <tr>
              <td>${fmt.data(f.data)}</td>
              <td>${f.unidade?.nome || "Todas"}</td>
              <td>${escapar(f.descricao || "—")}</td>
              <td>${f.contaTrabalhado ? "Sim" : "Não"}</td>
              <td class="num"><button class="botao fantasma" type="button" data-apagar-feriado="${f.id}">Apagar</button></td>
            </tr>`).join("")}
        </table>` : `<div class="vazio" style="margin-top:10px">Nenhum feriado cadastrado.</div>`}
    </details>

    <details class="cartao no-imprimir">
      <summary style="cursor:pointer;font-weight:600">Férias (${folha.ferias.length})</summary>
      <p class="meta" style="margin-top:10px">Enquanto o colaborador está de férias, os dias da grade dele nesse período não contam como trabalhados nem geram desconto.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
        <div class="campo" style="flex:1;min-width:180px"><label class="rotulo" for="fe_colab">Colaborador</label>
          <select id="fe_colab">
            <option value="">Escolha…</option>
            ${colaboradoresAtivos.map((c) => `<option value="${c.id}" ${rv.colaboradorId === c.id ? "selected" : ""}>${escapar(c.professor.nome)}</option>`).join("")}
          </select></div>
        <div class="campo" style="flex:0 0 160px"><label class="rotulo" for="fe_inicio">Início</label>
          <input id="fe_inicio" type="date" value="${escapar(rv.dataInicio)}"></div>
        <div class="campo" style="flex:0 0 160px"><label class="rotulo" for="fe_fim">Fim</label>
          <input id="fe_fim" type="date" value="${escapar(rv.dataFim)}"></div>
        <div class="campo" style="flex:1;min-width:180px"><label class="rotulo" for="fe_obs">Observação</label>
          <input id="fe_obs" value="${escapar(rv.observacao)}" placeholder="ex.: 10 dias, seg a sex"></div>
        <div style="flex:0 0 auto;align-self:flex-end"><button class="botao" type="button" id="btnAddFerias">+ Salvar</button></div>
      </div>
      <div class="aviso erro ${folha.erroFerias ? "" : "oculto"}" style="margin-top:10px">${escapar(folha.erroFerias)}</div>
      ${folha.ferias.length ? `
        <table class="tabelinha" style="margin-top:12px">
          <tr><th>Colaborador</th><th>Início</th><th>Fim</th><th>Observação</th><th></th></tr>
          ${folha.ferias.map((f) => `
            <tr>
              <td>${escapar(nomeColaborador(f.colaboradorId))}</td>
              <td>${fmt.data(f.dataInicio)}</td>
              <td>${fmt.data(f.dataFim)}</td>
              <td>${escapar(f.observacao || "—")}</td>
              <td class="num"><button class="botao fantasma" type="button" data-apagar-ferias="${f.id}">Apagar</button></td>
            </tr>`).join("")}
        </table>` : `<div class="vazio" style="margin-top:10px">Nenhuma férias cadastrada.</div>`}
    </details>

    ${!dados ? `<div class="carregando">Carregando…</div>` : dados.erro ? aviso({ message: dados.erro }) : renderRelatorioFolha(dados)}`;
}

function ligarFolhaPagamento() {
  const secao = el("secFolha");

  el("fp_mes")?.addEventListener("change", (e) => {
    folha.fpMes = e.target.value;
    folha.fpDados = null;
    pintarFolha();
    carregarFolhaPagamento();
  });
  el("btnImprimirFolha")?.addEventListener("click", () => window.print());

  const rf = folha.rascunhoFeriado;
  el("fr_data")?.addEventListener("change", (e) => { rf.data = e.target.value; });
  el("fr_unidade")?.addEventListener("change", (e) => { rf.unidadeId = e.target.value; });
  el("fr_desc")?.addEventListener("input", (e) => { rf.descricao = e.target.value; });
  el("fr_conta")?.addEventListener("change", (e) => { rf.contaTrabalhado = e.target.value === "sim"; });
  el("btnAddFeriado")?.addEventListener("click", async () => {
    if (!rf.data) { folha.erroFeriado = "Escolha a data."; pintarFolha(); return; }
    try {
      await api("/folha/feriados", {
        method: "POST",
        body: JSON.stringify({
          data: rf.data, unidadeId: rf.unidadeId || undefined,
          descricao: rf.descricao.trim() || undefined, contaTrabalhado: rf.contaTrabalhado,
        }),
      });
      folha.erroFeriado = "";
      folha.rascunhoFeriado = RASCUNHO_FERIADO_VAZIO();
      await carregarFolha();
    } catch (e) { folha.erroFeriado = e.message; pintarFolha(); }
  });
  secao.querySelectorAll("[data-apagar-feriado]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm("Apagar este feriado?")) return;
      try {
        await api(`/folha/feriados/${b.dataset.apagarFeriado}`, { method: "DELETE" });
        await carregarFolha();
      } catch (e) { alert(e.message); }
    }));

  const rv = folha.rascunhoFerias;
  el("fe_colab")?.addEventListener("change", (e) => { rv.colaboradorId = e.target.value; });
  el("fe_inicio")?.addEventListener("change", (e) => { rv.dataInicio = e.target.value; });
  el("fe_fim")?.addEventListener("change", (e) => { rv.dataFim = e.target.value; });
  el("fe_obs")?.addEventListener("input", (e) => { rv.observacao = e.target.value; });
  el("btnAddFerias")?.addEventListener("click", async () => {
    if (!rv.colaboradorId) { folha.erroFerias = "Escolha o colaborador."; pintarFolha(); return; }
    if (!rv.dataInicio || !rv.dataFim) { folha.erroFerias = "Preencha início e fim."; pintarFolha(); return; }
    try {
      await api("/folha/ferias", {
        method: "POST",
        body: JSON.stringify({
          colaboradorId: rv.colaboradorId, dataInicio: rv.dataInicio, dataFim: rv.dataFim,
          observacao: rv.observacao.trim() || undefined,
        }),
      });
      folha.erroFerias = "";
      folha.rascunhoFerias = RASCUNHO_FERIAS_VAZIO();
      await carregarFolha();
    } catch (e) { folha.erroFerias = e.message; pintarFolha(); }
  });
  secao.querySelectorAll("[data-apagar-ferias]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm("Apagar estas férias?")) return;
      try {
        await api(`/folha/ferias/${b.dataset.apagarFerias}`, { method: "DELETE" });
        await carregarFolha();
      } catch (e) { alert(e.message); }
    }));

  secao.querySelectorAll("[data-override]").forEach((input) => {
    input.addEventListener("change", async () => {
      const [mes, colaboradorId, campo] = input.dataset.override.split("|");
      try {
        await api("/folha/overrides", {
          method: "PUT",
          body: JSON.stringify({ mes, colaboradorId, campo, valor: Number(input.value) || 0 }),
        });
        await carregarFolhaPagamento();
      } catch (e) { alert(e.message); }
    });
  });
  secao.querySelectorAll("[data-reset-override]").forEach((b) =>
    b.addEventListener("click", async () => {
      const [mes, colaboradorId, campo] = b.dataset.resetOverride.split("|");
      try {
        await api(`/folha/overrides/${mes}/${colaboradorId}/${campo}`, { method: "DELETE" });
        await carregarFolhaPagamento();
      } catch (e) { alert(e.message); }
    }));
}

// ----------------------------------------------------------- controle interno
function renderControleInterno(dados) {
  let somaBase = 0, somaDiaria = 0, somaVtRs = 0, somaFerias = 0, somaTotal = 0;
  const linhas = dados.linhas.map((l) => {
    if (!l.temGrade) {
      return `<tr><td>${escapar(l.nome)}</td><td>${TIPO_FOLHA_LABEL[l.tipo]}</td><td class="num" colspan="8" style="color:var(--erro)">sem grade horária cadastrada</td></tr>`;
    }
    somaBase += l.valorBase; somaDiaria += l.diariasBonus; somaVtRs += l.vtRs; somaFerias += l.diasFerias; somaTotal += l.total;
    return `<tr>
      <td>${escapar(l.nome)}</td>
      <td>${TIPO_FOLHA_LABEL[l.tipo]}</td>
      <td class="num">${l.niveis.join(", ") || "—"}</td>
      <td class="num">${l.horasNoMes ? l.horasNoMes.toFixed(0) + "h" : "—"}</td>
      <td class="num">${fmt.moeda(l.rhMedio)}</td>
      <td class="num">${fmt.moeda(l.valorBase)}</td>
      <td class="num">${fmt.moeda(l.diariasBonus)}</td>
      <td class="num">${l.diasVt}</td>
      <td class="num">${fmt.moeda(l.vtRs)}</td>
      <td class="num">${l.diasFerias}</td>
      <td class="num" style="font-weight:600">${fmt.moeda(l.total)}</td>
    </tr>`;
  }).join("");

  return `
    <div class="cartao">
      ${dados.linhas.length ? `
        <div class="rolagem">
          <table class="tabelinha">
            <tr><th>Colaborador</th><th>Tipo</th><th class="num">Nível(is)</th><th class="num">Horas no Mês</th><th class="num">R$/h médio</th>
              <th class="num">Valor Base</th><th class="num">Diárias/Bônus</th><th class="num">Dias VT ${rotuloMes(dados.proxMes)}</th>
              <th class="num">VT em R$</th><th class="num">Férias (dias)</th><th class="num">Total Estimado</th></tr>
            ${linhas}
            <tr class="footrow" style="font-weight:600">
              <td colspan="5">SOMATÓRIO GERAL (estimativa)</td>
              <td class="num">${fmt.moeda(somaBase)}</td><td class="num">${fmt.moeda(somaDiaria)}</td><td class="num">—</td>
              <td class="num">${fmt.moeda(somaVtRs)}</td><td class="num">${somaFerias}</td><td class="num">${fmt.moeda(somaTotal)}</td>
            </tr>
          </table>
        </div>` : `<div class="vazio">Nenhum colaborador cadastrado.</div>`}
    </div>`;
}

function folhaControleInternoHTML() {
  const mes = folha.ciMes;
  const dados = folha.ciDados;
  return `
    <div class="cartao no-imprimir">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="campo" style="flex:0 0 180px"><label class="rotulo" for="ci_mes">Mês de referência</label>
          <select id="ci_mes">
            ${mesesParaSeletor().map((m) => `<option value="${m}" ${mes === m ? "selected" : ""}>${rotuloMes(m)}</option>`).join("")}
          </select></div>
        <button class="botao fantasma" type="button" id="btnImprimirInterno">Imprimir</button>
      </div>
      <p class="meta" style="margin-top:10px">
        Só controle nosso — não é o que vai pra contabilidade. Valor estimado em R$ de tudo: quanto cada um faz por hora,
        quanto isso dá em bolsa/diária, o VT já em R$ e o total estimado do mês.
      </p>
    </div>
    ${!dados ? `<div class="carregando">Carregando…</div>` : dados.erro ? aviso({ message: dados.erro }) : renderControleInterno(dados)}`;
}

function ligarFolhaControleInterno() {
  el("ci_mes")?.addEventListener("change", (e) => {
    folha.ciMes = e.target.value;
    folha.ciDados = null;
    pintarFolha();
    carregarControleInterno();
  });
  el("btnImprimirInterno")?.addEventListener("click", () => window.print());
}

async function decidirTela() {
  try {
    const eu = await api("/auth/eu");
    pintarNavegacao(el("areas"), eu, "socios");
    pintarNavegacao(el("areasSemPermissao"), eu, "socios");

    if (!eu.papeis.includes("SOCIO")) {
      el("emailSemPermissao").textContent = eu.email || "";
      return mostrar("semPermissao");
    }

    mostrar("app");
    pintarUsuario();
    abrirAba("painel");
  } catch {
    sair();
  }
}

async function iniciar() {
  if (Sessao.token && Sessao.usuario) {
    pintarUsuario();
    return decidirTela();
  }
  mostrar("login");
  montarLogin(el("botaoGoogle"), concluirLogin, (mensagem) => {
    el("erroLogin").textContent = mensagem;
    el("erroLogin").classList.remove("oculto");
  });
}

iniciar();
</script>
