<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Matrícula · SE7 Vôlei de Praia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d6f7a'/%3E%3Cpath d='M16 1c6 6 6 24 0 30M1 16c8-5 22-5 30 0M6 5c2 8 8 17 16 22' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topo">
  <div class="marca"><span class="se7">SE7</span><span class="sub">Vôlei de Praia</span></div>
</header>

<main class="pagina" id="tela">
  <div class="carregando">Carregando as turmas…</div>
</main>

<script type="module">
import { api, ErroApi, fmt, escapar } from "/app.js";

/**
 * Matrícula pelo site.
 *
 * O passo a passo é o mesmo do site atual, na mesma ordem: dados do aluno,
 * turma, plano, confirmação. Não copiei por copiar — a ordem tem razão de
 * ser: quem chega pelo Instagram já sabe que quer treinar e digita o nome
 * sem pensar; a decisão difícil (qual turma cabe na minha semana) vem depois,
 * quando a pessoa já investiu trinta segundos e não desiste à toa.
 *
 * Uma pergunta por tela, com Voltar sempre disponível. É como a tela de
 * vocês funciona no celular, e é o formato certo para quem preenche em pé,
 * na saída do trabalho.
 *
 * A matrícula nasce registrada e o administrativo confirma. Os boletos do
 * plano são lançados depois.
 */

const el = (id) => document.getElementById(id);

const DIAS = {
  DOMINGO: "Dom", SEGUNDA: "Seg", TERCA: "Ter", QUARTA: "Qua",
  QUINTA: "Qui", SEXTA: "Sex", SABADO: "Sáb",
};
const ORDEM = Object.keys(DIAS);

/**
 * "Seg/Qua 17:00 às 18:30 e Sex 17:00 às 19:00".
 *
 * Os dias que compartilham o mesmo horário são agrupados. O SE7+90 treina
 * 1h30 na segunda e quarta e 2h na sexta: listar dia a dia repetiria o mesmo
 * horário duas vezes e ainda esconderia que a sexta é diferente.
 */
function horarioLegivel(horarios) {
  if (!horarios.length) return "";

  const blocos = new Map();
  for (const h of [...horarios].sort((a, b) => ORDEM.indexOf(a.dia) - ORDEM.indexOf(b.dia))) {
    const chave = `${h.inicio}|${h.fim}`;
    if (!blocos.has(chave)) blocos.set(chave, { dias: [], inicio: h.inicio, fim: h.fim });
    blocos.get(chave).dias.push(DIAS[h.dia]);
  }

  return [...blocos.values()]
    .map((b) => `${b.dias.join("/")} ${b.inicio} às ${b.fim}`)
    .join(" e ");
}

const estado = {
  passo: 0,
  catalogo: null,
  aluno: { nome: "", nascimento: "", telefone: "", email: "", cpf: "" },
  // O adulto se matricula sozinho; para menor, os dados são do responsável
  // financeiro.
  ehMenor: false,
  resp: { nome: "", cpf: "", telefone: "", email: "" },
  // Endereço do responsável financeiro. Fica fora de `aluno`/`resp` de
  // propósito: é a mesma pessoa nos dois casos, e duplicar daria dois lugares
  // para dessincronizar quando a caixa "é menor" é marcada.
  endereco: { cep: "", logradouro: "", numero: "", complemento: "", bairro: "", cidade: "", estado: "" },
  buscandoCep: false,
  recadoCep: "",
  unidadeId: "",
  categoria: "",
  turmaId: "",
  planoId: "",
  aceitou: false,
  erro: "",
  enviando: false,
  recibo: null,
};

const PASSOS = ["Aluno", "Turma", "Plano", "Confirmação"];

async function iniciar() {
  try {
    estado.catalogo = await api("/publico/catalogo");
    pintar();
  } catch (e) {
    el("tela").innerHTML = `<div class="aviso erro">${escapar(e.message)}</div>`;
  }
}

const unidade = () => estado.catalogo.unidades.find((u) => u.id === estado.unidadeId);
const turma = () => unidade()?.turmas.find((t) => t.id === estado.turmaId);
const plano = () => turma()?.planos.find((p) => p.id === estado.planoId);

/**
 * O responsável financeiro: o próprio aluno quando adulto, ou o responsável
 * quando ele é menor.
 */
const responsavelFinanceiro = () =>
  estado.ehMenor
    ? estado.resp
    : { nome: estado.aluno.nome, cpf: estado.aluno.cpf, telefone: estado.aluno.telefone, email: estado.aluno.email };

function passoValido() {
  const p = responsavelFinanceiro();
  const digitos = (v) => v.replace(/\D/g, "");
  switch (estado.passo) {
    case 0:
      return (
        estado.aluno.nome.trim().length > 2 &&
        estado.aluno.nascimento &&
        digitos(estado.aluno.telefone).length >= 10 &&
        digitos(p.cpf).length === 11 &&
        (!estado.ehMenor || estado.resp.nome.trim().length > 2) &&
        enderecoValido()
      );
    case 1: return Boolean(estado.turmaId);
    case 2: return Boolean(estado.planoId);
    case 3: return estado.aceitou;
    default: return false;
  }
}

function enderecoValido() {
  const e = estado.endereco;
  return (
    e.cep.replace(/\D/g, "").length === 8 &&
    e.logradouro.trim().length > 2 &&
    e.numero.trim().length > 0 &&
    e.bairro.trim().length > 1 &&
    e.cidade.trim().length > 1 &&
    e.estado.trim().length === 2
  );
}

function trilha() {
  return `
    <div class="trilha">
      ${PASSOS.map((nome, i) => `
        <div class="etapa ${i === estado.passo ? "agora" : i < estado.passo ? "feita" : ""}">
          <span class="bolha">${i < estado.passo ? "✓" : i + 1}</span>
          <span class="nome">${nome}</span>
        </div>`).join("")}
    </div>`;
}

// ------------------------------------------------------------ passo 1
function passoAluno() {
  const a = estado.aluno;
  return `
    <h1 class="titulo-passo">Seja bem-vindo</h1>
    <p class="meta" style="text-align:center;margin:0 0 20px">Preencha os dados do aluno</p>

    <div class="cartao">
      <div class="pilha" style="gap:14px">
        <div class="campo">
          <label class="rotulo" for="alNome">Nome completo do aluno</label>
          <input id="alNome" data-aluno="nome" value="${escapar(a.nome)}" autocomplete="name">
        </div>
        <div class="campo">
          <label class="rotulo" for="alNasc">Data de nascimento</label>
          <input id="alNasc" type="date" data-aluno="nascimento" value="${a.nascimento}">
        </div>
        <div class="campo">
          <label class="rotulo" for="alTel">WhatsApp</label>
          <input id="alTel" data-aluno="telefone" inputmode="tel" placeholder="(83) 99999-0000"
                 value="${escapar(a.telefone)}" autocomplete="tel">
        </div>
        <div class="campo">
          <label class="rotulo" for="alEmail">E-mail</label>
          <input id="alEmail" type="email" data-aluno="email" value="${escapar(a.email)}" autocomplete="email">
        </div>

        <label class="marcavel">
          <input type="checkbox" id="ehMenor" ${estado.ehMenor ? "checked" : ""}>
          <span>O aluno é menor de 18 anos</span>
        </label>

        ${estado.ehMenor ? `
          <div class="rotulo" style="margin-top:4px">Responsável financeiro</div>
          <div class="campo">
            <label class="rotulo" for="rNome">Nome do responsável</label>
            <input id="rNome" data-resp="nome" value="${escapar(estado.resp.nome)}">
          </div>
          <div class="campo">
            <label class="rotulo" for="rCpf">CPF do responsável</label>
            <input id="rCpf" data-resp="cpf" inputmode="numeric" placeholder="000.000.000-00"
                   value="${escapar(estado.resp.cpf)}">
          </div>
          <div class="campo">
            <label class="rotulo" for="rTel">WhatsApp do responsável</label>
            <input id="rTel" data-resp="telefone" inputmode="tel" value="${escapar(estado.resp.telefone)}">
          </div>
          <div class="campo">
            <label class="rotulo" for="rEmail">E-mail do responsável</label>
            <input id="rEmail" type="email" data-resp="email" value="${escapar(estado.resp.email)}">
          </div>` : `
          <div class="campo">
            <label class="rotulo" for="alCpf">CPF</label>
            <input id="alCpf" data-aluno="cpf" inputmode="numeric" placeholder="000.000.000-00"
                   value="${escapar(a.cpf)}">
          </div>`}

        ${blocoEndereco()}
      </div>
    </div>`;
}

/**
 * Endereço, com busca pelo CEP.
 *
 * O CEP preenche rua, bairro, cidade e estado — restam número e complemento
 * para digitar. Mas nenhum campo fica travado: se a busca falhar, ou o CEP for
 * de uma rua nova que o serviço ainda não tem, a pessoa escreve por cima. Um
 * serviço de CEP fora do ar não pode custar uma matrícula.
 */
function blocoEndereco() {
  const e = estado.endereco;
  return `
    <div class="rotulo" style="margin-top:4px">Endereço do responsável financeiro</div>

    <div class="campo">
      <label class="rotulo" for="endCep">CEP</label>
      <div style="display:flex;gap:8px">
        <input id="endCep" data-end="cep" inputmode="numeric" placeholder="58000-000"
               maxlength="9" style="flex:1" value="${escapar(e.cep)}" autocomplete="postal-code">
        <button class="botao fantasma" type="button" id="btnCep"
                ${estado.buscandoCep ? "disabled" : ""}>
          ${estado.buscandoCep ? "Buscando…" : "Buscar"}
        </button>
      </div>
      ${estado.recadoCep ? `<span class="meta">${escapar(estado.recadoCep)}</span>` : ""}
    </div>

    <div class="campo">
      <label class="rotulo" for="endRua">Rua</label>
      <input id="endRua" data-end="logradouro" value="${escapar(e.logradouro)}" autocomplete="address-line1">
    </div>

    <div style="display:flex;gap:10px">
      <div class="campo" style="flex:1">
        <label class="rotulo" for="endNum">Número</label>
        <input id="endNum" data-end="numero" value="${escapar(e.numero)}">
      </div>
      <div class="campo" style="flex:2">
        <label class="rotulo" for="endCompl">Complemento</label>
        <input id="endCompl" data-end="complemento" placeholder="apto, bloco…"
               value="${escapar(e.complemento)}">
      </div>
    </div>

    <div class="campo">
      <label class="rotulo" for="endBairro">Bairro</label>
      <input id="endBairro" data-end="bairro" value="${escapar(e.bairro)}">
    </div>

    <div style="display:flex;gap:10px">
      <div class="campo" style="flex:3">
        <label class="rotulo" for="endCidade">Cidade</label>
        <input id="endCidade" data-end="cidade" value="${escapar(e.cidade)}">
      </div>
      <div class="campo" style="flex:1">
        <label class="rotulo" for="endUf">UF</label>
        <input id="endUf" data-end="estado" maxlength="2" value="${escapar(e.estado)}">
      </div>
    </div>`;
}

// ------------------------------------------------------------ passo 2
function passoTurma() {
  const u = unidade();
  const visiveis = (u?.turmas ?? []).filter(
    (t) => !estado.categoria || t.categoria === estado.categoria,
  );

  return `
    <h1 class="titulo-passo">Selecione uma turma</h1>
    <p class="meta" style="text-align:center;margin:0 0 20px">Escolha a unidade e a categoria</p>

    <div class="cartao" style="margin-bottom:14px">
      <div class="pilha" style="gap:14px">
        <div class="campo">
          <label class="rotulo" for="selUnidade">Unidade</label>
          <select class="selecao" id="selUnidade">
            <option value="">Selecione…</option>
            ${estado.catalogo.unidades.map((x) => `
              <option value="${x.id}" ${x.id === estado.unidadeId ? "selected" : ""}>${escapar(x.nome)}</option>`).join("")}
          </select>
          ${u?.endereco ? `<span class="meta">${escapar(u.endereco)}</span>` : ""}
        </div>
        <div class="campo">
          <label class="rotulo" for="selCategoria">Categoria</label>
          <select class="selecao" id="selCategoria">
            <option value="">Todas</option>
            ${estado.catalogo.categorias.map((c) => `
              <option value="${escapar(c)}" ${c === estado.categoria ? "selected" : ""}>${escapar(c)}</option>`).join("")}
          </select>
        </div>
      </div>
    </div>

    ${!estado.unidadeId ? "" : visiveis.length === 0
      ? `<div class="cartao"><div class="vazio">Nenhuma turma com vaga nessa combinação.</div></div>`
      : visiveis.map((t) => `
          <button class="escolha ${t.id === estado.turmaId ? "escolhida" : ""}" type="button" data-turma="${t.id}">
            <span class="escolha-titulo">${escapar(t.nome)}</span>
            <span class="escolha-linha">${escapar(horarioLegivel(t.horarios))}</span>
            ${t.vagas === null ? "" : `<span class="escolha-meta">${t.vagas} vaga${t.vagas === 1 ? "" : "s"}</span>`}
          </button>`).join("")}`;
}

// ------------------------------------------------------------ passo 3
function passoPlano() {
  const t = turma();
  return `
    <h1 class="titulo-passo">Selecione um plano</h1>
    <p class="meta" style="text-align:center;margin:0 0 20px">${escapar(t.nome)}</p>

    ${t.planos.map((p) => `
      <button class="escolha ${p.id === estado.planoId ? "escolhida" : ""}" type="button" data-plano="${p.id}">
        <span class="escolha-titulo">${escapar(p.nome)}</span>
        ${p.descricao ? `<span class="escolha-linha">${escapar(p.descricao)}</span>` : ""}
        <span class="escolha-meta">
          ${fmt.moeda(p.valor)} por mês · ${p.parcelas} ${p.parcelas === 1 ? "mês" : "meses"}
          ${p.desconto ? ` · ${p.desconto}% de desconto até o vencimento` : ""}
        </span>
      </button>`).join("")}`;
}

// ------------------------------------------------------------ passo 4
function passoConfirmacao() {
  const p = responsavelFinanceiro();
  const t = turma();
  const pl = plano();
  const taxa = estado.catalogo.taxaMatricula;
  const termos = estado.catalogo.linkTermos;

  const linha = (rotulo, valor) => `
    <div class="linha-confirma">
      <span class="meta">${rotulo}</span>
      <strong style="text-align:right">${escapar(String(valor))}</strong>
    </div>`;

  return `
    <h1 class="titulo-passo">Quase lá</h1>
    <p class="meta" style="text-align:center;margin:0 0 20px">Confira seus dados de matrícula</p>

    <div class="cartao">
      ${linha("Aluno", estado.aluno.nome)}
      ${linha("Data nasc.", fmt.data(estado.aluno.nascimento))}
      ${estado.ehMenor ? linha("Responsável", estado.resp.nome) : ""}
      ${linha("Telefone", p.telefone)}
      ${linha("E-mail", p.email || "não informado")}
      ${linha("CPF", fmt.cpf(p.cpf))}
      ${linha("Unidade", t.unidadeNome ?? unidade().nome)}
      ${linha("Turma", t.nome)}
      ${linha("Plano", pl.nome)}
      ${linha("Taxa de matrícula", fmt.moeda(taxa))}
      ${linha("Mensalidade", fmt.moeda(pl.valor))}
    </div>

    <label class="marcavel" style="margin:18px 4px 0">
      <input type="checkbox" id="aceite" ${estado.aceitou ? "checked" : ""}>
      <span>Li e aceito ${termos
        ? `os <a href="${escapar(termos)}" target="_blank" rel="noopener">termos de uso</a>`
        : "os termos de uso"} e as condições do plano.</span>
    </label>`;
}

function pintar() {
  if (estado.recibo) return pintarRecibo();

  const corpo = [passoAluno, passoTurma, passoPlano, passoConfirmacao][estado.passo]();
  const ultimo = estado.passo === PASSOS.length - 1;

  el("tela").innerHTML = `
    ${trilha()}
    ${corpo}
    <div class="aviso erro ${estado.erro ? "" : "oculto"}" style="margin-top:14px">${escapar(estado.erro)}</div>
    <div class="barra-passos">
      ${estado.passo > 0 ? `<button class="botao fantasma" type="button" id="btnVoltar">Voltar</button>` : ""}
      <button class="botao" type="button" id="btnAvancar" ${passoValido() && !estado.enviando ? "" : "disabled"}>
        ${estado.enviando ? "Enviando…" : ultimo ? "Confirmar matrícula" : "Avançar"}
      </button>
    </div>`;

  ligar();
}

function pintarRecibo() {
  const r = estado.recibo;
  el("tela").innerHTML = `
    <div class="cartao" style="text-align:center">
      <div style="font-size:40px;line-height:1">🏐</div>
      <h1 style="font-size:22px;margin:10px 0">${escapar(r.mensagem)}</h1>
      <p class="meta">Guarde esta tela ou tire um print.</p>
      <p class="meta" style="margin-top:6px">
        Os boletos do plano são lançados depois da confirmação.
      </p>
    </div>

    <div class="cartao" style="margin-top:14px">
      <div class="rotulo" style="margin-bottom:8px">Acompanhe pelo portal</div>
      <p class="meta" style="margin:0 0 10px">
        Entre com o seu Gmail ou crie uma senha, e informe este mesmo CPF para
        ligar a conta ao cadastro. Lá você vê a frequência, as faturas e envia a
        foto do aluno.
      </p>
      <a class="link-botao" href="/index.html">Abrir o portal</a>
    </div>

    <div class="cartao" style="margin-top:14px">
      <div class="rotulo" style="margin-bottom:8px">O que foi matriculado</div>
      ${r.matriculas.map((m) => `
        <div class="registro">
          <div class="titulo">${escapar(m.aluno)}</div>
          <div class="meta">${escapar(m.turma)} · ${escapar(m.unidade)}</div>
          <div class="meta">${escapar(m.plano)} · ${fmt.moeda(m.valor)} em ${m.parcelas}x</div>
        </div>`).join("")}
    </div>

    ${r.grupos.length ? `
      <div class="cartao" style="margin-top:14px">
        <div class="rotulo" style="margin-bottom:8px">Grupo da turma no WhatsApp</div>
        ${r.grupos.map((g) => `
          <div class="item">
            <div class="corpo"><div class="titulo">${escapar(g.turma)}</div></div>
            <div class="lado">
              <a class="link-botao" href="${escapar(g.link)}" target="_blank" rel="noopener">Entrar</a>
            </div>
          </div>`).join("")}
      </div>` : ""}`;
}

function ligar() {
  // Os campos vão para o estado a cada tecla; só o botão Avançar é atualizado,
  // porque redesenhar a tela inteira tiraria o foco de quem está digitando.
  document.querySelectorAll("[data-aluno]").forEach((c) =>
    c.addEventListener("input", (e) => {
      estado.aluno[e.target.dataset.aluno] = e.target.value;
      atualizarAvancar();
    }));

  document.querySelectorAll("[data-resp]").forEach((c) =>
    c.addEventListener("input", (e) => {
      estado.resp[e.target.dataset.resp] = e.target.value;
      atualizarAvancar();
    }));

  document.querySelectorAll("[data-end]").forEach((c) =>
    c.addEventListener("input", (e) => {
      const campo = e.target.dataset.end;
      estado.endereco[campo] = campo === "estado" ? e.target.value.toUpperCase() : e.target.value;
      atualizarAvancar();
      // Oito dígitos digitados: busca sozinho, uma vez por CEP. Sem isto a
      // pessoa precisa perceber que existe um botão.
      if (campo === "cep" && digitosDoCep() !== ultimoCepBuscado) buscarEndereco();
    }));

  el("btnCep")?.addEventListener("click", () => {
    ultimoCepBuscado = "";
    buscarEndereco();
  });

  el("ehMenor")?.addEventListener("change", (e) => {
    estado.ehMenor = e.target.checked;
    pintar();
  });

  el("selUnidade")?.addEventListener("change", (e) => {
    estado.unidadeId = e.target.value;
    // Turma e plano pertencem à unidade: trocar de unidade zera a escolha,
    // senão sobra uma turma de outro bairro na matrícula.
    estado.turmaId = "";
    estado.planoId = "";
    pintar();
  });

  el("selCategoria")?.addEventListener("change", (e) => {
    estado.categoria = e.target.value;
    estado.turmaId = "";
    estado.planoId = "";
    pintar();
  });

  document.querySelectorAll("[data-turma]").forEach((b) =>
    b.addEventListener("click", () => {
      estado.turmaId = b.dataset.turma;
      estado.planoId = "";
      pintar();
    }));

  document.querySelectorAll("[data-plano]").forEach((b) =>
    b.addEventListener("click", () => {
      estado.planoId = b.dataset.plano;
      pintar();
    }));

  el("aceite")?.addEventListener("change", (e) => {
    estado.aceitou = e.target.checked;
    atualizarAvancar();
  });

  el("btnVoltar")?.addEventListener("click", () => {
    estado.passo -= 1;
    estado.erro = "";
    pintar();
    window.scrollTo({ top: 0 });
  });

  el("btnAvancar")?.addEventListener("click", () => {
    if (estado.passo === PASSOS.length - 1) return enviar();
    estado.passo += 1;
    estado.erro = "";
    pintar();
    window.scrollTo({ top: 0 });
  });
}

let ultimoCepBuscado = "";

/**
 * Preenche o endereço a partir do CEP.
 *
 * Só sobrescreve rua, bairro, cidade e estado — número e complemento são de
 * quem mora lá, e o serviço não os conhece. Qualquer falha vira um recado e os
 * campos seguem editáveis: a matrícula nunca depende deste serviço.
 */
async function buscarEndereco() {
  const cep = digitosDoCep();
  if (cep.length !== 8 || estado.buscandoCep) return;

  ultimoCepBuscado = cep;
  estado.buscandoCep = true;
  estado.recadoCep = "";
  pintar();

  try {
    const e = await api(`/publico/cep/${cep}`);
    estado.endereco.logradouro = e.logradouro || estado.endereco.logradouro;
    estado.endereco.bairro = e.bairro || estado.endereco.bairro;
    estado.endereco.cidade = e.cidade || estado.endereco.cidade;
    estado.endereco.estado = e.estado || estado.endereco.estado;
    estado.recadoCep = e.logradouro ? "" : "Este CEP não tem rua definida. Escreva a rua.";
  } catch (erro) {
    estado.recadoCep = erro.message;
  } finally {
    estado.buscandoCep = false;
    pintar();
    // O próximo campo a preencher é sempre o número, e é o único que a busca
    // não tem como saber.
    el("endNum")?.focus();
  }
}

const digitosDoCep = () => estado.endereco.cep.replace(/\D/g, "");

function atualizarAvancar() {
  const botao = el("btnAvancar");
  if (botao) botao.disabled = !passoValido() || estado.enviando;
}

async function enviar() {
  estado.enviando = true;
  estado.erro = "";
  pintar();

  const p = responsavelFinanceiro();

  try {
    estado.recibo = await api("/publico/matricula", {
      method: "POST",
      body: JSON.stringify({
        aluno: {
          nome: estado.aluno.nome.trim(),
          nascimento: estado.aluno.nascimento,
          turmaId: estado.turmaId,
          planoId: estado.planoId,
        },
        irmaos: [],
        responsavelEhOAluno: !estado.ehMenor,
        responsavel: {
          nome: estado.ehMenor ? estado.resp.nome.trim() : undefined,
          cpf: p.cpf,
          telefone: p.telefone.trim(),
          email: (p.email || "").trim(),
          endereco: {
            cep: estado.endereco.cep.replace(/\D/g, ""),
            logradouro: estado.endereco.logradouro.trim(),
            numero: estado.endereco.numero.trim(),
            complemento: estado.endereco.complemento.trim(),
            bairro: estado.endereco.bairro.trim(),
            cidade: estado.endereco.cidade.trim(),
            estado: estado.endereco.estado.trim().toUpperCase(),
          },
        },
        aceitouTermos: true,
      }),
    });
  } catch (e) {
    estado.erro =
      e instanceof ErroApi && e.status === 429
        ? "Muitos envios deste aparelho. Tente de novo daqui a pouco ou fale com o administrativo."
        : e.message;
  } finally {
    estado.enviando = false;
    pintar();
    window.scrollTo({ top: 0 });
  }
}

iniciar();
</script>
